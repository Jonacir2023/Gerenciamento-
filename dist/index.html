const STATUS = {afazer:'A fazer',fazendo:'Fazendo',concluido:'Concluído',cancelado:'Cancelado'};
const RDO_FIELDS = ['Data','Dia da Semana','Obra','Empresa','Cidade','Local da Obra','Descrição do Local','Tempo/Clima','Jornada','DSS Horário','DSS Ministrado Por','DSS Tema','Atividades do Dia','Efetivo Total','Efetivo por Função','Colaboradores Presentes','Equipamentos Utilizados','Veículos Leves','Veículos/Equipamentos Parados','Eventos de Segurança','Eventos de Meio Ambiente','Observações do Dia','Apontador','Fotos','RDO Nº'];
const clone = x => JSON.parse(JSON.stringify(x));
const uid = () => globalThis.crypto.randomUUID();
const today = () => {const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const active = t => ['afazer','fazendo'].includes(t.status);
const overdue = (t,date=today()) => active(t)&&!!t.due&&t.due<date;
function requireWork(s,id){if(!s.works.some(w=>w.id===id))throw Error('Obra não encontrada.');}
function validateTask(s,t){requireWork(s,t.obraId);if(!t.title.trim()||!t.owner.trim()||!t.sector.trim())throw Error('Preencha assunto, responsável e setor.');if(!(t.status in STATUS))throw Error('Estado desconhecido: exige conciliação.');if(!['alta','media','baixa'].includes(t.priority))throw Error('Prioridade inválida.');if(!t.created||!t.due||t.due<t.created)throw Error('O prazo não pode ser anterior ao lançamento.');}
function saveTask(s,t,reason='') {validateTask(s,t);const old=s.tasks.find(x=>x.id===t.id);if(old&&old.obraId!==t.obraId)throw Error('Não é permitido transferir o registro entre obras.');if(((t.status==='cancelado'&&old?.status!=='cancelado')||(old&&!active(old)&&active(t)))&&!reason.trim())throw Error('Informe a justificativa do cancelamento ou reabertura.');const next=clone(t);next.history=clone(old?.history||[]);next.history.push({at:new Date().toISOString(),from:old?.status||null,to:t.status,reason,action:old?'edição':'criação'});if(old)s.tasks[s.tasks.indexOf(old)]=next;else s.tasks.push(next);return next;}
function saveMeeting(s,m){requireWork(s,m.obraId);if(!m.title.trim()||!m.date||!m.time||!m.participants.trim())throw Error('Preencha título, data, hora e participantes.');const ids=new Set(m.taskIds);const tasks=s.tasks.filter(t=>ids.has(t.id));if(tasks.length!==ids.size||tasks.some(t=>t.obraId!==m.obraId))throw Error('Pauta incompatível com a obra.');const meeting={...clone(m),id:uid(),createdAt:new Date().toISOString(),snapshot:clone(tasks)};delete meeting.taskIds;s.meetings.push(meeting);return meeting;}
function saveRdo(s,r){requireWork(s,r.obraId);if(!r.fields.Data||!r.fields.Apontador?.trim()||!r.fields['Atividades do Dia']?.trim())throw Error('Informe data, apontador e atividades.');const old=s.rdos.find(x=>x.id===r.id);if(old&&old.obraId!==r.obraId)throw Error('Obra incompatível.');if(r.fields['Efetivo Total']!==''&&r.fields['Efetivo Total']!=null&&(!Number.isInteger(Number(r.fields['Efetivo Total']))||Number(r.fields['Efetivo Total'])<0))throw Error('Efetivo deve ser inteiro e não negativo.');const work=s.works.find(w=>w.id===r.obraId);const fields=Object.fromEntries(RDO_FIELDS.map(k=>[k,String(r.fields[k]??'')]));fields.Obra=work.name;fields['Dia da Semana']=new Intl.DateTimeFormat('pt-BR',{weekday:'long',timeZone:'UTC'}).format(new Date(fields.Data+'T12:00:00Z'));const result={id:r.id,obraId:r.obraId,fields,status:'rascunho',version:(old?.version||0)+1,updatedAt:new Date().toISOString()};if(old)s.rdos[s.rdos.indexOf(old)]=result;else s.rdos.push(result);return result;}
function seed(){const d=today();const add=n=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};return {schema:1,revision:0,works:[{id:'demo-a',name:'Obra Horizonte',city:'Uberaba / MG',company:'Construtora Exemplo',type:'Industrial'},{id:'demo-b',name:'Obra Parque',city:'Florianópolis / SC',company:'Construtora Exemplo',type:'Edificação'}],tasks:[['Conferir cotas da rede de drenagem','Engenharia','Marina Costa','alta','fazendo',-1],['Liberar frente para concretagem','Produção','Carlos Lima','alta','afazer',0],['Conferir entrega de tubos PEAD','Suprimentos','Rafael Souza','media','afazer',1],['Revisar sinalização de acesso','Segurança','Ana Ribeiro','alta','fazendo',0],['Registrar ensaio de compactação','Qualidade','Marina Costa','media','concluido',-1],['Locação de equipamento adicional','Produção','Carlos Lima','baixa','cancelado',-2]].map((a,i)=>({id:'t'+i,obraId:'demo-a',title:a[0],sector:a[1],owner:a[2],priority:a[3],status:a[4],due:add(a[5]),created:add(-5),description:'Registro fictício para avaliação do fluxo operacional.',creator:'Equipe de demonstração',history:[{at:new Date().toISOString(),from:null,to:a[4],reason:a[4]==='cancelado'?'Demanda substituída no exemplo.':'Dado demonstrativo',action:'criação'}]})),rdos:[],meetings:[]};}
globalThis.GerenciamentoCore={STATUS,RDO_FIELDS,clone,active,overdue,saveTask,saveMeeting,saveRdo,seed};

const meetings=()=>typeof moduleMeetings==='function'?moduleMeetings():state.meetings.filter(m=>m.obraId===workId);
function toast(msg,bad=false){const t=$('#toast');t.textContent=msg;t.className='toast show'+(bad?' error':'');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),6500);}
function openDB(){return new Promise((resolve,reject)=>{const request=indexedDB.open('gerenciamento-avaliacao-v1',1);request.onupgradeneeded=()=>request.result.createObjectStore('data');request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error);});}
function readDB(){return new Promise((resolve,reject)=>{const tx=db.transaction('data','readonly');const req=tx.objectStore('data').get('state');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
function writeDB(next,expected){return new Promise((resolve,reject)=>{const tx=db.transaction('data','readwrite'),store=tx.objectStore('data');let conflict=false;const req=store.get('state');req.onsuccess=()=>{if(req.result&&req.result.revision!==expected){conflict=true;tx.abort();return;}next.revision=expected+1;store.put(next,'state');};tx.oncomplete=()=>resolve();tx.onabort=()=>reject(Error(conflict?'Outra aba alterou os dados. Feche este formulário e recarregue antes de editar.':'Não foi possível salvar. Exporte seus dados e verifique o espaço disponível.'));tx.onerror=()=>{};});}
async function mutate(fn){if(!db)throw Error('Armazenamento indisponível.');const next=clone(state);fn(next);await writeDB(next,state.revision);state=next;saveMessage='Salvo neste navegador';render();}
const icons={overview:'▦',pauta:'≡',tasks:'▤',rdos:'▧',meetings:'◷',works:'⌂',roadmap:'◇'};
const names={overview:'Visão geral',pauta:'Pauta de demandas',tasks:'Quadro de tarefas',rdos:'Diário de obras',meetings:'Check-in de gestão',works:'Obras e cadastros',roadmap:'Plano de implantação'};
function navTo(next){view=next;query='';sectorFilter='';stateFilter='';periodFilter='all';render();$('#sidebar').classList.remove('open');}
function badge(status){return `<span class="badge ${esc(status)}">${esc(STATUS[status]||status)}</span>`;}
function taskTable(list){return list.length?`<div class="table-wrap"><table><thead><tr><th>Assunto / setor</th><th>Responsável</th><th>Prazo</th><th>Status</th><th></th></tr></thead><tbody>${list.map(t=>`<tr><td><button class="text-button subject" data-edit-task="${esc(t.id)}">${esc(t.title)}</button><small>${esc(t.sector)} · ${t.priority==='alta'?'Prioridade alta':t.priority==='media'?'Prioridade média':'Prioridade baixa'}</small></td><td>${esc(t.owner)}</td><td class="${overdue(t)?'late':''}">${dateLabel(t.due)}${overdue(t)?'<small>Em atraso</small>':''}</td><td>${badge(t.status)}</td><td><button class="icon-button" aria-label="Editar ${esc(t.title)}" data-edit-task="${esc(t.id)}">↗</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nenhuma demanda encontrada neste recorte.</div>';}
function overview(){const ts=tasks(),open=ts.filter(active),late=ts.filter(t=>overdue(t)),done=ts.filter(t=>t.status==='concluido'),rr=rdos();return `<div class="heading"><div><div class="eyebrow">ACOMPANHAMENTO DA OBRA</div><h1>Visão geral</h1><p>O que precisa da sua atenção hoje.</p></div><button class="primary" data-action="task">＋ Nova demanda</button></div><div class="metrics"><button class="metric" data-goto="tasks"><span>Demandas ativas <b>↗</b></span><strong>${open.length.toString().padStart(2,'0')}</strong><small>A fazer e fazendo</small></button><button class="metric" data-late="true"><span>Demandas em atraso <b>↗</b></span><strong class="orange">${late.length.toString().padStart(2,'0')}</strong><small>Prazo anterior a hoje</small></button><button class="metric" data-goto="rdos"><span>RDOs em rascunho <b>↗</b></span><strong>${rr.length.toString().padStart(2,'0')}</strong><small>Contribuições ainda não oficiais</small></button><button class="metric" data-goto="meetings"><span>Reuniões registradas <b>↗</b></span><strong>${meetings().length.toString().padStart(2,'0')}</strong><small>Com retrato da pauta</small></button></div><div class="dashboard-grid"><section class="panel"><div class="panel-head"><div><h2>Prioridades do dia</h2><p>Pendências vencidas ou com prazo para hoje</p></div><button class="text-button" data-goto="pauta">Ver pauta →</button></div>${taskTable(open.filter(t=>t.due<=today()).sort((a,b)=>a.due.localeCompare(b.due)))}</section><section class="panel daily"><span class="eyebrow">ROTINA DE CAMPO</span><h2>Da frente de serviço<br>ao registro do dia.</h2><p>Registre atividades, efetivo, equipamentos e acontecimentos da obra.</p><button class="primary" data-action="rdo">＋ Registrar diário</button><div class="rule"></div><span class="eyebrow">REUNIÃO OPERACIONAL</span><h3>Alinhe os próximos passos</h3><p>Reúna as pendências e preserve as decisões do Check-in.</p><button class="secondary" data-action="meeting">Abrir Check-in →</button></section></div><div class="bottom-grid"><section class="panel"><div class="panel-head"><h2>Distribuição das demandas</h2><span class="muted">${ts.length} registros</span></div><div class="distribution">${Object.entries(STATUS).map(([k,v])=>{const n=ts.filter(t=>t.status===k).length;return `<div><span>${v}</span><div class="bar"><i class="${k}" style="width:${ts.length?n/ts.length*100:0}%"></i></div><b>${n}</b></div>`}).join('')}</div><p class="footnote">Contagem de demandas. Não representa avanço físico nem PPC.</p></section><section class="panel"><div class="panel-head"><h2>Obra ativa</h2><span class="badge rascunho">Demonstração</span></div><div class="work-summary"><h3>${esc(work().name)}</h3><p>${esc(work().city)} · ${esc(work().type)}</p><p>${esc(work().company)}</p><button class="text-button" data-goto="works">Gerenciar obras →</button></div></section></div>`;}
function filteredTasks(){return tasks().filter(t=>(!query||[t.title,t.description,t.owner,t.sector].join(' ').toLowerCase().includes(query.toLowerCase()))&&(!sectorFilter||t.sector===sectorFilter)&&(!stateFilter||(stateFilter==='late'?overdue(t):t.status===stateFilter)));}
function filters(){return `<div class="filters"><label class="search"><span>⌕</span><input id="query" aria-label="Buscar assunto ou responsável" placeholder="Buscar assunto, setor ou responsável…" value="${esc(query)}"></label><select id="sectorFilter" aria-label="Filtrar setor"><option value="">Todos os setores</option>${[...new Set(tasks().map(t=>t.sector))].sort().map(x=>`<option ${sectorFilter===x?'selected':''}>${esc(x)}</option>`).join('')}</select><select id="stateFilter" aria-label="Filtrar status"><option value="">Todos os status</option>${Object.entries({...STATUS,late:'Em atraso'}).map(([k,v])=>`<option value="${k}" ${stateFilter===k?'selected':''}>${v}</option>`).join('')}</select><button class="secondary" id="csv">Exportar CSV</button></div>`;}
function taskView(board){const list=filteredTasks();return `<div class="heading"><div><div class="eyebrow">PAUTA E EXECUÇÃO</div><h1>${board?'Quadro de tarefas':'Pauta de demandas'}</h1><p>Um único registro acompanha a demanda até sua conclusão.</p></div><button class="primary" data-action="task">＋ Nova demanda</button></div>${filters()}${board?`<div class="kanban">${Object.entries(STATUS).map(([k,v])=>`<section class="column"><h2>${v}<span>${list.filter(t=>t.status===k).length}</span></h2>${list.filter(t=>t.status===k).map(t=>`<button class="task-card" data-edit-task="${esc(t.id)}"><span class="sector">${esc(t.sector)}</span><h3>${esc(t.title)}</h3><p>${esc(t.owner)}</p><div><span class="${overdue(t)?'late':''}">${dateLabel(t.due)}</span><span class="priority ${t.priority}">${t.priority==='alta'?'Alta':t.priority==='media'?'Média':'Baixa'}</span></div></button>`).join('')||'<p class="empty">Nenhuma demanda</p>'}</section>`).join('')}</div>`:`<section class="panel">${taskTable(list)}</section>`}`;}
function inPeriod(date){if(periodFilter==='all')return true;const start=new Date(today()+'T12:00:00');start.setDate(start.getDate()-(periodFilter==='week'?6:29));return date>=`${start.getFullYear()}-${String(start.getMonth()+1).padStart(2,'0')}-${String(start.getDate()).padStart(2,'0')}`&&date<=today();}
function recordView(kind){const isRdo=kind==='rdos';const list=(isRdo?rdos():meetings()).filter(x=>inPeriod(isRdo?x.fields.Data:x.date)).sort((a,b)=>(isRdo?b.fields.Data:b.date).localeCompare(isRdo?a.fields.Data:a.date));return `<div class="heading"><div><div class="eyebrow">${isRdo?'OPERAÇÃO DE CAMPO':'PAUTA E REUNIÕES'}</div><h1>${isRdo?'Diário de obras':'Check-in de gestão'}</h1><p>${isRdo?'Contribuições do dia, preservadas por obra e autor.':'Decisões e retratos históricos da pauta. Não é controle de presença.'}</p></div><button class="primary" data-action="${isRdo?'rdo':'meeting'}">＋ ${isRdo?'Novo diário':'Nova reunião'}</button></div><div class="filters"><label>Período <select id="periodFilter"><option value="all">Todo o histórico</option><option value="week" ${periodFilter==='week'?'selected':''}>Últimos 7 dias</option><option value="month" ${periodFilter==='month'?'selected':''}>Últimos 30 dias</option></select></label><span class="muted">Filtro pela data operacional, incluindo hoje.</span></div><section class="panel">${list.length?list.map(x=>`<div class="record"><div><span class="eyebrow">${dateLabel(isRdo?x.fields.Data:x.date)}${!isRdo?' · '+esc(x.time):''}</span><h3>${esc(isRdo?(x.fields['RDO Nº']?'RDO '+x.fields['RDO Nº']:'Contribuição de diário'):x.title)}</h3><p>${esc(isRdo?x.fields.Apontador:x.participants)}</p></div><div class="record-actions">${isRdo?'<span class="badge rascunho">Rascunho local · v'+x.version+'</span>':'<span class="badge concluido">Pauta preservada</span>'}<button class="secondary" data-${isRdo?'edit-rdo':'meeting-detail'}="${esc(x.id)}">${isRdo?'Abrir diário':'Ver ata'}</button><button class="secondary" data-print="${isRdo?'rdo':'meeting'}:${esc(x.id)}">Imprimir</button></div></div>`).join(''):`<div class="empty big"><h2>${isRdo?'O dia começa com um registro.':'Sua próxima reunião começa aqui.'}</h2><p>${isRdo?'Adicione o primeiro diário desta obra.':'Selecione a pauta, registre decisões e salve o retrato da reunião.'}</p><button class="primary" data-action="${isRdo?'rdo':'meeting'}">${isRdo?'Registrar diário':'Criar reunião'}</button></div>`}</section>`;}
const roadmap=[['01','Cadastros e multiobra','Base local','Cadastro de obras e separação visual dos registros. Pessoas, vínculos, equipes e permissões ainda pendentes.'],['02','Pauta e demandas','Base local','Criação e edição, filtros, responsáveis, prazos e histórico local. Anexos e comentários pendentes.'],['03','Check-in de gestão','Base local','Atas com retratos da pauta, decisões, filtros por período e impressão. Assinatura e calendário pendentes.'],['04','Tarefas e fluxo','Base local','Quadro compartilhado com Pauta; cancelamento e reabertura justificados. WIP transacional pendente.'],['05','Diário e RDO','Base local','25 campos de referência, rascunhos independentes e impressão. Fotos são referências textuais; aprovação e anexos pendentes.'],['06','Evidências e ocorrências','Planejado','Arquivos privados, inspeções, ações corretivas e vínculo com RDO.'],['07','Efetivo e equipamentos','Planejado','Presença, equipes, alocação, manutenção e horas conciliadas.'],['08','Planejamento e EAP','Planejado','EAP, cronogramas, restrições, programação, Curva S e PPC.'],['09','Custos e contratos','Planejado','Orçamento, aditivos, medições, NFs, pagamentos e forecast.'],['10','Compras e materiais','Planejado','Pedidos, recebimentos parciais, devoluções e estoque.'],['11','Documentos e projetos','Planejado','Revisões, distribuição e ciência. PDF antes de BIM.'],['12','Dashboards e relatórios','Base local','Indicadores operacionais derivados dos registros. Indicadores físicos e financeiros pendentes.'],['13','IA e integrações','Planejado','WhatsApp, transcrição, OCR e consultas com fontes e revisão humana.']];
function roadmapView(){return `<div class="heading"><div><div class="eyebrow">EVOLUÇÃO DO PRODUTO</div><h1>Plano de implantação</h1><p>Escopo completo preservado, com entregas por etapa.</p></div></div><div class="notice"><strong>Versão 0.1.0 · avaliação local</strong><p>Esta versão não tem autenticação, sincronização entre aparelhos, aprovação oficial, migração ou conexão com o banco de produção. Use somente dados de teste. “Base local” não significa módulo homologado.</p></div><section class="panel">${roadmap.map(([n,title,status,desc])=>`<div class="roadmap-row"><span class="module-number">${n}</span><div><h3>${title}</h3><p>${desc}</p></div><span class="badge ${status==='Planejado'?'rascunho':'fazendo'}">${status}</span></div>`).join('')}</section>`;}
function worksView(){return `<div class="heading"><div><div class="eyebrow">ADMINISTRAÇÃO</div><h1>Obras e cadastros</h1><p>Cadastros exclusivos deste ambiente de avaliação.</p></div><button class="primary" data-action="work">＋ Nova obra de teste</button></div><div class="work-grid">${state.works.map(w=>`<section class="panel work-tile"><span class="badge rascunho">${esc(w.type)}</span><h2>${esc(w.name)}</h2><p>${esc(w.city)}</p><p>${esc(w.company)}</p><button class="${w.id===workId?'secondary':'primary'}" data-work="${esc(w.id)}">${w.id===workId?'Obra ativa':'Selecionar obra →'}</button></section>`).join('')}</div><div class="notice"><strong>Pessoas, equipes e permissões</strong><p>O vínculo autenticado de cada pessoa à obra será implementado na fundação do servidor. A seleção de obra neste demonstrador é um filtro, não uma barreira de segurança.</p></div>`;}
function render(){if(!state)return;$('#workSelector').innerHTML=state.works.map(w=>`<option value="${esc(w.id)}" ${w.id===workId?'selected':''}>${esc(w.name)}</option>`).join('');$('#breadcrumb').textContent=names[view];$('#saved').textContent=saveMessage;$('#localdate').textContent=new Intl.DateTimeFormat('pt-BR',{day:'numeric',month:'long',year:'numeric'}).format(new Date());$('#nav').innerHTML=Object.keys(names).map(k=>`<button class="nav-item ${view===k?'selected':''}" data-goto="${k}" ${view===k?'aria-current="page"':''}><span>${icons[k]}</span>${names[k]}</button>`).join('');$('#main').innerHTML=view==='overview'?overview():view==='pauta'||view==='tasks'?taskView(view==='tasks'):view==='rdos'||view==='meetings'?recordView(view):view==='works'?worksView():roadmapView();}
function field(name,label,value='',type='text',required=false){return `<label>${esc(label)}${required?' *':''}<input name="${esc(name)}" type="${type}" value="${esc(value)}" ${required?'required':''} ${type==='number'?'min="0" step="1"':''} maxlength="500"></label>`;}
function area(name,label,value='',required=false){return `<label class="full">${esc(label)}${required?' *':''}<textarea name="${esc(name)}" rows="3" ${required?'required':''} maxlength="20000">${esc(value)}</textarea></label>`;}
function dialog(title,content,submit,wide=false){const d=$('#dialog');$('#dialog-title').textContent=title;$('#dialog-content').innerHTML=content;$('#form-error').textContent='';$('#dialog-save').hidden=!submit;d.className=wide?'wide':'';$('#form').onsubmit=async e=>{e.preventDefault();const button=$('#dialog-save');button.disabled=true;try{await submit(new FormData(e.target));d.close();toast('Salvo neste navegador.');}catch(err){$('#form-error').textContent=err.message;}finally{button.disabled=false;}};d.showModal();}
function taskDialog(id){const existing=state.tasks.find(t=>t.id===id&&t.obraId===workId);const t=existing||{id:uid(),obraId:workId,title:'',description:'',owner:'',sector:'Produção',creator:'',created:today(),due:today(),priority:'media',status:'afazer'};dialog(existing?'Editar demanda':'Nova demanda',`<p class="muted">${esc(work().name)} · dados de teste</p><div class="form-grid">${field('title','Assunto',t.title,'text',true)}${field('owner','Responsável',t.owner,'text',true)}${field('sector','Setor',t.sector,'text',true)}${field('creator','Criador',t.creator,'text',true)}${field('created','Lançamento',t.created,'date',true)}${field('due','Prazo',t.due,'date',true)}<label>Prioridade<select name="priority">${[['alta','Alta'],['media','Média'],['baixa','Baixa']].map(([k,v])=>`<option value="${k}" ${t.priority===k?'selected':''}>${v}</option>`).join('')}</select></label><label>Status<select name="status">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${t.status===k?'selected':''}>${v}</option>`).join('')}</select></label>${area('description','Descrição',t.description)}${area('reason','Justificativa ao cancelar ou reabrir')}</div>${existing?`<details><summary>Histórico local (${t.history.length})</summary>${t.history.slice().reverse().map(h=>`<p>${esc(h.at)} · ${esc(h.action)} → ${esc(STATUS[h.to])}<br>${esc(h.reason)}</p>`).join('')}</details>`:''}`,async fd=>{const values=Object.fromEntries(fd);const reason=values.reason;delete values.reason;await mutate(s=>saveTask(s,{...t,...values},reason));});}
function rdoDialog(id){const old=state.rdos.find(r=>r.id===id&&r.obraId===workId);const r=old||{id:uid(),obraId:workId,fields:{Data:today(),Obra:work().name,Empresa:work().company,Cidade:work().city}};const readonly=['Obra','Dia da Semana'];const long=['Descrição do Local','Atividades do Dia','Efetivo por Função','Colaboradores Presentes','Equipamentos Utilizados','Veículos Leves','Veículos/Equipamentos Parados','Eventos de Segurança','Eventos de Meio Ambiente','Observações do Dia','Fotos'];dialog(old?'Editar rascunho do diário':'Novo diário de obras',`<div class="notice compact">Rascunho local · ${esc(work().name)}. Campos não informados permanecem em branco. Fotos: apenas descrição ou referência, sem envio de arquivos. Número informado não é numeração oficial.</div><div class="form-grid">${RDO_FIELDS.filter(k=>!readonly.includes(k)).map(k=>long.includes(k)?area(k,k,r.fields[k]||'',k==='Atividades do Dia'):field(k,k,r.fields[k]??'',k==='Data'?'date':k==='DSS Horário'?'time':k==='Efetivo Total'?'number':'text',['Data','Apontador'].includes(k))).join('')}</div>`,async fd=>{await mutate(s=>saveRdo(s,{...r,fields:Object.fromEntries(fd)}));},true);}
function meetingDialog(){dialog('Novo Check-in de gestão',`<p class="muted">${esc(work().name)} · salve o retrato da pauta e suas decisões.</p><div class="form-grid">${field('title','Título','Check-in diário','text',true)}<label>Tipo<select name="type"><option>Diária</option><option>Semanal</option><option>Com cliente</option></select></label>${field('date','Data',today(),'date',true)}${field('time','Hora','07:00','time',true)}${area('participants','Participantes','',true)}<fieldset class="full"><legend>Demandas desta reunião</legend>${tasks().map(t=>`<label class="check"><input type="checkbox" name="taskIds" value="${esc(t.id)}" ${active(t)?'checked':''}><span>${esc(t.title)}<small>${esc(t.owner)} · ${STATUS[t.status]}</small></span></label>`).join('')||'<p>Cadastre demandas na Pauta para vinculá-las aqui.</p>'}</fieldset>${area('decisions','Decisões, responsáveis e próximos passos','',true)}</div>`,async fd=>{await mutate(s=>saveMeeting(s,{obraId:workId,title:fd.get('title'),type:fd.get('type'),date:fd.get('date'),time:fd.get('time'),participants:fd.get('participants'),decisions:fd.get('decisions'),taskIds:fd.getAll('taskIds')}));},true);}
function workDialog(){dialog('Nova obra de teste',`<div class="form-grid">${field('name','Nome da obra','','text',true)}${field('city','Cidade / UF','','text',true)}${field('company','Empresa','','text',true)}${field('type','Tipo de obra','Industrial','text',true)}</div>`,async fd=>{const w={id:uid(),...Object.fromEntries(fd)};if(Object.values(w).some(v=>!v.trim()))throw Error('Preencha todos os campos.');await mutate(s=>s.works.push(w));workId=w.id;render();});}
function meetingContent(m){return `<h2>${esc(m.title)}</h2><p>${dateLabel(m.date)} · ${esc(m.time)} · ${esc(m.type)}</p><h3>Participantes</h3><p>${esc(m.participants)}</p><h3>Decisões e encaminhamentos</h3><p class="preserve">${esc(m.decisions)}</p><h3>Pauta no momento da reunião</h3>${m.snapshot.map(t=>`<div class="ata-item"><h3>${esc(t.title)}</h3><p>${esc(t.owner)} · ${esc(t.sector)} · ${dateLabel(t.due)} · ${STATUS[t.status]}</p><p class="preserve">${esc(t.description)}</p></div>`).join('')||'<p>Sem demandas vinculadas.</p>'}<p class="footnote">Retrato local preservado. Registro demonstrativo sem assinatura ou aprovação oficial.</p>`;}
function printRecord(kind,id){let body;if(kind==='rdo'){const r=rdos().find(x=>x.id===id);if(!r)return;body=`<h2>Diário de obras · rascunho v${r.version}</h2>${RDO_FIELDS.map(k=>`<div class="print-field"><h3>${esc(k)}</h3><p class="preserve">${esc(r.fields[k])||'Não informado'}</p></div>`).join('')}`;}else{const m=meetings().find(x=>x.id===id);if(!m)return;body=meetingContent(m);}$('#print-area').innerHTML=`<header><h1>Gerenciamento</h1><p>${esc(work().name)} · AMBIENTE DEMONSTRATIVO · não oficial</p></header>${body}`;window.print();}
function download(name,content,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportCSV(){const cell=v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"';const rows=[['Obra','ID','Assunto','Responsável','Setor','Lançamento','Prazo','Status','Prioridade','Descrição'],...filteredTasks().map(t=>[work().name,t.id,t.title,t.owner,t.sector,t.created,t.due,STATUS[t.status],t.priority,t.description])];download('Gerenciamento-pauta.csv','\ufeff'+rows.map(r=>r.map(cell).join(';')).join('\r\n'),'text/csv;charset=utf-8');toast('Exportação do recorte atual concluída.');}
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;if(el.dataset.goto)navTo(el.dataset.goto);if(el.dataset.late){view='pauta';stateFilter='late';render();}if(el.dataset.editTask)taskDialog(el.dataset.editTask);if(el.dataset.editRdo)rdoDialog(el.dataset.editRdo);if(el.dataset.meetingDetail){const m=meetings().find(x=>x.id===el.dataset.meetingDetail);if(m)dialog('Ata da reunião',meetingContent(m),null,true);}if(el.dataset.action)({task:taskDialog,rdo:rdoDialog,meeting:meetingDialog,work:workDialog}[el.dataset.action])();if(el.dataset.work){workId=el.dataset.work;render();}if(el.dataset.print){const [kind,id]=el.dataset.print.split(':');printRecord(kind,id);}if(el.id==='csv')exportCSV();});

ll('input:not([aria-label]),select:not([aria-label]),textarea:not([aria-label])').forEach(el=>{const title=el.closest('.frow')?.querySelector('label')?.textContent||el.previousElementSibling?.textContent||el.id;if(title)el.setAttribute('aria-label',title.trim().slice(0,100));});\n if(__moduleKind==='checkin'){\n  if(__startTab){const button=[...document.querySelectorAll('.tab')].find(x=>(x.getAttribute('onclick')||'').includes(\"'\"+__startTab+\"'\"));if(button)button.click();}\n  if(__editId)editarAssunto(__editId);\n }\n gerFixModalPositioning();\n});\n\n// O iframe do m\u00f3dulo \u00e9 redimensionado para caber todo o conte\u00fado (sem scroll\n// interno), ent\u00e3o \"position:fixed\" dentro dele passa a valer contra a altura\n// TOTAL do conte\u00fado, n\u00e3o contra o que o usu\u00e1rio est\u00e1 vendo na janela real \u2014\n// um modal centralizado/fixo pode renderizar longe da rolagem atual da\n// p\u00e1gina. Esta fun\u00e7\u00e3o recalcula, a cada mudan\u00e7a de classe do overlay e a\n// cada rolagem/redimensionamento da p\u00e1gina pai, qual fatia do iframe est\u00e1\n// realmente vis\u00edvel e restringe o overlay a essa fatia, mantendo o modal\n// sempre dentro da \u00e1rea vis\u00edvel.\nfunction gerFixModalPositioning(){\n  const overlays=Array.from(document.querySelectorAll('.modal-overlay,.config-modal'));\n  if(!overlays.length)return;\n  let frameEl;\n  try{ frameEl=parent.document.getElementById('module-frame'); }\n  catch(e){ return; } // sem acesso ao pai: mant\u00e9m o comportamento padr\u00e3o (fixed simples)\n  if(!frameEl)return;\n\n  function reposicionar(){\n    const rect=frameEl.getBoundingClientRect();\n    const vh=parent.window.innerHeight||parent.document.documentElement.clientHeight;\n    const topoVisivelNoPai=Math.max(0,rect.top);\n    const fimVisivelNoPai=Math.min(vh,rect.bottom);\n    const topoLocal=topoVisivelNoPai-rect.top;\n    const alturaLocal=Math.max(0,fimVisivelNoPai-topoVisivelNoPai);\n    overlays.forEach(ov=>{\n      if(!ov.classList.contains('open')&&!ov.classList.contains('show'))return;\n      ov.style.top=topoLocal+'px';\n      ov.style.height=alturaLocal+'px';\n    });\n  }\n\n  reposicionar();\n  parent.window.addEventListener('scroll',reposicionar,{passive:true});\n  parent.window.addEventListener('resize',reposicionar);\n  const mo=new MutationObserver(reposicionar);\n  overlays.forEach(ov=>mo.observe(ov,{attributes:true,attributeFilter:['class']}));\n  window.addEventListener('pagehide',()=>{\n    parent.window.removeEventListener('scroll',reposicionar);\n    parent.window.removeEventListener('resize',reposicionar);\n    mo.disconnect();\n  },{once:true});\n}\n\u003c/script>\n\u003c/head>\n\u003cbody>\n\n\u003cdiv class=\"notif\" id=\"notif\">\u003c/div>\n\u003cdiv id=\"print-kanban\" style=\"display:none\">\u003c/div>\n\n\u003cheader class=\"hdr\">\n  \u003cdiv class=\"hdr-top\">\n    \u003cdiv>\n      \u003cdiv class=\"hdr-logo\">CHE\u003cspan>KIN\u003c/span>\u003c/div>\n      \u003cdiv class=\"hdr-obra\" id=\"hdr-obra-label\">\u2014 Configure a obra \u2014\u003c/div>\n    \u003c/div>\n    \u003cdiv style=\"display:flex;align-items:center;gap:10px\">\n      \u003cdiv class=\"hdr-date\" id=\"hdr-date\">\u003c/div>\n      \u003cbutton class=\"hdr-settings\" onclick=\"abrirConfig()\" title=\"Configurar obra\">\u2699\ufe0f\u003c/button>\n    \u003c/div>\n  \u003c/div>\n  \u003cnav class=\"tabs\">\n    \u003cdiv class=\"tab active\" onclick=\"goTab('checkin',this)\">\ud83d\udccb\u003cbr>Check-in\u003c/div>\n    \u003cdiv class=\"tab\" onclick=\"goTab('cadastro',this)\">\u2699\ufe0f\u003cbr>Cadastro\u003c/div>\n    \u003cdiv class=\"tab\" onclick=\"goTab('calendario',this)\">\ud83d\udcc5\u003cbr>Calend\u00e1rio\u003c/div>\n    \u003cdiv class=\"tab\" onclick=\"goTab('resumo',this)\">\ud83d\udcca\u003cbr>Resumo\u003c/div>\n    \u003cdiv class=\"tab\" onclick=\"goTab('dashboard',this)\">\ud83d\ude80\u003cbr>Dashb\u003c/div>\n  \u003c/nav>\n\u003c/header>\n\n\u003c!-- ===== CHECKIN ===== -->\n\u003cdiv class=\"page active\" id=\"page-checkin\">\n  \u003cdiv class=\"sec\">\n    \u003cdiv class=\"sec-title\">\ud83d\udccb Reuni\u00e3o Check-in / Check-out\u003c/div>\n    \u003c!-- Contadores: sem campo Participantes -->\n    \u003cdiv class=\"ci-grid\">\n      \u003cdiv class=\"ci-box\">\u003cdiv class=\"ci-box-val\" id=\"ci-novos\">0\u003c/div>\u003cdiv class=\"ci-box-lbl\">Assuntos\u003c/div>\u003c/div>\n      \u003cdiv class=\"ci-box\">\u003cdiv class=\"ci-box-val\" id=\"ci-afazer\">0\u003c/div>\u003cdiv class=\"ci-box-lbl\">A Fazer\u003c/div>\u003c/div>\n      \u003cdiv class=\"ci-box\">\u003cdiv class=\"ci-box-val yellow\" id=\"ci-fazendo\">0\u003c/div>\u003cdiv class=\"ci-box-lbl\">Fazendo\u003c/div>\u003c/div>\n      \u003cdiv class=\"ci-box\">\u003cdiv class=\"ci-box-val green\" id=\"ci-concluidos\">0\u003c/div>\u003cdiv class=\"ci-box-lbl\">Conclu\u00eddos\u003c/div>\u003c/div>\n      \u003cdiv class=\"ci-box\">\u003cdiv class=\"ci-box-val red\" id=\"ci-atrasados\">0\u003c/div>\u003cdiv class=\"ci-box-lbl\">Atrasados\u003c/div>\u003c/div>\n      \u003cdiv class=\"ci-box\">\u003cdiv class=\"ci-box-val\" id=\"ci-total-dias\">0d\u003c/div>\u003cdiv class=\"ci-box-lbl\">Tempo M\u00e9dio\u003c/div>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"frow-2\">\n      \u003cdiv class=\"frow\">\u003clabel>Data\u003c/label>\u003cinput type=\"date\" id=\"ci-data\"/>\u003c/div>\n      \u003cdiv class=\"frow\">\u003clabel>Hora In\u00edcio\u003c/label>\u003cinput type=\"time\" id=\"ci-hora\"/>\u003c/div>\n    \u003c/div>\n    \u003cbutton class=\"btn btn-outline btn-full\" onclick=\"carregarDaPlanilha()\" style=\"margin-top:6px;border-color:var(--blue);color:var(--blue)\">\ud83d\udd04 ATUALIZAR DA PLANILHA\u003c/button>\n  \u003c/div>\n\n  \u003cdiv class=\"sec\">\n    \u003cdiv class=\"sec-title\">\ud83d\udccc Kanban de Assuntos\u003c/div>\n    \u003cdiv class=\"kanban-wrap\" id=\"kanban-checkin\">\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"sec\">\n    \u003cdiv class=\"sec-title\">\u26a1 A\u00e7\u00f5es da Reuni\u00e3o\u003c/div>\n    \u003cbutton class=\"btn btn-primary btn-full\" onclick=\"salvarReuniao()\">\ud83d\udcbe SALVAR REUNI\u00c3O\u003c/button>\n    \u003cbutton class=\"btn btn-outline btn-full\" onclick=\"capturarCheckin()\" style=\"margin-bottom:0;border-color:var(--blue);color:var(--blue)\">\ud83d\udcf8 CAPTURAR IMAGEM\u003c/button>\n\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- ===== CADASTRO ===== -->\n\u003cdiv class=\"page\" id=\"page-cadastro\">\n  \u003c!-- Apenas cadastro de assuntos. Equipe e Setores removidos. -->\n  \u003cdiv class=\"sec\">\n    \u003cdiv class=\"sec-title\">\ud83d\udccc Assuntos\u003c/div>\n    \u003cdiv id=\"lista-assuntos-cadastro\" style=\"margin-bottom:12px\">\u003c/div>\n    \u003cbutton class=\"btn btn-primary btn-sm\" onclick=\"abrirModalAssunto(null)\">+ NOVO ASSUNTO\u003c/button>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- ===== CALENDARIO ===== -->\n\u003cdiv class=\"page\" id=\"page-calendario\">\n  \u003cdiv class=\"sec\">\n    \u003cdiv class=\"cal-nav\">\n      \u003cbutton class=\"cal-nav-btn\" onclick=\"calNav(-1)\">&#8249;\u003c/button>\n      \u003cdiv class=\"cal-nav-title\" id=\"cal-titulo\">\u003c/div>\n      \u003cbutton class=\"cal-nav-btn\" onclick=\"calNav(1)\">&#8250;\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"cal-grid\" id=\"cal-grid\">\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"sec\">\n    \u003cdiv class=\"sec-title\">\ud83d\udccb Assuntos Criados\u003c/div>\n    \u003cdiv id=\"lista-reunioes-cal\">\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- ===== RESUMO ===== -->\n\u003cdiv class=\"page\" id=\"page-resumo\">\n  \u003cdiv class=\"resumo-toggle\">\n    \u003cbutton class=\"rtab active\" onclick=\"setResumoTab('semanal',this)\">\ud83d\udcc5 SEMANAL\u003c/button>\n    \u003cbutton class=\"rtab\" onclick=\"setResumoTab('mensal',this)\">\ud83d\udcc6 MENSAL\u003c/button>\n  \u003c/div>\n  \u003cdiv id=\"resumo-conteudo\">\u003c/div>\n\u003c/div>\n\n\u003c!-- ===== DASHBOARD ===== -->\n\u003cdiv class=\"page\" id=\"page-dashboard\">\n  \u003cdiv id=\"dashboard-conteudo\">\u003c/div>\n\u003c/div>\n\n\u003c!-- MODAL ASSUNTO -->\n\u003cdiv class=\"modal-overlay\" id=\"modal-assunto\">\n  \u003cdiv class=\"modal\">\n    \u003cbutton class=\"modal-close\" onclick=\"fecharModal('modal-assunto')\">\u2715\u003c/button>\n    \u003cdiv class=\"modal-title\" id=\"modal-assunto-titulo\">Novo Assunto\u003c/div>\n\n    \u003cdiv class=\"frow\">\u003clabel>Assunto\u003c/label>\u003cinput type=\"text\" id=\"a-assunto\" placeholder=\"Descreva o assunto\"/>\u003c/div>\n    \u003cdiv class=\"frow\">\u003clabel>Descri\u00e7\u00e3o\u003c/label>\u003ctextarea id=\"a-desc\" placeholder=\"Detalhes adicionais...\">\u003c/textarea>\u003c/div>\n\n    \u003cdiv class=\"frow-2\">\n      \u003cdiv class=\"frow\">\u003clabel>Data de Lan\u00e7amento\u003c/label>\u003cinput type=\"date\" id=\"a-data-lanc\"/>\u003c/div>\n      \u003cdiv class=\"frow\">\u003clabel>Data de T\u00e9rmino\u003c/label>\u003cinput type=\"date\" id=\"a-data-term\"/>\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"frow-2\">\n      \u003cdiv class=\"frow\">\u003clabel>Prioridade\u003c/label>\n        \u003cselect id=\"a-prior\">\n          \u003coption value=\"alta\">Alta\u003c/option>\n          \u003coption value=\"media\" selected>M\u00e9dia\u003c/option>\n          \u003coption value=\"baixa\">Baixa\u003c/option>\n        \u003c/select>\n      \u003c/div>\n      \u003cdiv class=\"frow\">\u003clabel>Status\u003c/label>\n        \u003cselect id=\"a-status\">\n          \u003coption value=\"afazer\">A Fazer\u003c/option>\n          \u003coption value=\"fazendo\">Fazendo\u003c/option>\n          \u003coption value=\"concluido\">Conclu\u00eddo\u003c/option>\n          \u003coption value=\"cancelado\">Cancelado\u003c/option>\n        \u003c/select>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"frow\">\u003clabel>Setor\u003c/label>\n      \u003cselect id=\"a-setor\">\n        \u003coption value=\"\">Selecione...\u003c/option>\n        \u003coption>Administra\u00e7\u00e3o\u003c/option>\n        \u003coption>Administra\u00e7\u00e3o Contratual\u003c/option>\n        \u003coption>Engenharia\u003c/option>\n        \u003coption>Gest\u00e3o\u003c/option>\n        \u003coption>Financeiro\u003c/option>\n        \u003coption>Manuten\u00e7\u00e3o Mec\u00e2nica Pesada\u003c/option>\n        \u003coption>Marketing\u003c/option>\n        \u003coption>Medi\u00e7\u00e3o\u003c/option>\n        \u003coption>Meio Ambiente\u003c/option>\n        \u003coption>Opera\u00e7\u00f5es\u003c/option>\n        \u003coption>Planejamento\u003c/option>\n        \u003coption>Produ\u00e7\u00e3o Civil\u003c/option>\n        \u003coption>Produ\u00e7\u00e3o El\u00e9trica\u003c/option>\n        \u003coption>Produ\u00e7\u00e3o Mec\u00e2nica\u003c/option>\n        \u003coption>Qualidade\u003c/option>\n        \u003coption>Recursos Humanos\u003c/option>\n        \u003coption>RH\u003c/option>\n        \u003coption>Seguran\u00e7a\u003c/option>\n        \u003coption>Suprimentos\u003c/option>\n        \u003coption>TI\u003c/option>\n        \u003coption>Transporte\u003c/option>\n      \u003c/select>\n    \u003c/div>\n\n    \u003cdiv class=\"frow-2\">\n      \u003cdiv class=\"frow\">\u003clabel>Respons\u00e1vel\u003c/label>\n        \u003cinput type=\"text\" id=\"a-resp\" placeholder=\"Nome do respons\u00e1vel\" list=\"dl-resp\" autocomplete=\"off\"/>\n        \u003cdatalist id=\"dl-resp\">\u003c/datalist>\n      \u003c/div>\n      \u003cdiv class=\"frow\">\u003clabel>Criador\u003c/label>\n        \u003cinput type=\"text\" id=\"a-criador\" placeholder=\"Quem est\u00e1 criando\" list=\"dl-criador\" autocomplete=\"off\"/>\n        \u003cdatalist id=\"dl-criador\">\u003c/datalist>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cinput type=\"hidden\" id=\"a-edit-id\"/>\n    \u003cbutton class=\"btn btn-primary btn-full\" onclick=\"salvarAssunto()\">SALVAR ASSUNTO\u003c/button>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- MODAL A\u00c7\u00d5ES CARD -->\n\u003cdiv class=\"modal-overlay\" id=\"modal-acoes\">\n  \u003cdiv class=\"modal\">\n    \u003cbutton class=\"modal-close\" onclick=\"fecharModal('modal-acoes')\">\u2715\u003c/button>\n    \u003cdiv class=\"modal-title\" id=\"acoes-titulo\" style=\"font-size:14px;margin-bottom:16px\">\u003c/div>\n    \u003cbutton class=\"btn btn-full\" id=\"acoes-fazendo\" style=\"margin-bottom:10px;background:var(--yellow);color:#fff;font-size:16px\" onclick=\"acoesCard('fazendo')\">\u26a1 FAZENDO\u003c/button>\n    \u003cbutton class=\"btn btn-full\" id=\"acoes-concluido\" style=\"margin-bottom:10px;background:var(--green);color:#fff;font-size:16px\" onclick=\"acoesCard('concluido')\">\u2705 CONCLU\u00cdDO\u003c/button>\n    \u003cbutton class=\"btn btn-full\" id=\"acoes-cancelado\" style=\"margin-bottom:10px;background:#aaa;color:#fff;font-size:16px\" onclick=\"acoesCard('cancelado')\">\ud83d\udeab CANCELADO\u003c/button>\n    \u003cbutton class=\"btn btn-full\" id=\"acoes-afazer\" style=\"margin-bottom:10px;background:var(--blue);color:#fff;font-size:16px\" onclick=\"acoesCard('afazer')\">\ud83c\udfaf A FAZER\u003c/button>\n    \u003cbutton class=\"btn btn-outline btn-full\" style=\"font-size:16px\" onclick=\"acoesEditar()\">\u270f\ufe0f EDITAR\u003c/button>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- MODAL CONFIG -->\n\u003cdiv class=\"config-modal\" id=\"modal-config\">\n  \u003cdiv class=\"modal\">\n    \u003cbutton class=\"modal-close\" onclick=\"fecharModal('modal-config')\">\u2715\u003c/button>\n    \u003cdiv class=\"modal-title\">\u2699\ufe0f Configurar Obra\u003c/div>\n    \u003cdiv class=\"frow\">\u003clabel>Nome da Obra\u003c/label>\u003cinput type=\"text\" id=\"cfg-obra\" placeholder=\"Ex: Obra X - Bloco A\"/>\u003c/div>\n    \u003cbutton class=\"btn btn-primary btn-full\" onclick=\"salvarConfig()\">SALVAR CONFIGURA\u00c7\u00d5ES\u003c/button>\n  \u003c/div>\n\u003c/div>\n\n\u003cscript>\n// \ud83d\udd17 Google Apps Script API\nconst APPS_SCRIPT_URL_PAUTA = parent.GerenciamentoModules.settings(__obraId).service;\n\n// \u2500\u2500 XSS PROTECTION\nfunction escapeHtml(str){\n  if(str==null)return '';\n  return String(str).replace(/&/g,'&amp;').replace(/\u003c/g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#39;');\n}\n\n// Compara\u00e7\u00e3o por data (n\u00e3o por instante): um prazo com vencimento hoje n\u00e3o \u00e9\n// atraso. Comparar timestamps (Date.now()) contra a meia-noite do prazo faz\n// qualquer prazo de hoje aparecer como atrasado a partir das 00h01.\nfunction hojeISO(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}\nfunction diasAteVencimento(dataTerm){\n  if(!dataTerm)return null;\n  const term=new Date(dataTerm+'T00:00:00');\n  const hoje=new Date(hojeISO()+'T00:00:00');\n  return Math.round((term-hoje)/86400000);\n}\n\nconst S={\n  get(k){try{return JSON.parse(window.__storage.getItem('chk_'+k))}catch{return null}},\n  set(k,v){window.__storage.setItem('chk_'+k,JSON.stringify(v))}\n};\n\nlet config=S.get('config')||{obra:''};\n\n// dataLanc e dataTerm adicionados.\nlet assuntos=S.get('assuntos')||[\n  {id:1,assunto:'Verifica\u00e7\u00e3o de EPI',desc:'Conferir uso correto de equipamentos de prote\u00e7\u00e3o',prioridade:'alta',setor:'Seguran\u00e7a',resp:'',status:'afazer',dataLanc:'2026-06-01',dataTerm:'2026-06-05',criadoEm:Date.now()-86400000*2},\n  {id:2,assunto:'Reuni\u00e3o de Planejamento',desc:'Alinhamento de atividades para o dia',prioridade:'media',setor:'Planejamento',resp:'',status:'afazer',dataLanc:'2026-06-02',dataTerm:'2026-06-02',criadoEm:Date.now()},\n  {id:3,assunto:'Solicita\u00e7\u00e3o de Materiais',desc:'Levantamento de necessidades de suprimentos',prioridade:'media',setor:'Suprimentos',resp:'',status:'afazer',dataLanc:'2026-06-02',dataTerm:'2026-06-07',criadoEm:Date.now()},\n  {id:4,assunto:'Manuten\u00e7\u00e3o de Equipamento',desc:'Verificar necessidade de manuten\u00e7\u00e3o preventiva',prioridade:'baixa',setor:'Manuten\u00e7\u00e3o Mec\u00e2nica Pesada',resp:'',status:'afazer',dataLanc:'2026-06-03',dataTerm:'2026-06-10',criadoEm:Date.now()}\n];\n\nlet reunioes=S.get('reunioes')||[];\nlet nomesResp=S.get('nomesResp')||[];\nlet nomesCriador=S.get('nomesCriador')||[];\n\nfunction aprenderNome(lista,nome,chave){\n  nome=nome.trim();\n  if(!nome)return;\n  if(!lista.includes(nome)){lista.push(nome);S.set(chave,lista);}\n}\n\nfunction popularDatalist(dlId,lista){\n  var dl=document.getElementById(dlId);\n  if(!dl)return;\n  dl.innerHTML=lista.map(function(n){return '\u003coption value=\"'+n+'\">\u003c/option>';}).join('');\n}\nlet calMes=new Date();\nlet resumoTab='semanal';\n\nfunction notify(msg,cor){\n  const n=document.getElementById('notif');\n  n.textContent=msg;n.style.background=cor||'var(--green)';\n  n.classList.add('show');setTimeout(()=>n.classList.remove('show'),2500);\n}\n\nfunction goTab(id,el){\n  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));\n  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));\n  document.getElementById('page-'+id).classList.add('active');\n  el.classList.add('active');\n  if(id==='checkin')renderCheckin();\n  if(id==='cadastro')renderCadastro();\n  if(id==='calendario')renderCalendario();\n  if(id==='resumo')renderResumo();\n  if(id==='dashboard')renderDashboard();\n}\n\n// \u2500\u2500 CARREGAR DO GOOGLE SHEETS\nfunction mapStatusRemoto(status){\n  const mapa={'Aberta':'afazer','Em Andamento':'fazendo','Cancelado':'cancelado','Conclu\u00edda':'concluido','Concluido':'concluido','Conclu\u00eddo':'concluido'};\n  if(mapa[status])return mapa[status];\n  console.warn('Status remoto desconhecido, enviado para concilia\u00e7\u00e3o:',status);\n  return 'conciliacao';\n}\nasync function carregarDaPlanilhaGoogle() {\n  if(!APPS_SCRIPT_URL_PAUTA){notify(\"Configure o servi\u00e7o pr\u00f3prio em Conex\u00f5es.\");return;}\n  try {\n    notify('Carregando da planilha Google...', 'var(--blue)');\n    const resp = await fetch(APPS_SCRIPT_URL_PAUTA + '?path=pauta&action=listar');\n    const data = await resp.json();\n\n    if (data.pautas && data.pautas.length > 0) {\n      const remotos = data.pautas.map(p => ({\n        id: p.id,\n        assunto: p.assunto,\n        desc: p.descri\u00e7\u00e3o,\n        criador: p.criador,\n        resp: p.respons\u00e1vel,\n        setor: p.setor,\n        prioridade: p.prioridade.toLowerCase().replace(' ', ''),\n        status: mapStatusRemoto(p.status),\n        dataLanc: p.data_lan\u00e7amento ? String(p.data_lan\u00e7amento).slice(0,10) : '',\n        dataTerm: p.data_t\u00e9rmino ? String(p.data_t\u00e9rmino).slice(0,10) : '',\n        criadoEm: new Date(p.criado_em).getTime(),\n        atualizadoEm: p.atualizado_em ? new Date(p.atualizado_em).getTime() : new Date(p.criado_em).getTime()\n      }));\n      const { mesclados, conflitos } = mesclarAssuntosRemotos(assuntos, remotos);\n      assuntos = mesclados;\n      S.set('assuntos', assuntos);\n      renderKanbanCheckin();atualizarContadores();\n      if (conflitos.length) {\n        notify(`\u26a0 ${conflitos.length} conflito(s) mantido(s) localmente \u2014 revise manualmente`, 'var(--yellow)');\n        console.warn('Conflitos de sincroniza\u00e7\u00e3o (mudan\u00e7a local mais recente preservada):', conflitos);\n      } else {\n        notify('\u2705 Assuntos atualizados da planilha!');\n      }\n    } else {\n      notify('Nenhum assunto encontrado na planilha', 'var(--yellow)');\n    }\n  } catch (err) {\n    notify('\u274c Erro ao carregar: ' + err.message, 'var(--red)');\n  }\n}\n\nfunction carregarDaPlanilha(){\n  carregarDaPlanilhaGoogle();\n}\n\nfunction initData(){\n  const agora=new Date();\n  document.getElementById('ci-data').value=agora.toISOString().slice(0,10);\n  document.getElementById('ci-hora').value=`${String(agora.getHours()).padStart(2,'0')}:${String(agora.getMinutes()).padStart(2,'0')}`;\n  document.getElementById('hdr-date').textContent=agora.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'})+' '+agora.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});\n  document.getElementById('hdr-obra-label').textContent=config.obra||'\u2014 Configure a obra \u2014';\n}\n\nsetInterval(()=>{\n  const agora=new Date();\n  const el=document.getElementById('hdr-date');\n  if(el)el.textContent=agora.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'})+' '+agora.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});\n},30000);\n\nfunction atualizarContadores(){\n  const af=assuntos.filter(a=>a.status==='afazer').length;\n  const fz=assuntos.filter(a=>a.status==='fazendo').length;\n  const co=assuntos.filter(a=>a.status==='concluido').length;\n  const ca=assuntos.filter(a=>a.status==='cancelado').length;\n  const hojeStr=hojeISO();\n  const at=assuntos.filter(a=>a.status!=='concluido'&&a.status!=='cancelado'&&a.dataTerm&&a.dataTerm\u003chojeStr).length;\n  const concluidos=assuntos.filter(a=>a.status==='concluido'&&a.concluidoEm&&a.criadoEm);\n  const mediaD=concluidos.length?Math.round(concluidos.reduce((s,a)=>s+(a.concluidoEm-a.criadoEm)/86400000,0)/concluidos.length):0;\n  document.getElementById('ci-novos').textContent=assuntos.length;\n  document.getElementById('ci-afazer').textContent=af;\n  document.getElementById('ci-fazendo').textContent=fz;\n  document.getElementById('ci-concluidos').textContent=co;\n  document.getElementById('ci-atrasados').textContent=at;\n  document.getElementById('ci-total-dias').textContent=mediaD+'d';\n}\n\nfunction renderCheckin(){renderKanbanCheckin();atualizarContadores()}\n\nfunction normPrior(p){return String(p||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}\nfunction priorCor(p){const n=normPrior(p);return n==='alta'?'badge-red':n==='media'?'badge-yellow':'badge-green'}\nfunction setorCor(s){\n  const m={\n    'Seguran\u00e7a':'badge-orange','Planejamento':'badge-blue','Suprimentos':'badge-green',\n    'Opera\u00e7\u00f5es':'badge-blue','Engenharia':'badge-blue','Produ\u00e7\u00e3o Civil':'badge-orange',\n    'Produ\u00e7\u00e3o El\u00e9trica':'badge-yellow','Produ\u00e7\u00e3o Mec\u00e2nica':'badge-yellow',\n    'Qualidade':'badge-green','Meio Ambiente':'badge-green','Financeiro':'badge-blue',\n    'Gest\u00e3o':'badge-blue','TI':'badge-gray','Transporte':'badge-gray',\n    'Manuten\u00e7\u00e3o Mec\u00e2nica Pesada':'badge-yellow','Marketing':'badge-orange',\n    'Medi\u00e7\u00e3o':'badge-gray','Recursos Humanos':'badge-gray','RH':'badge-gray',\n    'Administra\u00e7\u00e3o':'badge-gray','Administra\u00e7\u00e3o Contratual':'badge-gray'\n  };\n  return m[s]||'badge-gray';\n}\n\nfunction statusBadge(s){\n  return s==='afazer'?'badge-gray':s==='fazendo'?'badge-yellow':s==='concluido'?'badge-green':s==='cancelado'?'badge-canceled':'badge-red';\n}\nfunction statusLabel(s){\n  return s==='afazer'?'A Fazer':s==='fazendo'?'Fazendo':s==='concluido'?'Conclu\u00eddo':s==='cancelado'?'Cancelado':'\u26a0 Concilia\u00e7\u00e3o';\n}\nfunction aging(a){\n  if(!a.dataTerm)return '';\n  if(a.status==='concluido')return '\u003cspan class=\"card-aging\">\u2714\u003c/span>';\n  if(a.status==='cancelado')return '\u003cspan class=\"card-aging\">Cancelado\u003c/span>';\n  const dias=diasAteVencimento(a.dataTerm);\n  if(dias\u003c0)return `\u003cspan class=\"card-aging alert\">${Math.abs(dias)}d atrasado\u003c/span>`;\n  if(dias===0)return `\u003cspan class=\"card-aging alert\">Vence hoje\u003c/span>`;\n  return `\u003cspan class=\"card-aging\">${dias}d restante\u003c/span>`;\n}\n\nfunction formatDate(d){\n  if(!d)return '';\n  const str=String(d).slice(0,10);\n  const[a,m,dia]=str.split('-');\n  if(!dia)return String(d);\n  return `${dia}/${m}/${a}`;\n}\n\nfunction renderKanbanCheckin(){\n  const cont=document.getElementById('kanban-checkin');\n  const cols=[\n    {status:'afazer',label:'\ud83c\udfaf A FAZER',cls:'kol-afazer'},\n    {status:'fazendo',label:'\u26a1 FAZENDO',cls:'kol-fazendo'},\n    {status:'concluido',label:'\u2705 CONCLU\u00cdDO',cls:'kol-concluido'},\n    {status:'cancelado',label:'\ud83d\udeab CANCELADO',cls:'kol-cancelado'},\n    {status:'conciliacao',label:'\u26a0 CONCILIA\u00c7\u00c3O',cls:'kol-cancelado'}\n  ];\n  cont.innerHTML=cols.map(c=>{\n    const cards=assuntos.filter(a=>a.status===c.status);\n    return `\n      \u003cdiv class=\"kol ${c.cls}\">\n        \u003cdiv class=\"kol-hdr\">\n          \u003cspan class=\"kol-title\">${c.label}\u003c/span>\n          \u003cspan class=\"kol-count\">${cards.length}\u003c/span>\n        \u003c/div>\n        ${cards.length?cards.map(a=>`\n          \u003cdiv class=\"card\" onclick=\"abrirAcoes('${escapeHtml(a.id)}')\" style=\"cursor:pointer\">\n            \u003cdiv style=\"display:flex;justify-content:space-between;align-items:flex-start\">\n              \u003cdiv class=\"card-title\">${escapeHtml(a.assunto)}\u003c/div>\n              ${aging(a)}\n            \u003c/div>\n            \u003cdiv class=\"card-desc\">${escapeHtml(a.desc||'')}\u003c/div>\n            \u003cdiv class=\"card-meta\">\n              \u003cspan class=\"badge ${priorCor(a.prioridade)}\">${escapeHtml(a.prioridade)}\u003c/span>\n              ${a.setor?`\u003cspan class=\"badge ${setorCor(a.setor)}\">${escapeHtml(a.setor)}\u003c/span>`:''}\n            \u003c/div>\n            \u003cdiv class=\"card-dates\">\n              ${a.dataLanc?`\ud83d\udcc5 ${formatDate(a.dataLanc)}`:''}\n              ${a.dataTerm?` \u2192 \ud83c\udfc1 ${formatDate(a.dataTerm)}`:''}\n            \u003c/div>\n            \u003cdiv class=\"card-footer\">\n              \u003cspan class=\"card-resp\">\ud83d\udc64 ${escapeHtml(a.resp||'\u2014')}${a.criador?' \u00b7 \u270d\ufe0f '+escapeHtml(a.criador):''}\u003c/span>\n              \u003cspan class=\"badge ${statusBadge(a.status)}\">${statusLabel(a.status)}\u003c/span>\n            \u003c/div>\n          \u003c/div>\n        `).join(''):`\u003cdiv class=\"drop-zone\">Nenhum assunto aqui\u003c/div>`}\n      \u003c/div>\n    `;\n  }).join('');\n}\n\n// \u2500\u2500 INTEGRA\u00c7\u00c3O COM GOOGLE SHEETS\nasync function sincronizarComGoogle(assunto) {\n  if (!APPS_SCRIPT_URL_PAUTA) return;\n  try {\n    const resp = await fetch(APPS_SCRIPT_URL_PAUTA + '?path=pauta&action=atualizar-status', {\n      method: 'POST',\n      body: JSON.stringify({\n        id: assunto.id,\n        novo_status: assunto.status === 'afazer' ? 'Aberta' :\n                      assunto.status === 'fazendo' ? 'Em Andamento' : assunto.status === 'cancelado' ? 'Cancelado' : 'Conclu\u00eddo'\n      })\n    });\n    const data = await resp.json();\n    if (!data.ok) throw new Error(data.error);\n  } catch (err) {\n    console.error('Erro sincronizar com Google:', err);\n  }\n}\n\nasync function salvarCheckInGoogle(reuniao) {\n  if (!APPS_SCRIPT_URL_PAUTA) return;\n  try {\n    const resp = await fetch(APPS_SCRIPT_URL_PAUTA + '?path=checkin&action=salvar', {\n      method: 'POST',\n      body: JSON.stringify({\n        data: reuniao.data,\n        hora: reuniao.hora,\n        obra: config.obra,\n        assuntos: reuniao.assuntos.map(a => ({id: a.id, assunto: a.assunto, status: a.status})),\n        resumo: 'CheckIn de ' + new Date(reuniao.data).toLocaleDateString('pt-BR')\n      })\n    });\n    const data = await resp.json();\n    if (data.ok) {\n      notify('\u2705 CheckIn salvo no Google Sheets!');\n    }\n  } catch (err) {\n    console.error('Erro salvar CheckIn:', err);\n  }\n}\n\nlet _acoesId=null;\nfunction abrirAcoes(id){\n  _acoesId=id;\n  const a=assuntos.find(x=>String(x.id)===String(id));\n  if(!a)return;\n  document.getElementById('acoes-titulo').textContent=a.assunto;\n  document.getElementById('acoes-fazendo').style.display=a.status==='fazendo'?'none':'block';\n  document.getElementById('acoes-afazer').style.display=a.status==='afazer'?'none':'block';\n  document.getElementById('acoes-concluido').style.display=a.status==='concluido'?'none':'block';\n  document.getElementById('acoes-cancelado').style.display=a.status==='cancelado'?'none':'block';\n  document.getElementById('modal-acoes').classList.add('open');\n}\nfunction acoesCard(status){\n  fecharModal('modal-acoes');\n  if(_acoesId)moverCard(_acoesId,status);\n}\nfunction acoesEditar(){\n  fecharModal('modal-acoes');\n  if(_acoesId)editarAssunto(_acoesId);\n}\n\nfunction moverCard(id,status){\n  const a=assuntos.find(x=>String(x.id)===String(id));\n  if(a){\n    a.status=status;\n    a.atualizadoEm=Date.now();\n    if(status==='concluido')a.concluidoEm=Date.now();\n    S.set('assuntos',assuntos);\n    renderKanbanCheckin();atualizarContadores();\n    sincronizarPlanilha(a);\n  }\n}\n\n// Concilia lista local com a lista remota da planilha, sem descartar\n// mudan\u00e7as locais mais recentes que a \u00faltima leitura do servidor.\nfunction mesclarAssuntosRemotos(locais, remotos){\n  const conflitos=[];\n  const porId=new Map(locais.map(a=>[String(a.id),a]));\n  const remotosPorId=new Map(remotos.map(r=>[String(r.id),r]));\n  const resultado=[];\n\n  remotosPorId.forEach((r,id)=>{\n    const l=porId.get(id);\n    if(!l){ resultado.push(r); return; }\n    const localMaisNovo=(l.atualizadoEm||l.criadoEm||0) > (r.atualizadoEm||r.criadoEm||0);\n    if(localMaisNovo){\n      conflitos.push({id, local:l, remoto:r});\n      resultado.push(l);\n    } else {\n      resultado.push(r);\n    }\n  });\n\n  // Itens locais que ainda n\u00e3o existem na planilha (criados offline) s\u00e3o preservados.\n  porId.forEach((l,id)=>{\n    if(!remotosPorId.has(id)) resultado.push(l);\n  });\n\n  return { mesclados: resultado, conflitos };\n}\n\nfunction sincronizarPlanilha(assunto){\n  sincronizarComGoogle(assunto);\n}\n\nfunction renderCadastro(){\n  const cont=document.getElementById('lista-assuntos-cadastro');\n  if(!assuntos.length){cont.innerHTML='\u003cdiv class=\"empty-state\">\u003cdiv class=\"empty-state-icon\">\ud83d\udccb\u003c/div>\u003cdiv class=\"empty-state-txt\">Nenhum assunto cadastrado\u003c/div>\u003c/div>';return}\n  cont.innerHTML=assuntos.map(a=>`\n    \u003cdiv style=\"background:#fff;border-radius:8px;padding:11px 12px;margin-bottom:8px;border:1px solid var(--line);box-shadow:0 1px 4px rgba(0,0,0,.06)\">\n      \u003cdiv style=\"display:flex;align-items:flex-start;gap:8px\">\n        \u003cdiv style=\"flex:1\">\n          \u003cdiv style=\"font-family:var(--serif);font-weight:700;font-size:15px;margin-bottom:4px\">${escapeHtml(a.assunto)}\u003c/div>\n          \u003cdiv style=\"display:flex;gap:4px;flex-wrap:wrap;margin-bottom:4px\">\n            \u003cspan class=\"badge ${priorCor(a.prioridade)}\">${escapeHtml(a.prioridade)}\u003c/span>\n            ${a.setor?`\u003cspan class=\"badge badge-blue\">${escapeHtml(a.setor)}\u003c/span>`:''}\n            \u003cspan class=\"badge ${statusBadge(a.status)}\">${statusLabel(a.status)}\u003c/span>\n          \u003c/div>\n          \u003cdiv style=\"font-size:11px;color:var(--ink-faint)\">\n            ${a.dataLanc?`\ud83d\udcc5 Lan\u00e7amento: ${formatDate(a.dataLanc)}`:''}\n            ${a.dataTerm?` &nbsp;|&nbsp; \ud83c\udfc1 T\u00e9rmino: ${formatDate(a.dataTerm)}`:''}\n          \u003c/div>\n          ${a.resp?`\u003cdiv style=\"font-size:11px;color:var(--ink-soft);margin-top:2px\">\ud83d\udc64 Resp: ${escapeHtml(a.resp)}\u003c/div>`:''}\n          ${a.criador?`\u003cdiv style=\"font-size:11px;color:var(--ink-faint);margin-top:1px\">\u270d\ufe0f Criador: ${escapeHtml(a.criador)}\u003c/div>`:''}\n        \u003c/div>\n        \u003cdiv style=\"display:flex;gap:4px;flex-shrink:0\">\n          \u003cbutton class=\"card-btn\" onclick=\"editarAssunto('${escapeHtml(a.id)}')\" title=\"Editar\">\u270f\ufe0f\u003c/button>\n          \u003cbutton class=\"card-btn\" onclick=\"removerAssunto('${escapeHtml(a.id)}')\" title=\"Remover\">\ud83d\uddd1\ufe0f\u003c/button>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  `).join('');\n}\n\nfunction abrirModalAssunto(a){\n  document.getElementById('modal-assunto-titulo').textContent=a?'Editar Assunto':'Novo Assunto';\n  document.getElementById('a-assunto').value=a?a.assunto:'';\n  document.getElementById('a-desc').value=a?a.desc:'';\n  document.getElementById('a-prior').value=a?a.prioridade:'media';\n  document.getElementById('a-status').value=a?a.status:'afazer';\n  document.getElementById('a-setor').value=a?a.setor:'';\n  document.getElementById('a-resp').value=a?a.resp:'';\n  document.getElementById('a-criador').value=a?a.criador||'':S.get('ultimoCriador')||'';\n  document.getElementById('a-data-lanc').value=a?a.dataLanc||'':new Date().toISOString().slice(0,10);\n  document.getElementById('a-data-term').value=a?a.dataTerm||'':'';\n  document.getElementById('a-edit-id').value=a?a.id:'';\n  popularDatalist('dl-resp',nomesResp);\n  popularDatalist('dl-criador',nomesCriador);\n  document.getElementById('modal-assunto').classList.add('open');\n}\n\nfunction editarAssunto(id){abrirModalAssunto(assuntos.find(x=>String(x.id)===String(id)))}\nfunction fecharModal(id){document.getElementById(id).classList.remove('open')}\n\nfunction salvarAssunto(){\n  const assunto=document.getElementById('a-assunto').value.trim();\n  if(!assunto)return notify('Informe o assunto','var(--red)');\n  const editId=document.getElementById('a-edit-id').value;\n  const resp=document.getElementById('a-resp').value.trim();\n  const criador=document.getElementById('a-criador').value.trim();\n  aprenderNome(nomesResp,resp,'nomesResp');\n  aprenderNome(nomesCriador,criador,'nomesCriador');\n  if(criador)S.set('ultimoCriador',criador);\n  const dados={\n    assunto,\n    desc:document.getElementById('a-desc').value,\n    prioridade:document.getElementById('a-prior').value,\n    status:document.getElementById('a-status').value,\n    setor:document.getElementById('a-setor').value,\n    resp:resp,\n    criador:criador,\n    dataLanc:document.getElementById('a-data-lanc').value,\n    dataTerm:document.getElementById('a-data-term').value\n  };\n  if(editId){\n    const idx=assuntos.findIndex(x=>x.id==editId);\n    if(idx>=0){\n      if(dados.status==='concluido'&&assuntos[idx].status!=='concluido')dados.concluidoEm=Date.now();\n      assuntos[idx]={...assuntos[idx],...dados};\n    }\n  } else {\n    assuntos.push({id:Date.now(),...dados,criadoEm:Date.now()});\n  }\n  S.set('assuntos',assuntos);\n  fecharModal('modal-assunto');\n  renderCadastro();renderKanbanCheckin();atualizarContadores();\n  notify('Assunto salvo!');\n}\n\nfunction removerAssunto(id){\n  if(!confirm('Remover este assunto?'))return;\n  assuntos=assuntos.filter(a=>String(a.id)!==String(id));\n  S.set('assuntos',assuntos);\n  renderCadastro();renderKanbanCheckin();atualizarContadores();\n  notify('Removido','var(--red)');\n}\n\nfunction salvarReuniao(){\n  const reuniao={\n    id:Date.now(),\n    data:document.getElementById('ci-data').value,\n    hora:document.getElementById('ci-hora').value,\n    assuntos:JSON.parse(JSON.stringify(assuntos))\n  };\n  reunioes.push(reuniao);S.set('reunioes',reunioes);notify('Reuni\u00e3o salva!');\n  salvarCheckInGoogle(reuniao);\n}\n\nfunction capturarCheckin(){\n  notify('Preparando imagem...');\n\n  // Ocultar o bloco de acoes durante a captura\n  var paginaCheckin = document.getElementById('page-checkin');\n  var secAcoes = paginaCheckin ? paginaCheckin.querySelector('.sec:last-child') : null;\n  if(secAcoes) secAcoes.style.display = 'none';\n\n  // Capturar os dois blocos: checkin info + kanban\n  var secCheckinInfo = paginaCheckin ? paginaCheckin.querySelector('.sec:first-child') : null;\n  var secKanban = document.getElementById('kanban-checkin') ?\n    document.getElementById('kanban-checkin').closest('.sec') : null;\n\n  // Criar wrapper temporario que junta os dois blocos para captura\n  var wrapper = document.createElement('div');\n  wrapper.id = 'capture-wrapper';\n  wrapper.style.cssText = [\n    'position:fixed',\n    'top:0',\n    'left:0',\n    'width:520px',\n    'background:#f4f5f7',\n    'padding:20px',\n    'z-index:9999',\n    'box-sizing:border-box',\n    'font-family:Barlow,-apple-system,sans-serif',\n    'font-size:15px',\n    'line-height:1.5',\n    'color:#1c1a18',\n    '-webkit-font-smoothing:antialiased'\n  ].join(';');\n\n  // Clonar os dois blocos\n  if(secCheckinInfo) wrapper.appendChild(secCheckinInfo.cloneNode(true));\n  if(secKanban) wrapper.appendChild(secKanban.cloneNode(true));\n\n  document.body.appendChild(wrapper);\n\n  setTimeout(function(){\n    html2canvas(wrapper, {\n      scale: 3,\n      useCORS: true,\n      allowTaint: true,\n      backgroundColor: '#f4f5f7',\n      logging: false,\n      width: 520,\n      scrollX: 0,\n      scrollY: 0,\n      windowWidth: 520,\n      imageTimeout: 0,\n      removeContainer: true\n    }).then(function(canvas){\n      document.body.removeChild(wrapper);\n      if(secAcoes) secAcoes.style.display = '';\n      var link = document.createElement('a');\n      var obraSlug = (config.obra || 'Chekin').replace(/[^a-zA-Z0-9]/g, '-');\n      var data = document.getElementById('ci-data').value || new Date().toISOString().slice(0,10);\n      link.download = 'Checkin-' + obraSlug + '-' + data + '.png';\n      link.href = canvas.toDataURL('image/png', 1.0);\n      link.click();\n      notify('Imagem baixada!');\n    }).catch(function(e){\n      if(document.getElementById('capture-wrapper'))\n        document.body.removeChild(document.getElementById('capture-wrapper'));\n      if(secAcoes) secAcoes.style.display = '';\n      notify('Erro ao gerar imagem','var(--red)');\n      console.error(e);\n    });\n  }, 200);\n}\n\nfunction prepararImpressao(tipo){\n  var pk=document.getElementById('print-kanban');\n  var data=document.getElementById('ci-data').value||'';\n  var hora=document.getElementById('ci-hora').value||'';\n  var obra=config.obra||'Obra';\n  var af=assuntos.filter(function(a){return a.status==='afazer'}).length;\n  var fz=assuntos.filter(function(a){return a.status==='fazendo'}).length;\n  var co=assuntos.filter(function(a){return a.status==='concluido'}).length;\n  var ca=assuntos.filter(function(a){return a.status==='cancelado'}).length;\n  var hojeStr=hojeISO();\n  var at=assuntos.filter(function(a){return a.status!=='concluido'&&a.status!=='cancelado'&&a.dataTerm&&a.dataTerm\u003chojeStr}).length;\n\n  var cols=[\n    {status:'afazer',label:'A FAZER',cls:'kol-afazer'},\n    {status:'fazendo',label:'FAZENDO',cls:'kol-fazendo'},\n    {status:'concluido',label:'CONCLUIDO',cls:'kol-concluido'},\n    {status:'cancelado',label:'CANCELADO',cls:'kol-cancelado'}\n  ];\n\n  var khtml=cols.map(function(c){\n    var cards=assuntos.filter(function(a){return a.status===c.status});\n    var cardsHtml=cards.length?cards.map(function(a){\n      var diasR=a.dataTerm?diasAteVencimento(a.dataTerm):null;\n      var atrasado=diasR!==null&&diasR\u003c0&&a.status!=='concluido'&&a.status!=='cancelado';\n      var prazoTxt=a.status==='concluido'?'Concluido':a.status==='cancelado'?'Cancelado':diasR===null?'':atrasado?(Math.abs(diasR)+'d atrasado'):(diasR+'d restante');\n      return '\u003cdiv class=\"card\">'+\n        '\u003cdiv style=\"display:flex;justify-content:space-between\">'+\n          '\u003cdiv class=\"card-title\">'+escapeHtml(a.assunto)+'\u003c/div>'+\n          (prazoTxt?'\u003cspan class=\"card-aging '+(atrasado?'alert':'')+'\">'+escapeHtml(prazoTxt)+'\u003c/span>':'') +\n        '\u003c/div>'+\n        (a.desc?'\u003cdiv class=\"card-desc\">'+escapeHtml(a.desc)+'\u003c/div>':'')+\n        '\u003cdiv class=\"card-meta\">'+\n          '\u003cspan class=\"badge '+statusBadge(a.status)+'\">'+statusLabel(a.status)+'\u003c/span> '+\n          '\u003cspan class=\"badge '+priorCor(a.prioridade)+'\">'+escapeHtml(a.prioridade)+'\u003c/span> '+\n          (a.setor?'\u003cspan class=\"badge '+setorCor(a.setor)+'\">'+escapeHtml(a.setor)+'\u003c/span>':'')+\n        '\u003c/div>'+\n        (a.dataLanc||a.dataTerm?'\u003cdiv class=\"card-dates\">'+(a.dataLanc?'Lancamento: '+formatDate(a.dataLanc):'')+' '+(a.dataTerm?'Termino: '+formatDate(a.dataTerm):'')+'\u003c/div>':'')+\n        '\u003cdiv class=\"card-footer\">'+\n          '\u003cspan class=\"card-resp\">Resp: '+escapeHtml(a.resp||'\u2014')+'\u003c/span>'+\n          (a.criador?'\u003cspan class=\"card-resp\" style=\"margin-left:8px\">Criador: '+escapeHtml(a.criador)+'\u003c/span>':'')+\n        '\u003c/div>'+\n      '\u003c/div>';\n    }).join(''):('\u003cdiv class=\"drop-zone\" style=\"display:none\">\u003c/div>');\n    return '\u003cdiv class=\"kol '+c.cls+'\">'+\n      '\u003cdiv class=\"kol-hdr\">\u003cspan class=\"kol-title\">'+c.label+'\u003c/span>\u003cspan class=\"kol-count\">'+cards.length+'\u003c/span>\u003c/div>'+\n      cardsHtml+'\u003c/div>';\n  }).join('');\n\n  pk.innerHTML=\n    '\u003cdiv class=\"print-header\" style=\"margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid #d4541a\">'+\n      '\u003cdiv style=\"font-family:var(--serif);font-size:22px;font-weight:800;color:#1c1c1c\">Gerenciamento \u2014 Check-in \u2014 '+obra+'\u003c/div>'+\n      '\u003cdiv style=\"font-size:12px;color:#4a4540;margin-top:4px\">'+\n        'Data: '+data+' '+hora+' &nbsp;|&nbsp; '+\n        'Total: '+assuntos.length+' assuntos &nbsp;|&nbsp; '+\n        'A fazer: '+af+' &nbsp;|&nbsp; Fazendo: '+fz+' &nbsp;|&nbsp; Concluidos: '+co+\n        (ca>0?' &nbsp;|&nbsp; Cancelados: '+ca:'')+\n        (at>0?' &nbsp;|&nbsp; \u003cspan style=\"color:#b83228;font-weight:700\">Atrasados: '+at+'\u003c/span>':'')+\n      '\u003c/div>'+\n    '\u003c/div>'+\n    '\u003cdiv class=\"kanban-wrap\">'+khtml+'\u003c/div>';\n\n  pk.style.display='block';\n  setTimeout(function(){pk.style.display='none';},3000);\n}\n\n\nfunction renderCalendario(){\n  const ano=calMes.getFullYear(),mes=calMes.getMonth();\n  document.getElementById('cal-titulo').textContent=calMes.toLocaleDateString('pt-BR',{month:'long',year:'numeric'}).replace(/^\\w/,c=>c.toUpperCase());\n  const primeiroDia=new Date(ano,mes,1).getDay();\n  const diasMes=new Date(ano,mes+1,0).getDate();\n  const hoje=new Date();\n  const eventosDias={};\n  assuntos.forEach(a=>{\n    if(!a.dataLanc)return;\n    const[a_ano,a_mes,a_dia]=String(a.dataLanc).slice(0,10).split('-').map(Number);\n    if(a_ano===ano&&a_mes-1===mes)eventosDias[a_dia]=(eventosDias[a_dia]||0)+1;\n  });\n  const dias=['Dom','Seg','Ter','Qua','Qui','Sex','S\u00e1b'];\n  let html=dias.map(d=>`\u003cdiv class=\"cal-day-name\">${d}\u003c/div>`).join('');\n  for(let i=0;i\u003cprimeiroDia;i++)html+=`\u003cdiv class=\"cal-day empty\">\u003c/div>`;\n  for(let d=1;d\u003c=diasMes;d++){\n    const isHoje=d===hoje.getDate()&&mes===hoje.getMonth()&&ano===hoje.getFullYear();\n    html+=`\u003cdiv class=\"cal-day ${isHoje?'today':''} ${eventosDias[d]?'has-event':''}\">${d}\u003c/div>`;\n  }\n  document.getElementById('cal-grid').innerHTML=html;\n  const lr=document.getElementById('lista-reunioes-cal');\n  const assuntosDoMes=assuntos.filter(a=>{\n    if(!a.dataLanc)return false;\n    const[a_ano,a_mes]=String(a.dataLanc).slice(0,10).split('-').map(Number);\n    return a_ano===ano&&a_mes===mes+1;\n  }).sort((a,b)=>String(b.dataLanc).localeCompare(String(a.dataLanc)));\n  lr.innerHTML=assuntosDoMes.length?assuntosDoMes.map(a=>`\n    \u003cdiv class=\"ultimas-item\">\n      \u003cdiv class=\"ultimas-data\">${escapeHtml(a.dataLanc||'')}\u003c/div>\n      \u003cdiv class=\"ultimas-titulo\">${escapeHtml(a.assunto)}\u003c/div>\n      \u003cdiv class=\"ultimas-meta\">\n        \u003cspan class=\"badge ${priorCor(a.prioridade)}\">${escapeHtml(a.prioridade)}\u003c/span>\n        \u003cspan class=\"badge ${statusBadge(a.status)}\">${statusLabel(a.status)}\u003c/span>\n        ${a.setor?`\u003cspan class=\"badge ${setorCor(a.setor)}\">${escapeHtml(a.setor)}\u003c/span>`:''}\n      \u003c/div>\n    \u003c/div>\n  `).join(''):'\u003cdiv class=\"empty-state\">\u003cdiv class=\"empty-state-icon\">\ud83d\udced\u003c/div>\u003cdiv class=\"empty-state-txt\">Nenhum assunto neste m\u00eas\u003c/div>\u003c/div>';\n}\n\nfunction calNav(dir){calMes=new Date(calMes.getFullYear(),calMes.getMonth()+dir,1);renderCalendario()}\n\nfunction setResumoTab(tab,el){\n  resumoTab=tab;\n  document.querySelectorAll('.rtab').forEach(b=>b.classList.remove('active'));\n  el.classList.add('active');renderResumo();\n}\n\nfunction getPeriodoResumo(tab){\n  const hoje=new Date();\n  if(tab==='mensal'){\n    const ini=new Date(hoje.getFullYear(),hoje.getMonth(),1,0,0,0,0).getTime();\n    const fim=new Date(hoje.getFullYear(),hoje.getMonth()+1,0,23,59,59,999).getTime();\n    return {ini,fim};\n  }\n  const fim=new Date(hoje);fim.setHours(23,59,59,999);\n  const ini=new Date(hoje);ini.setDate(ini.getDate()-6);ini.setHours(0,0,0,0);\n  return {ini:ini.getTime(),fim:fim.getTime()};\n}\nfunction filtrarPorPeriodo(lista,tab){\n  const {ini,fim}=getPeriodoResumo(tab);\n  return lista.filter(a=>{\n    const ref=a.dataLanc?new Date(a.dataLanc).getTime():a.criadoEm;\n    if(!ref||isNaN(ref))return false;\n    return ref>=ini&&ref\u003c=fim;\n  });\n}\nfunction renderResumo(){\n  const cont=document.getElementById('resumo-conteudo');\n  const base=filtrarPorPeriodo(assuntos,resumoTab);\n  const af=base.filter(a=>a.status==='afazer').length;\n  const co=base.filter(a=>a.status==='concluido').length;\n  const hojeStr=hojeISO();\n  const at=base.filter(a=>a.status!=='concluido'&&a.status!=='cancelado'&&a.dataTerm&&a.dataTerm\u003chojeStr).length;\n  const total=base.length;\n  const totalAtivo=base.filter(a=>a.status!=='cancelado').length;\n  const concluidos=base.filter(a=>a.status==='concluido'&&a.concluidoEm&&a.criadoEm);\n  const mediaD=concluidos.length?Math.round(concluidos.reduce((s,a)=>s+(a.concluidoEm-a.criadoEm)/86400000,0)/concluidos.length):0;\n  const setorRanking={};\n  base.forEach(a=>{if(a.setor){if(!setorRanking[a.setor])setorRanking[a.setor]={total:0,conc:0};setorRanking[a.setor].total++;if(a.status==='concluido')setorRanking[a.setor].conc++}});\n  const ranking=Object.entries(setorRanking).sort((a,b)=>b[1].conc-a[1].conc);\n  const cores=['var(--accent)','var(--yellow)','var(--green)','var(--blue)'];\n  const periodoLabel=resumoTab==='mensal'?'no m\u00eas atual':'nos \u00faltimos 7 dias';\n  cont.innerHTML=`\n    \u003cdiv style=\"font-size:11px;color:var(--ink-soft);margin-bottom:8px;text-transform:uppercase;letter-spacing:.4px\">Per\u00edodo: ${periodoLabel}\u003c/div>`+`\n    \u003cdiv style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px\">\n      \u003cdiv class=\"ci-box\">\u003cdiv class=\"ci-box-val\">${total}\u003c/div>\u003cdiv class=\"ci-box-lbl\">Assuntos\u003c/div>\u003c/div>\n      \u003cdiv class=\"ci-box\">\u003cdiv class=\"ci-box-val green\">${co}\u003c/div>\u003cdiv class=\"ci-box-lbl\">Conclu\u00eddos\u003c/div>\u003c/div>\n      \u003cdiv class=\"ci-box\">\u003cdiv class=\"ci-box-val red\">${at}\u003c/div>\u003cdiv class=\"ci-box-lbl\">Atrasados\u003c/div>\u003c/div>\n      \u003cdiv class=\"ci-box\">\u003cdiv class=\"ci-box-val yellow\">${mediaD}d\u003c/div>\u003cdiv class=\"ci-box-lbl\">Tempo M\u00e9dio\u003c/div>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"kanban-status-box\">\n      \u003cdiv style=\"font-size:11px;color:#aaa;text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-bottom:10px\">\ud83d\udcca Status Atual do Kanban\u003c/div>\n      \u003cdiv class=\"ksb-row\">\n        \u003cdiv>\u003cdiv class=\"ksb-val blue\">${af}\u003c/div>\u003cdiv class=\"ksb-lbl\">\ud83c\udfaf A Fazer\u003c/div>\u003c/div>\n        \u003cdiv>\u003cdiv class=\"ksb-val yellow\">${base.filter(a=>a.status==='fazendo').length}\u003c/div>\u003cdiv class=\"ksb-lbl\">\u26a1 Fazendo\u003c/div>\u003c/div>\n        \u003cdiv>\u003cdiv class=\"ksb-val green\">${co}\u003c/div>\u003cdiv class=\"ksb-lbl\">\u2705 Conclu\u00eddo\u003c/div>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"ksb-progress\">\u003cdiv class=\"ksb-progress-fill\" style=\"width:${totalAtivo?Math.round(co/totalAtivo*100):0}%\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"ksb-pct\">${totalAtivo?Math.round(co/totalAtivo*100):0}% conclu\u00eddo\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"sec\">\n      \u003cdiv class=\"sec-title\">\ud83c\udfc6 Ranking de Setores\u003c/div>\n      ${ranking.length?ranking.map(([s,v],i)=>`\n        \u003cdiv class=\"ranking-item\">\n          \u003cspan class=\"ranking-num\">${i+1}\u003c/span>\n          \u003cspan class=\"ranking-label\">${s}\u003c/span>\n          \u003cdiv class=\"ranking-bar-wrap\">\u003cdiv class=\"ranking-bar\" style=\"width:${v.total?Math.round(v.conc/v.total*100):0}%;background:${cores[i]||'var(--ink-soft)'}\">\u003c/div>\u003c/div>\n          \u003cspan class=\"ranking-pct\">${v.total?Math.round(v.conc/v.total*100):0}%\u003c/span>\n        \u003c/div>\n      `).join(''):'\u003cdiv class=\"empty-state\">\u003cdiv class=\"empty-state-txt\">Sem dados\u003c/div>\u003c/div>'}\n    \u003c/div>\n    \u003cdiv class=\"sec\">\n      \u003cdiv class=\"sec-title\">\u23f1\ufe0f Aging \u2014 Prazo por Assunto\u003c/div>\n      ${base.length?base.map(a=>{\n        const diasRestantes=a.dataTerm?diasAteVencimento(a.dataTerm):null;\n        const atrasado=diasRestantes!==null&&diasRestantes\u003c0&&a.status!=='concluido'&&a.status!=='cancelado';\n        return `\u003cdiv style=\"display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)\">\n          \u003cspan style=\"font-size:13px;font-weight:600;flex:1;padding-right:8px\">${escapeHtml(a.assunto)}\u003c/span>\n          \u003cspan class=\"badge ${a.status==='concluido'?'badge-green':a.status==='cancelado'?'badge-canceled':atrasado?'badge-red':'badge-gray'}\">${a.status==='concluido'?'\u2714 Conclu\u00eddo':a.status==='cancelado'?'Cancelado':diasRestantes===null?'\u2014':atrasado?`${Math.abs(diasRestantes)}d atraso`:`${diasRestantes}d restante`}\u003c/span>\n        \u003c/div>`;\n      }).join(''):'\u003cdiv class=\"empty-state\">\u003cdiv class=\"empty-state-txt\">Sem dados\u003c/div>\u003c/div>'}\n    \u003c/div>\n  `;\n}\n\nfunction renderDashboard(){\n  const cont=document.getElementById('dashboard-conteudo');\n  const af=assuntos.filter(a=>a.status==='afazer').length;\n  const co=assuntos.filter(a=>a.status==='concluido').length;\n  const fz=assuntos.filter(a=>a.status==='fazendo').length;\n  const total=assuntos.length;\n  const totalAtivo=assuntos.filter(a=>a.status!=='cancelado').length;\n  const pct=totalAtivo?Math.round(co/totalAtivo*100):0;\n  const hojeStr=hojeISO();\n  const at=assuntos.filter(a=>a.status!=='concluido'&&a.status!=='cancelado'&&a.dataTerm&&a.dataTerm\u003chojeStr).length;\n  const setorDados={};\n  assuntos.forEach(a=>{if(a.setor){if(!setorDados[a.setor])setorDados[a.setor]=0;setorDados[a.setor]++}});\n  const cores=['var(--accent)','var(--yellow)','var(--green)','var(--blue)'];\n  const maxSetor=Math.max(...Object.values(setorDados),1);\n  cont.innerHTML=`\n    \u003cdiv class=\"sec\" style=\"background:var(--bg-dark);color:#f0ece7\">\n      \u003cdiv style=\"font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-bottom:12px;text-align:center\">\ud83c\udfd7\ufe0f Vis\u00e3o Geral da Obra\u003c/div>\n      \u003cdiv style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px\">\n        \u003cdiv style=\"background:#2e2b28;border-radius:8px;padding:12px;text-align:center\">\n          \u003cdiv style=\"font-family:var(--serif);font-size:32px;font-weight:800;color:var(--accent)\">${pct}%\u003c/div>\n          \u003cdiv style=\"font-size:11px;color:#888;text-transform:uppercase\">Total resolvido\u003c/div>\n        \u003c/div>\n        \u003cdiv style=\"background:#2e2b28;border-radius:8px;padding:12px;text-align:center\
