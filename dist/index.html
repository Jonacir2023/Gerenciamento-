.target.result;\n  };\n  reader.readAsDataURL(file);\n}\n\nfunction removerLogo() {\n  confirmar('Remover o logo da empresa?', () => {\n    state.obra.logo = '';\n    saveState();\n    renderLogoPreview();\n    atualizarHeader();\n    toast('Logo removido');\n  }, '\ud83d\uddbc\ufe0f Remover Logo');\n}\n\nfunction renderLogoPreview() {\n  const el = document.getElementById('logoPrev');\n  if (state.obra.logo) {\n    el.innerHTML = `\u003cimg src=\"${state.obra.logo}\" alt=\"logo\">`;\n  } else {\n    el.innerHTML = 'LOGO';\n  }\n}\n\n// ============================================================\n// CONFIG - render\n// ============================================================\nfunction renderConfig() {\n  // obra\n  document.getElementById('cfgObra').value = state.obra.nome || '';\n  document.getElementById('cfgEmpresa').value = state.obra.empresa || '';\n  document.getElementById('cfgLocal').value = state.obra.local || '';\n  document.getElementById('cfgContrato').value = state.obra.contrato || '';\n  document.getElementById('cfgEncerramentoNormal').value = state.obra.encerramentoNormal || '17:00';\n  document.getElementById('cfgEncerramentoSexta').value = state.obra.encerramentoSexta || '16:00';\n  document.getElementById('cfgEncerramentoSabado').value = state.obra.encerramentoSabado || '16:00';\n  renderLogoPreview();\n  \n  renderConfigColab();\n  renderConfigEquip();\n  renderConfigVL();\n  renderConfigAtiv();\n  renderConfigEventos('seguranca');\n  renderConfigEventos('meio_ambiente');\n  document.getElementById('histCount').textContent = Object.keys(history).length;\n  atualizarInfoAutoBackup();\n}\n\nfunction renderConfigColab() {\n  const cont = document.getElementById('configColabList');\n  cont.innerHTML = '';\n\n  state.colaboradores.categorias.forEach(cat => {\n    // \u2014 bloco da categoria \u2014\n    const block = document.createElement('div');\n    block.className = 'cat-block';\n\n    // cabe\u00e7alho\n    const header = document.createElement('div');\n    header.className = 'cat-header';\n\n    const headerLeft = document.createElement('div');\n    headerLeft.className = 'cat-header-left';\n    headerLeft.innerHTML = `\u003cspan class=\"cat-icon\">${cat.icon || '\ud83d\udcc1'}\u003c/span>\u003cspan class=\"cat-name\">${escapeHtml(cat.nome)}\u003c/span>`;\n\n    const count = document.createElement('span');\n    count.className = 'cat-count';\n    count.textContent = cat.itens.length;\n\n    const actions = document.createElement('div');\n    actions.className = 'item-actions';\n    actions.style.marginLeft = '6px';\n\n    const btnEditCat = document.createElement('button');\n    btnEditCat.className = 'icon-btn';\n    btnEditCat.textContent = '\u270f\ufe0f';\n    btnEditCat.addEventListener('click', (e) => { e.stopPropagation(); editarCategoria(cat.id); });\n\n    const btnDelCat = document.createElement('button');\n    btnDelCat.className = 'icon-btn';\n    btnDelCat.textContent = '\ud83d\uddd1\ufe0f';\n    btnDelCat.addEventListener('click', (e) => { e.stopPropagation(); removerCategoria(cat.id); });\n\n    const toggle = document.createElement('span');\n    toggle.className = 'cat-toggle';\n    toggle.textContent = '\u25bc';\n\n    actions.appendChild(btnEditCat);\n    actions.appendChild(btnDelCat);\n    actions.appendChild(toggle);\n\n    header.appendChild(headerLeft);\n    header.appendChild(count);\n    header.appendChild(actions);\n    header.onclick = (e) => { if (e.target.closest('button')) return; block.classList.toggle('collapsed'); };\n\n    // corpo\n    const body = document.createElement('div');\n    body.className = 'cat-body';\n\n    if (cat.itens.length === 0) {\n      body.innerHTML = '\u003cdiv class=\"empty\">Sem colaboradores\u003c/div>';\n    } else {\n      cat.itens.forEach(c => {\n        const row = document.createElement('div');\n        row.className = 'item-row';\n\n        const info = document.createElement('div');\n        info.className = 'item-info';\n        info.innerHTML = `\u003cdiv class=\"item-name\">${escapeHtml(c.nome)}\u003c/div>\u003cdiv class=\"item-meta\">\u003cspan class=\"mat\">${escapeHtml(c.mat)}\u003c/span> \u00b7 ${escapeHtml(c.funcao)}\u003c/div>`;\n\n        const rowActions = document.createElement('div');\n        rowActions.className = 'item-actions';\n\n        const btnEdit = document.createElement('button');\n        btnEdit.className = 'icon-btn';\n        btnEdit.textContent = '\u270f\ufe0f';\n        btnEdit.addEventListener('click', (e) => { e.stopPropagation(); editarColaborador(cat.id, c.id); });\n\n        const btnDel = document.createElement('button');\n        btnDel.className = 'icon-btn';\n        btnDel.textContent = '\ud83d\uddd1\ufe0f';\n        btnDel.addEventListener('click', (e) => { e.stopPropagation(); removerColaborador(cat.id, c.id); });\n\n        rowActions.appendChild(btnEdit);\n        rowActions.appendChild(btnDel);\n        row.appendChild(info);\n        row.appendChild(rowActions);\n        body.appendChild(row);\n      });\n    }\n\n    // bot\u00e3o adicionar colaborador\n    const addWrap = document.createElement('div');\n    addWrap.style.padding = '8px 12px';\n    const btnAdd = document.createElement('button');\n    btnAdd.className = 'add-btn-full';\n    btnAdd.textContent = '+ Colaborador';\n    btnAdd.addEventListener('click', () => abrirModalColaborador(cat.id));\n    addWrap.appendChild(btnAdd);\n    body.appendChild(addWrap);\n\n    block.appendChild(header);\n    block.appendChild(body);\n    cont.appendChild(block);\n  });\n}\n\nfunction renderConfigEquip() {\n  const cont = document.getElementById('configEquipList');\n  cont.innerHTML = '';\n  if (state.equipamentos.length === 0) {\n    cont.innerHTML = '\u003cdiv class=\"empty\">Nenhum equipamento\u003c/div>';\n    return;\n  }\n  state.equipamentos.forEach(eq => {\n    const row = document.createElement('div');\n    row.className = 'item-row';\n\n    const info = document.createElement('div');\n    info.className = 'item-info';\n    const nome = document.createElement('div');\n    nome.className = 'item-name';\n    nome.textContent = eq.desc + (eq.isMotorista ? ' \ud83d\ude9b' : '');\n    const meta = document.createElement('div');\n    meta.className = 'item-meta';\n    const num = document.createElement('span');\n    num.className = 'num';\n    num.textContent = eq.numero;\n    meta.appendChild(num);\n    const extra = document.createElement('div');\n    extra.className = 'item-extra';\n    extra.textContent = eq.isMotorista ? 'Usa lista de Motoristas' : 'Usa lista Operacional';\n    info.appendChild(nome);\n    info.appendChild(meta);\n    info.appendChild(extra);\n\n    const acts = document.createElement('div');\n    acts.className = 'item-actions';\n    const btnEdit = document.createElement('button');\n    btnEdit.className = 'icon-btn';\n    btnEdit.textContent = '\u270f\ufe0f';\n    btnEdit.addEventListener('click', () => editarEquipamento(eq.id));\n    const btnDel = document.createElement('button');\n    btnDel.className = 'icon-btn';\n    btnDel.textContent = '\ud83d\uddd1\ufe0f';\n    btnDel.addEventListener('click', () => removerEquipamento(eq.id));\n    acts.appendChild(btnEdit);\n    acts.appendChild(btnDel);\n\n    row.appendChild(info);\n    row.appendChild(acts);\n    cont.appendChild(row);\n  });\n}\n\nfunction renderConfigAtiv() {\n  const cont = document.getElementById('configAtivList');\n  cont.innerHTML = '';\n  if (state.atividades.length === 0) {\n    cont.innerHTML = '\u003cdiv class=\"empty\">Nenhuma atividade\u003c/div>';\n    return;\n  }\n  state.atividades.forEach(a => {\n    const row = document.createElement('div');\n    row.className = 'item-row';\n\n    const info = document.createElement('div');\n    info.className = 'item-info';\n    const nome = document.createElement('div');\n    nome.className = 'item-name';\n    nome.textContent = a.desc;\n    const meta = document.createElement('div');\n    meta.className = 'item-meta';\n    if (a.local) meta.appendChild(document.createTextNode(a.local));\n    if (a.local && a.unidade) meta.appendChild(document.createTextNode(' \u00b7 '));\n    if (a.unidade) {\n      const strong = document.createElement('strong');\n      strong.textContent = a.unidade;\n      meta.appendChild(strong);\n    }\n    info.appendChild(nome);\n    info.appendChild(meta);\n\n    const acts = document.createElement('div');\n    acts.className = 'item-actions';\n    const btnEdit = document.createElement('button');\n    btnEdit.className = 'icon-btn';\n    btnEdit.textContent = '\u270f\ufe0f';\n    btnEdit.addEventListener('click', () => editarAtividade(a.id));\n    const btnDel = document.createElement('button');\n    btnDel.className = 'icon-btn';\n    btnDel.textContent = '\ud83d\uddd1\ufe0f';\n    btnDel.addEventListener('click', () => removerAtividade(a.id));\n    acts.appendChild(btnEdit);\n    acts.appendChild(btnDel);\n\n    row.appendChild(info);\n    row.appendChild(acts);\n    cont.appendChild(row);\n  });\n}\n\nfunction renderConfigEventos(tipo) {\n  const cont = document.getElementById(tipo === 'seguranca' ? 'configSegList' : 'configAmbList');\n  cont.innerHTML = '';\n  const lista = state[tipo];\n  if (lista.length === 0) { cont.innerHTML = '\u003cdiv class=\"empty\">Nenhum tipo\u003c/div>'; return; }\n  lista.forEach(e => {\n    const row = document.createElement('div');\n    row.className = 'item-row';\n\n    const info = document.createElement('div');\n    info.className = 'item-info';\n    const nome = document.createElement('div');\n    nome.className = 'item-name';\n    nome.textContent = e.desc;\n    info.appendChild(nome);\n\n    const acts = document.createElement('div');\n    acts.className = 'item-actions';\n    const btnEdit = document.createElement('button');\n    btnEdit.className = 'icon-btn';\n    btnEdit.textContent = '\u270f\ufe0f';\n    btnEdit.addEventListener('click', () => editarEventoCadastro(tipo, e.id));\n    const btnDel = document.createElement('button');\n    btnDel.className = 'icon-btn';\n    btnDel.textContent = '\ud83d\uddd1\ufe0f';\n    btnDel.addEventListener('click', () => removerEventoCadastro(tipo, e.id));\n    acts.appendChild(btnEdit);\n    acts.appendChild(btnDel);\n\n    row.appendChild(info);\n    row.appendChild(acts);\n    cont.appendChild(row);\n  });\n}\n\n// ============================================================\n// CRUD\n// ============================================================\nfunction abrirModalCategoria() {\n  editingCat = { type: 'colab_cat', id: null };\n  document.getElementById('modalCatTitle').textContent = 'Nova Categoria';\n  document.getElementById('modalCatIcon').value = '';\n  document.getElementById('modalCatNome').value = '';\n  abrirModal('modalCategoria');\n}\nfunction editarCategoria(id) {\n  const cat = state.colaboradores.categorias.find(c => c.id === id);\n  editingCat = { type: 'colab_cat', id };\n  document.getElementById('modalCatTitle').textContent = 'Editar Categoria';\n  document.getElementById('modalCatIcon').value = cat.icon || '';\n  document.getElementById('modalCatNome').value = cat.nome;\n  abrirModal('modalCategoria');\n}\nfunction salvarCategoria() {\n  const icon = document.getElementById('modalCatIcon').value.trim();\n  const nome = document.getElementById('modalCatNome').value.trim();\n  if (!nome) { toast('Nome obrigat\u00f3rio'); return; }\n  if (editingCat.id) {\n    const cat = state.colaboradores.categorias.find(c => c.id === editingCat.id);\n    cat.icon = icon; cat.nome = nome;\n  } else {\n    state.colaboradores.categorias.push({ id: uid('cat'), icon, nome, itens: [] });\n  }\n  saveState();\n  fecharModal('modalCategoria');\n  renderConfigColab();\n  toast('Salvo');\n}\nfunction removerCategoria(id) {\n  confirmar('Remover esta categoria e todos os colaboradores vinculados?', () => {\n    state.colaboradores.categorias = state.colaboradores.categorias.filter(c => c.id !== id);\n    saveState();\n    renderConfigColab();\n    toast('Removido');\n  });\n}\nfunction abrirModalColaborador(catId) {\n  editingItem = { type: 'colab', parentId: catId, id: null };\n  document.getElementById('modalColabTitle').textContent = 'Novo Colaborador';\n  document.getElementById('modalColabMat').value = '';\n  document.getElementById('modalColabNome').value = '';\n  document.getElementById('modalColabFunc').value = '';\n  abrirModal('modalColab');\n}\nfunction editarColaborador(catId, id) {\n  const cat = state.colaboradores.categorias.find(c => c.id === catId);\n  const c = cat.itens.find(x => x.id === id);\n  editingItem = { type: 'colab', parentId: catId, id };\n  document.getElementById('modalColabTitle').textContent = 'Editar Colaborador';\n  document.getElementById('modalColabMat').value = c.mat;\n  document.getElementById('modalColabNome').value = c.nome;\n  document.getElementById('modalColabFunc').value = c.funcao;\n  abrirModal('modalColab');\n}\nfunction salvarColaborador() {\n  const mat = document.getElementById('modalColabMat').value.trim();\n  const nome = document.getElementById('modalColabNome').value.trim();\n  const funcao = document.getElementById('modalColabFunc').value.trim();\n  if (!mat || !nome) { toast('Matr\u00edcula e nome obrigat\u00f3rios'); return; }\n  const cat = state.colaboradores.categorias.find(c => c.id === editingItem.parentId);\n  if (editingItem.id) {\n    const c = cat.itens.find(x => x.id === editingItem.id);\n    c.mat = mat; c.nome = nome; c.funcao = funcao;\n  } else {\n    cat.itens.push({ id: uid('p'), mat, nome, funcao });\n  }\n  saveState();\n  fecharModal('modalColab');\n  renderConfigColab();\n  toast('Salvo');\n}\nfunction removerColaborador(catId, id) {\n  confirmar('Remover este colaborador?', () => {\n    const cat = state.colaboradores.categorias.find(c => c.id === catId);\n    cat.itens = cat.itens.filter(c => c.id !== id);\n    saveState();\n    renderConfigColab();\n    toast('Removido');\n  });\n}\n\n// FROTA VE\u00cdCULOS LEVES (cadastro)\nfunction renderConfigVL() {\n  const cont = document.getElementById('configVLList');\n  if (!cont) return;\n  cont.innerHTML = '';\n  const frota = state.veiculosFrota || [];\n  if (frota.length === 0) { cont.innerHTML = '\u003cdiv class=\"empty\">Nenhum ve\u00edculo leve cadastrado\u003c/div>'; return; }\n  frota.forEach(v => {\n    const row = document.createElement('div');\n    row.className = 'item-row';\n\n    const info = document.createElement('div');\n    info.className = 'item-info';\n    const nome = document.createElement('div');\n    nome.className = 'item-name';\n    nome.textContent = '\ud83d\ude97 ' + v.desc;\n    const meta = document.createElement('div');\n    meta.className = 'item-meta';\n    const num = document.createElement('span');\n    num.className = 'num';\n    num.textContent = v.placa;\n    meta.appendChild(num);\n    if (v.tipo) meta.appendChild(document.createTextNode(' \u00b7 ' + v.tipo));\n    info.appendChild(nome);\n    info.appendChild(meta);\n\n    const acts = document.createElement('div');\n    acts.className = 'item-actions';\n    const btnEdit = document.createElement('button');\n    btnEdit.className = 'icon-btn';\n    btnEdit.textContent = '\u270f\ufe0f';\n    btnEdit.addEventListener('click', () => editarVeiculoFrota(v.id));\n    const btnDel = document.createElement('button');\n    btnDel.className = 'icon-btn';\n    btnDel.textContent = '\ud83d\uddd1\ufe0f';\n    btnDel.addEventListener('click', () => removerVeiculoFrota(v.id));\n    acts.appendChild(btnEdit);\n    acts.appendChild(btnDel);\n\n    row.appendChild(info);\n    row.appendChild(acts);\n    cont.appendChild(row);\n  });\n}\nfunction abrirModalVeiculoFrota() {\n  editingItem = { type: 'vl', id: null };\n  document.getElementById('modalVeiculoFrotaTitle').textContent = 'Novo Ve\u00edculo Leve';\n  document.getElementById('modalVFDesc').value = '';\n  document.getElementById('modalVFPlaca').value = '';\n  document.getElementById('modalVFTipo').value = '';\n  abrirModal('modalVeiculoFrota');\n}\nfunction editarVeiculoFrota(id) {\n  const v = (state.veiculosFrota || []).find(x => x.id === id);\n  editingItem = { type: 'vl', id };\n  document.getElementById('modalVeiculoFrotaTitle').textContent = 'Editar Ve\u00edculo Leve';\n  document.getElementById('modalVFDesc').value = v.desc;\n  document.getElementById('modalVFPlaca').value = v.placa;\n  document.getElementById('modalVFTipo').value = v.tipo || '';\n  abrirModal('modalVeiculoFrota');\n}\nfunction salvarVeiculoFrota() {\n  const desc = document.getElementById('modalVFDesc').value.trim();\n  const placa = document.getElementById('modalVFPlaca').value.trim();\n  const tipo = document.getElementById('modalVFTipo').value.trim();\n  if (!desc || !placa) { toast('Descri\u00e7\u00e3o e placa obrigat\u00f3rios'); return; }\n  if (!state.veiculosFrota) state.veiculosFrota = [];\n  if (editingItem.id) {\n    const v = state.veiculosFrota.find(x => x.id === editingItem.id);\n    v.desc = desc; v.placa = placa; v.tipo = tipo;\n  } else {\n    state.veiculosFrota.push({ id: uid('vf'), desc, placa, tipo });\n  }\n  saveState(); fecharModal('modalVeiculoFrota'); renderConfigVL(); toast('Salvo');\n}\nfunction removerVeiculoFrota(id) {\n  confirmar('Remover este ve\u00edculo da frota?', () => {\n    state.veiculosFrota = (state.veiculosFrota || []).filter(v => v.id !== id);\n    saveState(); renderConfigVL(); toast('Removido');\n  });\n}\n\nfunction abrirModalEquipamento() {\n  editingItem = { type: 'equip', id: null };\n  document.getElementById('modalEquipTitle').textContent = 'Novo Equipamento';\n  document.getElementById('modalEquipNum').value = '';\n  document.getElementById('modalEquipDesc').value = '';\n  document.getElementById('modalEquipMotorista').checked = false;\n  abrirModal('modalEquip');\n}\nfunction editarEquipamento(id) {\n  const eq = state.equipamentos.find(e => e.id === id);\n  editingItem = { type: 'equip', id };\n  document.getElementById('modalEquipTitle').textContent = 'Editar Equipamento';\n  document.getElementById('modalEquipNum').value = eq.numero;\n  document.getElementById('modalEquipDesc').value = eq.desc;\n  document.getElementById('modalEquipMotorista').checked = !!eq.isMotorista;\n  abrirModal('modalEquip');\n}\nfunction salvarEquipamento() {\n  const numero = document.getElementById('modalEquipNum').value.trim();\n  const desc = document.getElementById('modalEquipDesc').value.trim();\n  const isMotorista = document.getElementById('modalEquipMotorista').checked;\n  if (!numero || !desc) { toast('N\u00famero e descri\u00e7\u00e3o obrigat\u00f3rios'); return; }\n  if (editingItem.id) {\n    const eq = state.equipamentos.find(e => e.id === editingItem.id);\n    eq.numero = numero; eq.desc = desc; eq.isMotorista = isMotorista;\n  } else {\n    state.equipamentos.push({ id: uid('eq'), numero, desc, isMotorista });\n  }\n  saveState();\n  fecharModal('modalEquip');\n  renderConfigEquip();\n  toast('Salvo');\n}\nfunction removerEquipamento(id) {\n  confirmar('Remover este equipamento?', () => {\n    state.equipamentos = state.equipamentos.filter(e => e.id !== id);\n    saveState();\n    renderConfigEquip();\n    toast('Removido');\n  });\n}\n\nfunction abrirModalAtividade() {\n  editingItem = { type: 'ativ', id: null };\n  document.getElementById('modalAtivTitle').textContent = 'Nova Atividade Padr\u00e3o';\n  document.getElementById('modalAtivDesc').value = '';\n  document.getElementById('modalAtivLocal').value = '';\n  document.getElementById('modalAtivUnidade').value = '';\n  abrirModal('modalAtividade');\n}\nfunction editarAtividade(id) {\n  const a = state.atividades.find(x => x.id === id);\n  editingItem = { type: 'ativ', id };\n  document.getElementById('modalAtivTitle').textContent = 'Editar Atividade';\n  document.getElementById('modalAtivDesc').value = a.desc;\n  document.getElementById('modalAtivLocal').value = a.local || '';\n  document.getElementById('modalAtivUnidade').value = a.unidade || '';\n  abrirModal('modalAtividade');\n}\nfunction salvarAtividade() {\n  const desc = document.getElementById('modalAtivDesc').value.trim();\n  const local = document.getElementById('modalAtivLocal').value.trim();\n  const unidade = document.getElementById('modalAtivUnidade').value.trim();\n  if (!desc) { toast('Descri\u00e7\u00e3o obrigat\u00f3ria'); return; }\n  if (editingItem.id) {\n    const a = state.atividades.find(x => x.id === editingItem.id);\n    a.desc = desc; a.local = local; a.unidade = unidade;\n  } else {\n    state.atividades.push({ id: uid('a'), desc, local, unidade });\n  }\n  saveState();\n  fecharModal('modalAtividade');\n  renderConfigAtiv();\n  toast('Salvo');\n}\nfunction removerAtividade(id) {\n  confirmar('Remover esta atividade?', () => {\n    state.atividades = state.atividades.filter(a => a.id !== id);\n    saveState();\n    renderConfigAtiv();\n    toast('Removido');\n  });\n}\n\nfunction abrirModalEventoCadastro(tipo) {\n  activeEventoTipo = tipo;\n  editingItem = { type: 'evcad', id: null };\n  document.getElementById('modalEventoCadTitle').textContent = 'Novo Tipo';\n  document.getElementById('modalEventoCadDesc').value = '';\n  abrirModal('modalEventoCad');\n}\nfunction editarEventoCadastro(tipo, id) {\n  activeEventoTipo = tipo;\n  editingItem = { type: 'evcad', id };\n  const e = state[tipo].find(x => x.id === id);\n  document.getElementById('modalEventoCadTitle').textContent = 'Editar Tipo';\n  document.getElementById('modalEventoCadDesc').value = e.desc;\n  abrirModal('modalEventoCad');\n}\nfunction salvarEventoCadastro() {\n  const desc = document.getElementById('modalEventoCadDesc').value.trim();\n  if (!desc) { toast('Descri\u00e7\u00e3o obrigat\u00f3ria'); return; }\n  if (editingItem.id) {\n    const e = state[activeEventoTipo].find(x => x.id === editingItem.id);\n    e.desc = desc;\n  } else {\n    state[activeEventoTipo].push({ id: uid('ec'), desc });\n  }\n  saveState();\n  fecharModal('modalEventoCad');\n  renderConfigEventos(activeEventoTipo);\n  toast('Salvo');\n}\nfunction removerEventoCadastro(tipo, id) {\n  confirmar('Remover este tipo?', () => {\n    state[tipo] = state[tipo].filter(e => e.id !== id);\n    saveState();\n    renderConfigEventos(tipo);\n    toast('Removido');\n  });\n}\n\n// ============================================================\n// MODAL UTIL\n// ============================================================\nfunction abrirModal(id) { document.getElementById(id).classList.add('show'); }\nfunction fecharModal(id) { document.getElementById(id).classList.remove('show'); }\n\n// Substitui\u00e7\u00e3o do confirm() nativo (bloqueado no iOS em file://)\nfunction confirmar(msg, onSim, titulo) {\n  document.getElementById('modalConfirmMsg').textContent = msg;\n  document.getElementById('modalConfirmTitle').textContent = titulo || '\u26a0\ufe0f Confirmar exclus\u00e3o';\n  abrirModal('modalConfirm');\n  const btnSim = document.getElementById('modalConfirmYes');\n  const btnNao = document.getElementById('modalConfirmNo');\n  const clone = (btn) => { const n = btn.cloneNode(true); btn.parentNode.replaceChild(n, btn); return n; };\n  clone(btnSim).addEventListener('click', () => { fecharModal('modalConfirm'); onSim(); });\n  clone(btnNao).addEventListener('click', () => fecharModal('modalConfirm'));\n}\n\n// ============================================================\n// RELAT\u00d3RIO\n// ============================================================\nfunction buildRelatorio(day) {\n  const dataBR = formatDateBR(day.data);\n  const dSemana = diaDaSemana(day.data);\n  const divisor = '\u2e3b\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014';\n  \n  let txt = '';\n  // Cabe\u00e7alho\n  if (state.obra.empresa) txt += `*${state.obra.empresa.toUpperCase()}*\\n`;\n  txt += `*Relat\u00f3rio de Obra \u2013 ${dataBR}*`;\n  if (state.obra.nome) txt += `\\n_${state.obra.nome}_`;\n  if (state.obra.local) txt += `\\n\ud83d\udccd ${state.obra.local}`;\n  if (state.obra.contrato) txt += `\\n\ud83d\uddc2\ufe0f ${state.obra.contrato}`;\n  txt += `\\n\ud83d\udcc6 ${dSemana}`;\n  txt += '\\n\\n';\n  \n  // Tempo\n  if (day.tempo || day.tempoVento) {\n    txt += `*\ud83c\udf24\ufe0f Condi\u00e7\u00f5es do Tempo*\\n\u2022 ${tempoLabel(day.tempo, day.tempoVento)}\\n\\n`;\n    txt += `${divisor}\\n\\n`;\n  }\n  \n  // Jornada\n  txt += `*\u23f0 Jornada de Trabalho*\\n`;\n  txt += `\u2022 Caf\u00e9: ${day.cafeInicio || '--:--'} \u00e0s ${day.cafeFim || '--:--'}\\n`;\n  txt += `\u2022 Almo\u00e7o: ${day.almocoInicio || '--:--'} \u00e0s ${day.almocoFim || '--:--'}\\n`;\n  txt += `\u2022 Encerramento: ${day.encerramento || '--:--'}\\n\\n`;\n  txt += `${divisor}\\n\\n`;\n  \n  // DSS\n  txt += `*\ud83d\udccb DSS \u2013 Di\u00e1logo de Seguran\u00e7a*\\n`;\n  if (day.dssHorario) txt += `\u2022 Hor\u00e1rio: ${day.dssHorario}\\n`;\n  if (day.dssMinistrou) {\n    const nomeDss = day.dssMinistrou.includes('|') ? day.dssMinistrou.split('|')[1] : day.dssMinistrou;\n    txt += `\u2022 Ministrado por: ${nomeDss}\\n`;\n  }\n  txt += `\u2022 Tema: ${day.dssTema || '\u2014'}\\n\\n`;\n  txt += `${divisor}\\n\\n`;\n  \n  // Atividades\n  txt += `*\ud83d\udee0\ufe0f Atividades do Dia*\\n`;\n  const ativsMarc = state.atividades.filter(a => day.atividadesMarcadas[a.id]);\n  if (ativsMarc.length === 0 && day.atividadesAvulsas.length === 0 && !day.atividadesExtra) {\n    txt += `\u2022 \u2014\\n`;\n  } else {\n    ativsMarc.forEach(a => {\n      const qtd = day.atividadesQtd && day.atividadesQtd[a.id];\n      const unid = a.unidade || '';\n      txt += `\u2022 ${a.desc}${a.local ? ' \u2014 ' + a.local : ''}`;\n      if (qtd) txt += ` \u25b8 *${qtd} ${unid}*`;\n      txt += '\\n';\n    });\n    day.atividadesAvulsas.forEach(a => txt += `\u2022 ${a.desc}${a.local ? ' \u2014 ' + a.local : ''}\\n`);\n    if (day.atividadesExtra) {\n      day.atividadesExtra.split('\\n').filter(x => x.trim()).forEach(l => txt += `\u2022 ${l}\\n`);\n    }\n  }\n  if ((day.atividadesParalisadas || []).length > 0) {\n    txt += `\\n*\u23f8\ufe0f Atividades Paralisadas \u2014 ${day.atividadesParalisadas.length}*\\n`;\n    day.atividadesParalisadas.forEach(p => txt += `\u2022 ${p.desc} \u2014 ${p.just || 'sem justificativa'}\\n`);\n  }\n  txt += `\\n${divisor}\\n\\n`;\n\n  // Equipamentos\n  const equipsAtivos = state.equipamentos.filter(e => day.equipamentos[e.id] && day.equipamentos[e.id].ativo);\n  if (equipsAtivos.length > 0) {\n    txt += `*\ud83d\ude9c Equipamentos Utilizados \u2014 ${equipsAtivos.length}*\\n`;\n    equipsAtivos.forEach(e => {\n      const d = day.equipamentos[e.id];\n      let linha = `\u2022 ${e.numero} \u2013 ${e.desc}`;\n      if (d.operadorNome) {\n        linha += ` \u2013 ${d.operadorMat ? d.operadorMat + ' ' : ''}${d.operadorNome}`;\n      }\n      if (d.status && d.status !== 'Operando') linha += ` (${d.status})`;\n      if (d.horimetro) linha += ` \u2014 Hor.: ${d.horimetro}h`;\n      txt += linha + '\\n';\n    });\n    // Ve\u00edculos Leves\n    const vlAtivos = (day.veiculosLeves || []).filter(v => v.frotaId);\n    if (vlAtivos.length > 0) {\n      txt += `\\n*\ud83d\ude97 Ve\u00edculos Leves \u2014 ${vlAtivos.length}*\\n`;\n      vlAtivos.forEach(v => {\n        const frota = (state.veiculosFrota || []).find(f => f.id === v.frotaId);\n        const desc = frota ? frota.desc : '\u2014';\n        const placa = frota ? frota.placa : '';\n        let lv = `\u2022 ${desc}`;\n        if (placa) lv += ` (${placa})`;\n        if (v.motoristaNome) lv += ` \u2014 ${v.motoristaNome}`;\n        txt += lv + '\\n';\n      });\n    }\n    txt += `\\n${divisor}\\n\\n`;\n  }\n\n  // Ve\u00edculos/Equipamentos Parados \u2014 campo 19 do contrato\n  const equipsParados = state.equipamentos.filter(e => !day.equipamentos?.[e.id]);\n  const vlParados = (state.veiculosFrota || []).filter(v => !(day.veiculosLeves || []).some(x => x.frotaId === v.id));\n  if (equipsParados.length > 0 || vlParados.length > 0) {\n    const parados = day.veiculosParados || {};\n    txt += `*\ud83c\udd7f\ufe0f Ve\u00edculos/Equipamentos Parados*\\n`;\n    equipsParados.forEach(e => txt += `\u2022 ${e.numero ? e.numero + ' \u2014 ' : ''}${e.desc}${parados[e.id] ? ': ' + parados[e.id] : ''}\\n`);\n    vlParados.forEach(v => txt += `\u2022 ${v.desc}${v.placa ? ' (' + v.placa + ')' : ''}${parados[v.id] ? ': ' + parados[v.id] : ''}\\n`);\n    txt += `\\n${divisor}\\n\\n`;\n  }\n\n  // Efetivo\n  txt += `*\ud83d\udccb Efetivo \u2013 ${dataBR}*\\n\\n`;\n  let total = 0;\n  state.colaboradores.categorias.forEach(cat => {\n    const presentes = cat.itens.filter(c => day.efetivo[c.id]);\n    if (presentes.length === 0) return;\n    total += presentes.length;\n    txt += `*${cat.icon || ''} ${cat.nome} \u2014 ${presentes.length}*\\n`;\n    presentes.forEach(c => txt += `\u2022 ${c.mat} \u2013 ${c.nome} \u2013 ${c.funcao}\\n`);\n    txt += `\\n${divisor}\\n\\n`;\n  });\n  txt += `*\u2705 Total Geral: ${total} colaboradores*\\n`;\n  \n  // Eventos Seguran\u00e7a\n  if (day.eventosSeguranca && day.eventosSeguranca.length > 0) {\n    txt += `\\n${divisor}\\n\\n`;\n    txt += `*\ud83e\uddba Eventos de Seguran\u00e7a \u2014 ${day.eventosSeguranca.length}*\\n`;\n    day.eventosSeguranca.forEach((ev, i) => {\n      txt += `\\n${i+1}. *${ev.tipo}* (${ev.gravidade})\\n`;\n      if (ev.desc) txt += `   Desc.: ${ev.desc}\\n`;\n      if (ev.acao) txt += `   A\u00e7\u00e3o: ${ev.acao}\\n`;\n    });\n  }\n  \n  // Eventos Meio Ambiente\n  if (day.eventosAmbiente && day.eventosAmbiente.length > 0) {\n    txt += `\\n${divisor}\\n\\n`;\n    txt += `*\ud83c\udf31 Eventos de Meio Ambiente \u2014 ${day.eventosAmbiente.length}*\\n`;\n    day.eventosAmbiente.forEach((ev, i) => {\n      txt += `\\n${i+1}. *${ev.tipo}* (${ev.gravidade})\\n`;\n      if (ev.desc) txt += `   Desc.: ${ev.desc}\\n`;\n      if (ev.acao) txt += `   A\u00e7\u00e3o: ${ev.acao}\\n`;\n    });\n  }\n  \n  return txt;\n}\n\n// ============================================================\n// ABA RESUMO \u2014 Semanal / Mensal\n// ============================================================\nlet resumoPeriodo = 'semana'; // 'semana' | 'mes'\nlet resumoOffset = 0; // 0 = atual, -1 = anterior, etc.\n\nfunction setResumoPeriodo(p) {\n  resumoPeriodo = p;\n  resumoOffset = 0;\n  document.getElementById('rtabSemana').classList.toggle('active', p === 'semana');\n  document.getElementById('rtabMes').classList.toggle('active', p === 'mes');\n  renderResumo();\n}\n\nfunction navegarResumoPeriodo(delta) {\n  resumoOffset += delta;\n  renderResumo();\n}\n\nfunction getResumoDatas() {\n  const hoje = new Date();\n  let inicio, fim;\n  if (resumoPeriodo === 'semana') {\n    const dow = hoje.getDay();\n    const diffSeg = (dow === 0) ? -6 : 1 - dow;\n    inicio = new Date(hoje);\n    inicio.setDate(hoje.getDate() + diffSeg + resumoOffset * 7);\n    fim = new Date(inicio);\n    fim.setDate(inicio.getDate() + 6);\n  } else {\n    const mesBase = hoje.getMonth() + resumoOffset;\n    const anoBase = hoje.getFullYear() + Math.floor(mesBase / 12);\n    const mesReal = ((mesBase % 12) + 12) % 12;\n    inicio = new Date(anoBase, mesReal, 1);\n    fim = new Date(anoBase, mesReal + 1, 0);\n  }\n  return {\n    inicio,\n    fim,\n    isoInicio: inicio.toISOString().slice(0, 10),\n    isoFim: fim.toISOString().slice(0, 10)\n  };\n}\n\nfunction renderResumo() {\n  const { inicio, fim, isoInicio, isoFim } = getResumoDatas();\n\n  // Label de navega\u00e7\u00e3o\n  if (resumoPeriodo === 'semana') {\n    const label = resumoOffset === 0 ? 'Semana Atual' : resumoOffset === -1 ? 'Semana Passada' : '';\n    document.getElementById('resumoNavLabel').innerHTML =\n      `${label ? label + '\u003cbr>' : ''}\u003cspan style=\"font-weight:400;font-size:12px;color:var(--ink-faint)\">${formatDateBR(isoInicio)} \u2192 ${formatDateBR(isoFim)}\u003c/span>`;\n  } else {\n    const meses = ['Janeiro','Fevereiro','Mar\u00e7o','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];\n    const label = resumoOffset === 0 ? 'M\u00eas Atual' : resumoOffset === -1 ? 'M\u00eas Passado' : '';\n    document.getElementById('resumoNavLabel').innerHTML =\n      `${label ? label + ' \u2014 ' : ''}\u003cstrong>${meses[inicio.getMonth()]} ${inicio.getFullYear()}\u003c/strong>`;\n  }\n\n  // Coletar dias com hist\u00f3rico no per\u00edodo\n  const diasPeriodo = Object.keys(history).filter(d => d >= isoInicio && d \u003c= isoFim).sort();\n\n  // Stats\n  document.getElementById('resumoStatDias').textContent = diasPeriodo.length;\n\n  // Acumular quantidades por atividade + detalhamento por dia\n  const acum = {}; // atId -> { total, dias: [{data, qtd}] }\n  diasPeriodo.forEach(data => {\n    const day = history[data];\n    if (!day.atividadesQtd) return;\n    Object.keys(day.atividadesQtd).forEach(atId => {\n      const val = parseFloat(day.atividadesQtd[atId]);\n      if (isNaN(val) || val \u003c= 0) return;\n      if (!acum[atId]) acum[atId] = { total: 0, dias: [] };\n      acum[atId].total += val;\n      acum[atId].dias.push({ data, qtd: val });\n    });\n    // Contar tamb\u00e9m atividades marcadas sem quantidade\n    if (day.atividadesMarcadas) {\n      Object.keys(day.atividadesMarcadas).forEach(atId => {\n        if (!acum[atId]) acum[atId] = { total: 0, dias: [] };\n        const jaTemDia = acum[atId].dias.find(d => d.data === data);\n        if (!jaTemDia) acum[atId].dias.push({ data, qtd: 0 });\n      });\n    }\n  });\n\n  const ativsComDado = state.atividades.filter(a => acum[a.id]);\n  document.getElementById('resumoStatAtivs').textContent = ativsComDado.length;\n\n  // Calcular m\u00e9dia de efetivo/dia\n  let somaEfetivo = 0, diasComEfetivo = 0;\n  diasPeriodo.forEach(data => {\n    const day = history[data];\n    if (!day.efetivo) return;\n    const n = Object.keys(day.efetivo).length;\n    if (n > 0) { somaEfetivo += n; diasComEfetivo++; }\n  });\n  document.getElementById('resumoStatEfetivo').textContent =\n    diasComEfetivo > 0 ? Math.round(somaEfetivo / diasComEfetivo) : '\u2014';\n\n  // Renderizar lista de atividades\n  const listAtiv = document.getElementById('resumoAtivList');\n  listAtiv.innerHTML = '';\n  if (ativsComDado.length === 0) {\n    listAtiv.innerHTML = '\u003cdiv class=\"resumo-vazio\">Nenhum servi\u00e7o registrado no per\u00edodo.\u003cbr>Preencha a quantidade das atividades na aba Di\u00e1rio.\u003c/div>';\n  } else {\n    const maxTotal = Math.max(...ativsComDado.map(a => acum[a.id].total || 1));\n    ativsComDado.forEach(a => {\n      const dado = acum[a.id];\n      const pct = dado.total > 0 ? Math.round((dado.total / maxTotal) * 100) : 0;\n      const unid = a.unidade || '';\n      const totalFmt = dado.total > 0\n        ? dado.total.toLocaleString('pt-BR', { maximumFractionDigits: 2 }) + (unid ? ' ' + unid : '')\n        : '\u2014';\n\n      const el = document.createElement('div');\n      el.className = 'resumo-ativ-item';\n\n      // header\n      const hdr = document.createElement('div');\n      hdr.className = 'resumo-ativ-header';\n      const nome = document.createElement('div');\n      nome.className = 'resumo-ativ-nome';\n      nome.textContent = a.desc;\n      if (a.local) {\n        const loc = document.createElement('div');\n        loc.className = 'resumo-ativ-unid';\n        loc.textContent = '\ud83d\udccd ' + a.local;\n        nome.appendChild(loc);\n      }\n      const totalDiv = document.createElement('div');\n      totalDiv.style.textAlign = 'right';\n      const totalNum = document.createElement('div');\n      totalNum.className = 'resumo-ativ-total';\n      totalNum.textContent = dado.total > 0 ? dado.total.toLocaleString('pt-BR', { maximumFractionDigits: 2 }) : '\u2014';\n      totalDiv.appendChild(totalNum);\n      if (unid) {\n        const unidDiv = document.createElement('div');\n        unidDiv.className = 'resumo-ativ-unid';\n        unidDiv.textContent = unid;\n        totalDiv.appendChild(unidDiv);\n      }\n      hdr.appendChild(nome);\n      hdr.appendChild(totalDiv);\n      el.appendChild(hdr);\n\n      // barra de progresso\n      if (dado.total > 0) {\n        const barWrap = document.createElement('div');\n        barWrap.className = 'resumo-bar-wrap';\n        const bar = document.createElement('div');\n        bar.className = 'resumo-bar';\n        bar.style.width = pct + '%';\n        barWrap.appendChild(bar);\n        el.appendChild(barWrap);\n      }\n\n      // chips por dia\n      if (dado.dias.length > 0) {\n        const det = document.createElement('div');\n        det.className = 'resumo-ativ-detalhe';\n        dado.dias.filter(d => d.qtd > 0).forEach(d => {\n          const chip = document.createElement('span');\n          chip.className = 'resumo-dia-chip';\n          const dataBR = formatDateBR(d.data);\n          chip.textContent = dataBR.slice(0, 5) + ': ' + d.qtd.toLocaleString('pt-BR', { maximumFractionDigits: 2 }) + (unid ? ' ' + unid : '');\n          det.appendChild(chip);\n        });\n        if (det.children.length > 0) el.appendChild(det);\n      }\n\n      listAtiv.appendChild(el);\n    });\n  }\n\n  // Renderizar efetivo por categoria\n  const listEf = document.getElementById('resumoEfetivoList');\n  listEf.innerHTML = '';\n  if (diasPeriodo.length === 0) {\n    listEf.innerHTML = '\u003cdiv class=\"resumo-vazio\">Sem dados no per\u00edodo.\u003c/div>';\n  } else {\n    // Contar presen\u00e7a por colaborador\n    const presencas = {}; // colabId -> count\n    diasPeriodo.forEach(data => {\n      const day = history[data];\n      if (!day.efetivo) return;\n      Object.keys(day.efetivo).forEach(id => {\n        presencas[id] = (presencas[id] || 0) + 1;\n      });\n    });\n\n    state.colaboradores.categorias.forEach(cat => {\n      const membros = cat.itens.filter(c => presencas[c.id]);\n      if (!membros.length) return;\n      const totalDias = membros.reduce((s, c) => s + presencas[c.id], 0);\n      const el = document.createElement('div');\n      el.className = 'resumo-efetivo-bloco';\n      const titulo = document.createElement('div');\n      titulo.className = 'resumo-efetivo-titulo';\n      titulo.textContent = (cat.icon || '') + ' ' + cat.nome + ' \u2014 ' + membros.length + ' pessoas';\n      const media = document.createElement('div');\n      media.style.fontSize = '12px';\n      media.style.color = 'var(--ink-soft)';\n      media.style.marginBottom = '6px';\n      media.textContent = 'Total de presen\u00e7as: ' + totalDias + ' (m\u00e9dia ' + (totalDias / diasPeriodo.length).toFixed(1) + '/dia)';\n      el.appendChild(titulo);\n      el.appendChild(media);\n      membros.forEach(c => {\n        const linha = document.createElement('div');\n        linha.style.cssText = 'font-size:12px;color:var(--ink-soft);padding:2px 0;display:flex;justify-content:space-between';\n        linha.innerHTML = `\u003cspan>\u003cspan class=\"mat\">${escapeHtml(c.mat)}\u003c/span> ${escapeHtml(c.nome)}\u003c/span>\u003cspan style=\"color:var(--ink-faint)\">${presencas[c.id]}d\u003c/span>`;\n        el.appendChild(linha);\n      });\n      listEf.appendChild(el);\n    });\n    if (!listEf.children.length) {\n      listEf.innerHTML = '\u003cdiv class=\"resumo-vazio\">Nenhum efetivo registrado no per\u00edodo.\u003c/div>';\n    }\n  }\n}\n\nfunction buildResumoTexto() {\n  const { inicio, fim, isoInicio, isoFim } = getResumoDatas();\n  const meses = ['janeiro','fevereiro','mar\u00e7o','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];\n  const periodoLabel = resumoPeriodo === 'semana'\n    ? `Semana ${formatDateBR(isoInicio)} a ${formatDateBR(isoFim)}`\n    : `${meses[inicio.getMonth()]} de ${inicio.getFullYear()}`;\n  const divisor = '\u2e3b\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014';\n  const diasPeriodo = Object.keys(history).filter(d => d >= isoInicio && d \u003c= isoFim).sort();\n\n  let txt = '';\n  if (state.obra.empresa) txt += `*${state.obra.empresa.toUpperCase()}*\n`;\n  txt += `*\ud83d\udcca Resumo de Servi\u00e7os \u2014 ${periodoLabel}*\n`;\n  if (state.obra.nome) txt += `_${state.obra.nome}_\n`;\n  if (state.obra.local) txt += `\ud83d\udccd ${state.obra.local}\n`;\n  txt += `\n${divisor}\n\n`;\n  txt += `*Dias com registro: ${diasPeriodo.length}*\n\n`;\n\n  // Atividades\n  const acum = {};\n  diasPeriodo.forEach(data => {\n    const day = history[data];\n    if (!day.atividadesQtd) return;\n    Object.keys(day.atividadesQtd).forEach(atId => {\n      const val = parseFloat(day.atividadesQtd[atId]);\n      if (!isNaN(val) && val > 0) acum[atId] = (acum[atId] || 0) + val;\n    });\n  });\n\n  const ativsComDado = state.atividades.filter(a => acum[a.id]);\n  if (ativsComDado.length > 0) {\n    txt += `*\ud83d\udee0\ufe0f Servi\u00e7os Executados*\n`;\n    ativsComDado.forEach(a => {\n      const unid = a.unidade ? ' ' + a.unidade : '';\n      txt += `\u2022 ${a.desc}: *${acum[a.id].toLocaleString('pt-BR', { maximumFractionDigits: 2 })}${unid}*\n`;\n    });\n    txt += `\n${divisor}\n\n`;\n  }\n\n  // Efetivo\n  const presencas = {};\n  diasPeriodo.forEach(data => {\n    const day = history[data];\n    if (!day.efetivo) return;\n    Object.keys(day.efetivo).forEach(id => { presencas[id] = (presencas[id] || 0) + 1; });\n  });\n  const totalPresencas = Object.values(presencas).reduce((s, v) => s + v, 0);\n  if (totalPresencas > 0) {\n    txt += `*\ud83d\udc77 Efetivo do Per\u00edodo*\n`;\n    txt += `\u2022 Total de presen\u00e7as: ${totalPresencas}\n`;\n    if (diasPeriodo.length > 0) txt += `\u2022 M\u00e9dia di\u00e1ria: ${(totalPresencas / diasPeriodo.length).toFixed(1)} colaboradores\n`;\n    state.colaboradores.categorias.forEach(cat => {\n      const membros = cat.itens.filter(c => presencas[c.id]);\n      if (!membros.length) return;\n      txt += `\n*${cat.icon || ''} ${cat.nome}* \u2014 ${membros.length} pessoas\n`;\n      membros.forEach(c => txt += `  \u00b7 ${c.mat} ${c.nome} (${presencas[c.id]}d)\n`);\n    });\n    txt += `\n${divisor}\n\n`;\n  }\n\n  txt += `_Gerado em: ${new Date().toLocaleString('pt-BR')}_`;\n  return txt;\n}\n\nfunction copiarResumo() {\n  copiarTexto(buildResumoTexto());\n}\nfunction enviarResumoWhatsAppPeriodo() {\n  abrirWhatsApp(buildResumoTexto());\n}\n\nfunction gerarAcumulado(periodo) {\n  const hoje = new Date();\n  let inicio, fim;\n  if (periodo === 'semana') {\n    // Segunda a domingo da semana atual\n    const dow = hoje.getDay(); // 0=dom\n    const diffSeg = (dow === 0) ? -6 : 1 - dow;\n    inicio = new Date(hoje); inicio.setDate(hoje.getDate() + diffSeg);\n    fim = new Date(inicio); fim.setDate(inicio.getDate() + 6);\n  } else {\n    inicio = new Date(hoje.getFullYear(), hoje.getMonth(), 1);\n    fim = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0);\n  }\n  const isoInicio = inicio.toISOString().slice(0,10);\n  const isoFim = fim.toISOString().slice(0,10);\n  \n  // Acumular quantidades por atividade\n  const acum = {}; // atId -> total\n  Object.keys(history).forEach(data => {\n    if (data \u003c isoInicio || data > isoFim) return;\n    const day = history[data];\n    if (!day.atividadesQtd) return;\n    Object.keys(day.atividadesQtd).forEach(atId => {\n      const val = parseFloat(day.atividadesQtd[atId]);\n      if (!isNaN(val)) acum[atId] = (acum[atId] || 0) + val;\n    });\n  });\n  \n  const periodoLabel = periodo === 'semana'\n    ? `Semana ${formatDateBR(isoInicio)} a ${formatDateBR(isoFim)}`\n    : `M\u00eas de ${inicio.toLocaleDateString('pt-BR', {month:'long', year:'numeric'})}`;\n  \n  const divisor = '\u2e3b\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014';\n  let txt = `*\ud83d\udcca Acumulado de Servi\u00e7os \u2014 ${periodoLabel}*\n`;\n  if (state.obra.nome) txt += `_${state.obra.nome}_\n`;\n  txt += `\n${divisor}\n\n`;\n  \n  const ativsComDado = state.atividades.filter(a => acum[a.id]);\n  if (ativsComDado.length === 0) {\n    txt += '\u2022 Nenhum servi\u00e7o com quantidade registrada no per\u00edodo.\\n';\n  } else {\n    ativsComDado.forEach(a => {\n      const total = acum[a.id];\n      const unid = a.unidade ? ' ' + a.unidade : '';\n      txt += `\u2022 ${a.desc}: *${total.toLocaleString('pt-BR')}${unid}*\n`;\n      if (a.local) txt += `  \ud83d\udccd ${a.local}\n`;\n    });\n  }\n  txt += `\n${divisor}\n`;\n  txt += `\n_Gerado em: ${new Date().toLocaleString('pt-BR')}_`;\n  \n  const box = document.getElementById('outputAcumulado');\n  box.textContent = txt;\n  box.style.display = 'block';\n  document.getElementById('btnAcumuladoAcoes').style.display = 'block';\n}\nfunction copiarAcumulado() {\n  const txt = document.getElementById('outputAcumulado').textContent;\n  if (txt) copiarTexto(txt);\n}\nfunction enviarAcumuladoWhatsApp() {\n  const txt = document.getElementById('outputAcumulado').textContent;\n  if (txt) abrirWhatsApp(txt);\n}\n\nfunction gerarRelatorio() {\n  const txt = buildRelatorio(currentDay);\n  document.getElementById('output').textContent = txt;\n  // Backup autom\u00e1tico silencioso a cada gera\u00e7\u00e3o de relat\u00f3rio\n  backupAutomatico();\n  return txt;\n}\nfunction copiarRelatorio() { copiarTexto(gerarRelatorio()); }\nfunction enviarWhatsApp() { abrirWhatsApp(gerarRelatorio()); }\nfunction copiarTexto(txt) {\n  if (navigator.clipboard) {\n    navigator.clipboard.writeText(txt).then(() => toast('Texto copiado!')).catch(() => fallbackCopy(txt));\n  } else fallbackCopy(txt);\n}\nfunction fallbackCopy(txt) {\n  const ta = document.createElement('textarea');\n  ta.value = txt;\n  document.body.appendChild(ta);\n  ta.select();\n  try { document.execCommand('copy'); toast('Texto copiado!'); } catch(e) { toast('Copie manualmente'); }\n  document.body.removeChild(ta);\n}\nfunction abrirWhatsApp(txt) {\n  window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`, '_blank');\n}\nfunction limparDiarioAtual() {\n  confirmar('Limpar todos os dados do di\u00e1rio de hoje?', () => {\n    const data = currentDay.data;\n    currentDay = EMPTY_DAY();\n    currentDay.data = data;\n    currentDay.encerramento = jornadaPadraoPorDia(data);\n    if (history[data]) { delete history[data]; saveHistory(); }\n    preencherCampos();\n    atualizarHeaderEdicao();\n    renderDiario();\n    gerarRelatorio();\n    toast('Di\u00e1rio limpo');\n  });\n}\n\n// ============================================================\n// CALEND\u00c1RIO\n// ============================================================\nfunction renderCalendario() {\n  if (!cal.year) {\n    const t = new Date();\n    cal.year = t.getFullYear();\n    cal.month = t.getMonth();\n  }\n  const meses = ['janeiro','fevereiro','mar\u00e7o','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];\n  document.getElementById('calTitle').textContent = `${meses[cal.month]} ${cal.year}`;\n  const grid = document.getElementById('calGrid');\n  grid.innerHTML = '';\n  ['D','S','T','Q','Q','S','S'].forEach(d => {\n    const h = document.createElement('div');\n    h.className = 'cal-day-head';\n    h.textContent = d;\n    grid.appendChild(h);\n  });\n  const primeiroDia = new Date(cal.year, cal.month, 1).getDay();\n  const ultimoDiaMes = new Date(cal.year, cal.month + 1, 0).getDate();\n  const hoje = todayISO();\n  for (let i = 0; i \u003c primeiroDia; i++) {\n    const e = document.createElement('div');\n    e.className = 'cal-day empty';\n    grid.appendChild(e);\n  }\n  for (let d = 1; d \u003c= ultimoDiaMes; d++) {\n    const iso = `${cal.year}-${String(cal.month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;\n    const dow = new Date(cal.year, cal.month, d).getDay();\n    const div = document.createElement('div');\n    div.className = 'cal-day';\n    if (dow === 0 || dow === 6) div.classList.add('weekend');\n    if (history[iso]) div.classList.add('has-data');\n    if (iso === hoje) div.classList.add('today');\n    div.innerHTML = `${d}${history[iso] ? '\u003cdiv class=\"cal-day-dot\">\u003c/div>' : ''}`;\n    div.onclick = () => abrirResumoData(iso);\n    grid.appendChild(div);\n  }\n}\nfunction navegarMes(delta) {\n  cal.month += delta;\n  if (cal.month \u003c 0) { cal.month = 11; cal.year--; }\n  if (cal.month > 11) { cal.month = 0; cal.year++; }\n  renderCalendario();\n}\nfunction abrirResumoData(iso) {\n  activeResumoData = iso;\n  document.getElementById('modalResumoTitle').textContent = `\ud83d\udcc5 ${DIAS_SEMANA_CURTO[parseISO(iso).getDay()]} \u00b7 ${formatDateBR(iso)}`;\n  if (history[iso]) {\n    document.getElementById('modalResumoTexto').textContent = buildRelatorio(history[iso]);\n  } else {\n    document.getElementById('modalResumoTexto').textContent = \n      'Nenhum di\u00e1rio registrado.\\n\\nToque em \"Editar este Di\u00e1rio\" para criar.';\n  }\n  abrirModal('modalResumo');\n}\nfunction editarDiarioPassado() {\n  if (!activeResumoData) return;\n  salvarDiarioDia(false);\n  fecharModal('modalResumo');\n  initCurrentDay(activeResumoData);\n  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));\n  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));\n  document.querySelector('[data-view=\"diario\"]').classList.add('active');\n  document.getElementById('view-diario').classList.add('active');\n  window.scrollTo({top:0, behavior:'smooth'});\n  toast('Editando ' + formatDateBR(activeResumoData));\n}\nfunction copiarResumoModal() {\n  if (!activeResumoData || !history[activeResumoData]) { toast('Nada para copiar'); return; }\n  copiarTexto(buildRelatorio(history[activeResumoData]));\n}\nfunction enviarResumoWhatsApp() {\n  if (!activeResumoData || !history[activeResumoData]) { toast('Nada para enviar'); return; }\n  abrirWhatsApp(buildRelatorio(history[activeResumoData]));\n}\nfunction excluirDiarioPassado() {\n  if (!activeResumoData || !history[activeResumoData]) return;\n  confirmar(`Excluir o di\u00e1rio de ${formatDateBR(activeResumoData)}?`, () => {\n    delete history[activeResumoData];\n    saveHistory();\n    fecharModal('modalResumo');\n    renderCalendario();\n    toast('Exclu\u00eddo');\n  });\n}\n\n// ============================================================\n// BACKUP\n// ============================================================\n// Chave do backup autom\u00e1tico no localStorage\nconst AUTOBACKUP_KEY = 'ger_diario_autobackup';\nconst AUTOBACKUP_META_KEY = 'ger_diario_autobackup_meta';\n\n// Backup autom\u00e1tico \u2014 silencioso, salva no localStorage sem download\nfunction backupAutomatico() {\n  try {\n    const payload = JSON.stringify({\n      state,\n      history,\n      exportado: new Date().toISOString(),\n      versao: 'v3',\n      tipo: 'auto'\n    });\n    window.__storage.setItem(AUTOBACKUP_KEY, payload);\n    window.__storage.setItem(AUTOBACKUP_META_KEY, JSON.stringify({\n      data: new Date().toISOString(),\n      diarios: Object.keys(history).length\n    }));\n    atualizarInfoAutoBackup();\n  } catch(e) {\n    // localStorage cheio ou bloqueado \u2014 tenta download como fallback\n    exportarBackup(true);\n  }\n}\n\n// Backup manual \u2014 gera download do arquivo .json\nfunction exportarBackup(silencioso) {\n  const data = { state, history, exportado: new Date().toISOString(), versao: 'v3', tipo: 'manual' };\n  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });\n  const url = URL.createObjectURL(blob);\n  const a = document.createElement('a');\n  a.href = url;\n  a.download = `diario-obras-${(state.obra.nome || 'backup').replace(/[^a-z0-9]/gi,'-').toLowerCase()}-${todayISO()}.json`;\n  a.click();\n  URL.revokeObjectURL(url);\n  if (!silencioso) toast('Backup exportado \u2713');\n}\n\n// Restaurar backup autom\u00e1tico\nfunction restaurarAutoBackup() {\n  const raw = window.__storage.getItem(AUTOBACKUP_KEY);\n  if (!raw) { toast('Nenhum backup autom\u00e1tico encontrado'); return; }\n  confirmar('Restaurar o backup autom\u00e1tico? Os dados atuais ser\u00e3o substitu\u00eddos.', () => {\n    try {\n      const data = JSON.parse(raw);\n      if (data.state) state = mergeDefaults(data.state);\n      if (data.history) history = data.history;\n      saveState(); saveHistory();\n      initCurrentDay(todayISO());\n      atualizarHeader();\n      renderConfig();\n      renderCalendario();\n      toast('Backup autom\u00e1tico restaurado \u2713');\n    } catch(e) { toast('Erro ao restaurar backup'); }\n  }, '\u267b\ufe0f Restaurar Backup Auto');\n}\n\n// Atualiza o card de status do backup autom\u00e1tico\nfunction atualizarInfoAutoBackup() {\n  const el = document.getElementById('autoBackupInfo');\n  if (!el) return;\n  const meta = window.__storage.getItem(AUTOBACKUP_META_KEY);\n  if (!meta) {\n    el.innerHTML = '\u003cspan style=\"color:var(--ink-faint)\">Nenhum backup autom\u00e1tico ainda.\u003c/span>';\n    return;\n  }\n  try {\n    const m = JSON.parse(meta);\n    const dt = new Date(m.data);\n    const dtBR = dt.toLocaleString('pt-BR');\n    el.innerHTML = `\n      \u003cdiv style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap\">\n        \u003cspan style=\"font-size:20px\">\u2705\u003c/span>\n        \u003cdiv>\n          \u003cdiv style=\"font-size:13px;font-weight:700;color:var(--ink)\">Backup autom\u00e1tico salvo\u003c/div>\n          \u003cdiv style=\"font-size:11px;color:var(--ink-faint)\">${dtBR} \u00b7 ${m.diarios} di\u00e1rio(s)\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    `;\n  } catch(e) {}\n}\nfunction importarBackup(ev) {\n  const file = ev.target.files[0];\n  if (!file) return;\n  if (!confirm('Substituir dados atuais pelo backup?')) return;\n  const reader = new FileReader();\n  reader.onload = e => {\n    try {\n      const data = JSON.parse(e.target.result);\n      if (data.state) state = mergeDefaults(data.state);\n      if (data.history) history = data.history;\n      saveState(); saveHistory();\n      initCurrentDay(todayISO());\n      atualizarHeader();\n      renderConfig();\n      renderCalendario();\n      toast('Backup importado');\n    } catch(err) { toast('Arquivo inv\u00e1lido'); }\n  };\n  reader.readAsText(file);\n}\nfunction resetarApp() {\n  if (!confirm('ATEN\u00c7\u00c3O: apaga TODO o cadastro e hist\u00f3rico. Continuar?')) return;\n  if (!confirm('Tem CERTEZA? Esta a\u00e7\u00e3o \u00e9 irrevers\u00edvel.')) return;\n  window.__storage.removeItem(STORAGE_KEY);\n  window.__storage.removeItem(HISTORY_KEY);\n  state = JSON.parse(JSON.stringify(DEFAULT_DATA));\n  history = {};\n  initCurrentDay(todayISO());\n  atualizarHeader();\n  renderConfig();\n  renderCalendario();\n  toast('App restaurado');\n}\n\n// ============================================================\n// INIT\n// ============================================================\nwindow.addEventListener('DOMContentLoaded', () => {\n  atualizarHeader();\n  initCurrentDay(todayISO());\n  const t = new Date();\n  cal.year = t.getFullYear();\n  cal.month = t.getMonth();\n  atualizarInfoAutoBackup();\n  setInterval(() => salvarDiarioDia(false), 5000);\n});\n\u003c/script>\n\u003cscript>// Campos e servi\u00e7os do contrato v5 que complementam as telas dispon\u00edveis do Di\u00e1rio.\nconst gerExtraKeys=['localObra','descricaoLocal','observacoes','apontador','rdoNum'];\nconst originalFill=preencherCampos;\npreencherCampos=function(){originalFill();gerFillExtra();};\nconst originalSave=salvarDiarioDia;\nsalvarDiarioDia=function(notifySave){originalSave(false);if(currentDay&&gerExtraKeys.some(k=>currentDay[k])||currentDay?.fotos?.length){history[currentDay.data]=JSON.parse(JSON.stringify(currentDay));saveHistory();}if(notifySave){toast('Di\u00e1rio salvo no hist\u00f3rico');backupAutomatico();}};\nconst originalBuildReport=buildRelatorio;\nbuildRelatorio=function(day){return originalBuildReport(day)+['',day.rdoNum?'RDO N\u00ba: '+day.rdoNum:'',day.localObra?'Local da obra: '+day.localObra:'',day.descricaoLocal?'Descri\u00e7\u00e3o do local: '+day.descricaoLocal:'',day.observacoes?'Observa\u00e7\u00f5es do dia: '+day.observacoes:'',day.apontador?'Apontador: '+day.apontador:'',day.fotos?.length?'Fotos: '+day.fotos.length+' anexo(s)':''].filter(Boolean).join('\\n');};\nfunction gerFillExtra(){if(!currentDay)return;gerExtraKeys.forEach(k=>{const el=document.getElementById('ger-'+k);if(el)el.value=currentDay[k]||'';});gerRenderPhotos();}\nfunction gerRenderPhotos(){const el=document.getElementById('ger-photo-list');if(!el||!currentDay)return;el.innerHTML=(currentDay.fotos||[]).map((p,i)=>`\u003cdiv class=\"ger-photo\">\u003cimg src=\"${escapeHtml(p.dataUrl)}\" alt=\"${escapeHtml(p.name)}\">\u003cp>${escapeHtml(p.name)}\u003c/p>\u003cbutton type=\"button\" class=\"btn btn-ghost\" data-remove-photo=\"${i}\">Remover\u003c/button>\u003c/div>`).join('');el.querySelectorAll('[data-remove-photo]').forEach(b=>b.onclick=()=>{if(!confirm('Remover esta foto do di\u00e1rio?'))return;currentDay.fotos.splice(Number(b.dataset.removePhoto),1);salvarDiarioDia(false);gerRenderPhotos();});}\nasync function gerPhotos(files){\n  currentDay.fotos=currentDay.fotos||[];\n  let salvas=0,falhas=0;\n  for(const f of files){\n    if(!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>5*1024*1024){\n      falhas++;toast(`\"${f.name}\": use JPG, PNG ou WebP de at\u00e9 5 MB.`);continue;\n    }\n    let dataUrl;\n    try{\n      dataUrl=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f);});\n    }catch(e){falhas++;toast(`Falha ao ler \"${f.name}\".`);continue;}\n\n    const foto={id:uid('foto'),name:f.name,mime:f.type,dataUrl};\n    currentDay.fotos.push(foto);\n    try{\n      salvarDiarioDia(false);\n      salvas++;\n    }catch(e){\n      // Sem espa\u00e7o no navegador (ou outra falha de grava\u00e7\u00e3o): descarta\n      // s\u00f3 esta foto em mem\u00f3ria para n\u00e3o deixar um anexo \"fantasma\"\n      // que parece salvo mas n\u00e3o persistiu.\n      currentDay.fotos.pop();\n      falhas++;\n      const semEspaco=e && (e.name==='QuotaExceededError'||/quota/i.test(e.message||''));\n      toast(semEspaco\n        ? `Sem espa\u00e7o no navegador para \"${f.name}\". Remova fotos antigas deste di\u00e1rio ou envie para a nuvem antes de continuar.`\n        : `N\u00e3o foi poss\u00edvel salvar \"${f.name}\": ${e.message||'erro desconhecido'}.`);\n      if(semEspaco) break; // n\u00e3o adianta tentar as pr\u00f3ximas se a cota j\u00e1 estourou\n    }\n  }\n  gerRenderPhotos();\n  if(salvas&&!falhas)toast(`${salvas} foto(s) salva(s) neste navegador.`);\n  else if(salvas)toast(`${salvas} foto(s) salva(s), ${falhas} n\u00e3o salva(s) \u2014 veja os avisos acima.`);\n}\nfunction gerBuildPayload(day=currentDay){\n  const cat=state.colaboradores.categorias.flatMap(c=>c.itens),present=cat.filter(c=>day.efetivo[c.id]);\n  const by={};present.forEach(c=>by[c.funcao]=(by[c.funcao]||0)+1);\n  const atividadesTexto=state.atividades.filter(a=>day.atividadesMarcadas[a.id]).map(a=>`${a.desc} | ${a.local} | ${day.atividadesQtd?.[a.id]||''} ${a.unidade}`)\n    .concat((day.atividadesAvulsas||[]).map(a=>a.desc||JSON.stringify(a)),day.atividadesExtra||'')\n    .concat((day.atividadesParalisadas||[]).length?['PARALISADAS: '+day.atividadesParalisadas.map(p=>`${p.desc} \u2014 ${p.just||'sem justificativa'}`).join('; ')]:[])\n    .join('\\n');\n  // Campo 19 do contrato: equipamentos e ve\u00edculos leves cadastrados sem uso hoje, com justificativa.\n  const parados=day.veiculosParados||{};\n  const equipsParados=state.equipamentos.filter(e=>!day.equipamentos?.[e.id]);\n  const vlParados=(state.veiculosFrota||[]).filter(v=>!(day.veiculosLeves||[]).some(x=>x.frotaId===v.id));\n  const veiculosParadosTexto=[\n    ...equipsParados.map(e=>`${e.numero?e.numero+' \u2014 ':''}${e.desc}${parados[e.id]?': '+parados[e.id]:''}`),\n    ...vlParados.map(v=>`${v.desc}${v.placa?' ('+v.placa+')':''}${parados[v.id]?': '+parados[v.id]:''}`)\n  ].join('\\n');\n  return {id:'diario-'+day.data,data:day.data,diaSemana:diaDaSemana(day.data),obra:state.obra.nome,empresa:state.obra.empresa,local:state.obra.local,localObra:day.localObra||'',descricaoLocal:day.descricaoLocal||'',tempo:tempoLabel(day.tempo,day.tempoVento),jornada:`Caf\u00e9 ${day.cafeInicio}\u2013${day.cafeFim}; almo\u00e7o ${day.almocoInicio}\u2013${day.almocoFim}; encerramento ${day.encerramento}`,dssHorario:day.dssHorario,dssMinistrou:day.dssMinistrou,dssTema:day.dssTema,atividades:atividadesTexto,efetivoTotal:present.length,efetivoPorFuncao:JSON.stringify(by),colaboradoresPresentes:present.map(c=>`${c.mat} \u00b7 ${c.nome} \u00b7 ${c.funcao}`).join('\\n'),equipamentos:JSON.stringify(day.equipamentos||{}),veiculosLeves:JSON.stringify(day.veiculosLeves||[]),veiculosParados:veiculosParadosTexto,eventosSeguranca:JSON.stringify(day.eventosSeguranca||[]),eventosMeioAmbiente:JSON.stringify(day.eventosAmbiente||[]),observacoes:day.observacoes||'',apontador:day.apontador||'',fotos:(day.fotos||[]).filter(p=>p.url).map(p=>p.url).join('\\n'),rdoNum:day.rdoNum||'',registroCompleto:JSON.parse(JSON.stringify(day))};\n}\nasync function gerAction(button,fn){button.disabled=true;try{const result=await fn();toast(result||'Opera\u00e7\u00e3o conclu\u00edda.');}catch(e){toast(e.message||'Falha na opera\u00e7\u00e3o.');}finally{button.disabled=false;}}\nwindow.addEventListener('DOMContentLoaded',()=>{\n state.obra={...state.obra,...parent.GerenciamentoModules.getWork(__obraId)};atualizarHeader();\n const section=document.createElement('section');section.className='section';section.innerHTML=`\u003cdiv class=\"section-title\">\u003cdiv class=\"section-title-text\">Identifica\u00e7\u00e3o, observa\u00e7\u00f5es e fotos\u003c/div>\u003c/div>\u003cdiv class=\"ger-grid\">${[['localObra','Local da obra'],['descricaoLocal','Descri\u00e7\u00e3o do local'],['apontador','Apontador'],['rdoNum','RDO N\u00ba']].map(([key,label])=>`\u003clabel>${label}\u003cinput id=\"ger-${key}\" maxlength=\"500\">\u003c/label>`).join('')}\u003c/div>\u003clabel>Observa\u00e7\u00f5es do dia\u003ctextarea id=\"ger-observacoes\">\u003c/textarea>\u003c/label>\u003clabel>Fotos do di\u00e1rio\u003cinput type=\"file\" id=\"ger-fotos\" accept=\"image/jpeg,image/png,image/webp\" multiple>\u003c/label>\u003cdiv id=\"ger-photo-list\" class=\"ger-photos\">\u003c/div>`;\n const save=document.querySelector('[onclick=\"salvarDiarioDia(true)\"]');save.before(section);gerExtraKeys.forEach(k=>document.getElementById('ger-'+k).oninput=e=>{currentDay[k]=e.target.value;salvarDiarioDia(false);});document.getElementById('ger-fotos').onchange=e=>gerPhotos(e.target.files);gerFillExtra();\n const services=document.createElement('section');services.className='section';services.innerHTML=`\u003cdiv class=\"section-title\">\u003cdiv class=\"section-title-text\">Planilha, arquivos e consulta aos dados\u003c/div>\u003c/div>\u003cp class=\"ger-local\">Usa somente o servi\u00e7o pr\u00f3prio configurado em Conex\u00f5es. As fotos continuam dispon\u00edveis localmente.\u003c/p>\u003cdiv class=\"ger-actions\">\u003cbutton class=\"btn btn-primary\" id=\"ger-cloud-save\">Salvar di\u00e1rio na planilha\u003c/button>\u003cbutton class=\"btn btn-secondary\" id=\"ger-cloud-photos\">Enviar fotos para a nuvem\u003c/button>\u003cbutton class=\"btn btn-secondary\" id=\"ger-cloud-backup\">Backup na nuvem\u003c/button>\u003cbutton class=\"btn btn-secondary\" id=\"ger-cloud-restore\">Buscar \u00faltimo backup\u003c/button>\u003c/div>\u003clabel>M\u00eas para consulta \u003cinput id=\"ger-query-month\" type=\"month\" value=\"${todayISO().slice(0,7)}\">\u003c/label>\u003cbutton class=\"btn btn-secondary\" id=\"ger-cloud-month\">Consultar di\u00e1rios do m\u00eas\u003c/button>\u003cpre id=\"ger-cloud-result\" style=\"white-space:pre-wrap;overflow-wrap:anywhere\">\u003c/pre>\u003clabel>Pergunta sobre os registros da obra\u003ctextarea id=\"ger-question\" placeholder=\"Digite sua pergunta\">\u003c/textarea>\u003c/label>\u003cbutton class=\"btn btn-primary\" id=\"ger-ask\">Consultar IA\u003c/button>\u003cp id=\"ger-answer\" style=\"white-space:pre-wrap\">\u003c/p>`;\n document.getElementById('view-gerar').appendChild(services);\n const on=(id,fn)=>{const b=document.getElementById(id);b.onclick=()=>gerAction(b,fn);};\n on('ger-cloud-save',async()=>{salvarDiarioDia(false);await gerRequest('diario','salvar',gerBuildPayload());return 'Di\u00e1rio confirmado na planilha.';});\n on('ger-cloud-photos',async()=>{if(!currentDay.fotos?.length)throw Error('Adicione fotos primeiro.');for(const p of currentDay.fotos.filter(p=>!p.url)){const result=await gerRequest('foto','salvar',{path:'foto',obra:state.obra.nome,data:currentDay.data,base64:p.dataUrl.split(',')[1],mime:p.mime,nome:p.name});p.url=result.url;p.fileId=result.fileId;salvarDiarioDia(false);}return 'Fotos confirmadas na nuvem.';});\n on('ger-cloud-backup',async()=>{await gerRequest('backup','salvar',{path:'backup',obra:state.obra.nome,conteudo:JSON.stringify({state,history,versao:'Gerenciamento-0.2'})});return 'Backup confirmado na nuvem.';});\n on('ger-cloud-restore',async()=>{const d=await gerRequest('backup','buscar-ultimo');if(!d.conteudo)throw Error('Nenhum backup encontrado.');const backup=JSON.parse(d.conteudo);if(!backup.state||!backup.history)throw Error('Backup inv\u00e1lido.');if(!confirm('Restaurar o backup encontrado? Uma c\u00f3pia atual ser\u00e1 exportada antes.'))return 'Restaura\u00e7\u00e3o cancelada.';exportarBackup(true);state=mergeDefaults(backup.state);history=backup.history;saveState();saveHistory();initCurrentDay(todayISO());return 'Backup restaurado.';});\n on('ger-cloud-month',async()=>{const month=document.getElementById('ger-query-month').value;const d=await gerRequest('diario','lista-mes',{mes:month});document.getElementById('ger-cloud-result').textContent=JSON.stringify(d.diarios||[],null,2);return 'Consulta conclu\u00edda.';});\n on('ger-ask',async()=>{const pergunta=document.getElementById('ger-question').value.trim();if(!pergunta)throw Error('Digite uma pergunta.');const d=await gerRequest('ia','perguntar',{pergunta});document.getElementById('ger-answer').textContent=d.resposta||'Sem resposta.';return 'Consulta conclu\u00edda.';});\n});\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"};
// Módulos preservados dos arquivos fornecidos, com dados exclusivos do Gerenciamento.
const MODULE_PREFIX='gerenciamento-modulos-v2:';
const moduleKey=id=>MODULE_PREFIX+id;
function moduleBucket(id=workId){const raw=localStorage.getItem(moduleKey(id));if(raw){const b=JSON.parse(raw);if(!b||b.schema!==2)throw Error('Dados de módulos incompatíveis.');return b;}const w=state.works.find(x=>x.id===id);return {schema:2,revision:0,obra:{nome:w?.name||'',empresa:w?.company||'',local:w?.city||''},shared:{assuntos:state.tasks.filter(t=>t.obraId===id).map(taskToSource),reunioes:state.meetings.filter(m=>m.obraId===id).map(m=>({id:m.id,data:m.date,hora:m.time,assuntos:(m.snapshot||[]).map(taskToSource),participantes:m.participants||'',decisoes:m.decisions||''})),membros:[],setores:null},pauta:{},checkin:{},diario:{},connections:{service:'',webhook:''}};}
function taskToSource(t){return {id:t.id,assunto:t.title,desc:t.description||'',resp:t.owner||'',criador:t.creator||'',setor:t.sector||'',prioridade:t.priority,status:t.status,dataLanc:t.created||'',dataTerm:t.due||'',criadoEm:t.createdAt?Date.parse(t.createdAt):Date.parse((t.created||today())+'T12:00:00'),concluidoEm:t.completedAt?Date.parse(t.completedAt):undefined};}
function taskFromSource(t,id=workId){return {id:String(t.id),obraId:id,title:t.assunto||'',description:t.desc||'',owner:t.resp||'',creator:t.criador||'',sector:t.setor||'',priority:t.prioridade||'media',status:t.status,created:t.dataLanc||'',due:t.dataTerm||'',createdAt:t.criadoEm,completedAt:t.concluidoEm,history:[]};}
function persistBucket(id,b){b.revision=(b.revision||0)+1;localStorage.setItem(moduleKey(id),JSON.stringify(b));$('#saved').textContent='Salvo neste navegador';}
function sourceGet(kind,id,key){const b=moduleBucket(id);if(key.startsWith('pauta_'))key=key.slice(6);if(key.startsWith('chk_'))key=key.slice(4);let value;if(kind!=='diario'&&['assuntos','reunioes','membros','setores'].includes(key))value=b.shared[key];else if(kind==='checkin'&&key==='config')value={...(b.checkin.config||{}),obra:b.obra.nome};else if(kind==='pauta'&&key==='config')value={webhook:b.connections.webhook};else if(kind==='checkin'&&['nomesResp','nomesCriador'].includes(key))value=b.checkin[key]||b.shared.membros;else value=b[kind][key];return value===undefined||value===null?null:JSON.stringify(value);}
function sourceSet(kind,id,key,value){const b=moduleBucket(id);let k=key.replace(/^(pauta_|chk_)/,'');const data=JSON.parse(value);if(kind!=='diario'&&['assuntos','reunioes','membros','setores'].includes(k))b.shared[k]=data;else if(kind==='checkin'&&k==='config'){b.checkin.config=data;b.obra.nome=data.obra;}else if(kind==='pauta'&&k==='config'){b.connections.webhook=data.webhook||'';}else{b[kind][key]=data;if(kind==='diario'&&key==='ger_diario_state'&&data?.obra)b.obra={...b.obra,...data.obra};if(kind==='checkin')b.checkin[k]=data;}persistBucket(id,b);}
window.GerenciamentoModules={
 storage(kind,id){return {getItem:k=>sourceGet(kind,id,k),setItem:(k,v)=>sourceSet(kind,id,k,v),removeItem:k=>{const b=moduleBucket(id);delete b[kind][k];persistBucket(id,b);}};},
 getWork:id=>moduleBucket(id).obra,
 settings:id=>moduleBucket(id).connections,
 changed:()=>{},
 async request(id,path,action,body){const config=moduleBucket(id).connections;if(!config.service)throw Error('Configure o serviço próprio em Conexões.');const url=new URL(config.service);url.searchParams.set('path',path);url.searchParams.set('action',action);url.searchParams.set('obra_id',id);if(body===undefined){url.searchParams.set('obra',moduleBucket(id).obra.nome);}const response=await fetch(url,{method:body===undefined?'GET':'POST',...(body===undefined?{}:{headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...body,obra_id:id})}),signal:AbortSignal.timeout(25000)});if(!response.ok)throw Error('Falha no serviço ('+response.status+').');const data=await response.json();if(data.ok===false||data.error)throw Error(data.error||data.msg||'Operação não confirmada.');return data;},
 resize(win,height){const iframe=$('#module-frame');if(iframe?.contentWindow===win)iframe.style.height=Math.min(Math.max(Number(height)||650,650),50000)+'px';}
};
// Os indicadores e a pauta usam o mesmo conjunto de assuntos dos módulos.
const baseRender=render;
const baseTaskDialog=taskDialog;
const baseMeetingDialog=meetingDialog;
function moduleTasks(){return moduleBucket().shared.assuntos.map(t=>taskFromSource(t));}
function moduleMeetings(){return moduleBucket().shared.reunioes.map(m=>({id:String(m.id),obraId:workId,title:'Check-in de gestão',date:m.data,time:m.hora,participants:m.participantes||'',decisions:m.decisoes||'',type:'Diária',snapshot:(m.assuntos||[]).map(t=>taskFromSource(t))}));}
function moduleDiaryCount(){return Object.keys(moduleBucket().diario.ger_diario_history||{}).length;}
function mountModule(kind,tab,id){const frame=$('#module-frame');const html=MODULE_DOCUMENTS[kind];const wid=workId;const boot=`<script>window.__moduleKind=${JSON.stringify(kind)};window.__obraId=${JSON.stringify(wid)};window.__storage=parent.GerenciamentoModules.storage(window.__moduleKind,window.__obraId);window.__startTab=${JSON.stringify(tab||'')};window.__editId=${JSON.stringify(id||'')};<\/script>`;frame.srcdoc=html.replace('<!--GER-BOOT-->',boot);}
function moduleHeading(kind){const label={pauta:'Pauta de demandas',checkin:'Check-in de gestão',diario:'Diário de obras'}[kind];return `<div class="heading"><div><div class="eyebrow">${esc(work().name)}</div><h1>${label}</h1><p>${kind==='pauta'?'Cadastro, envio e acompanhamento dos assuntos.':kind==='checkin'?'Reunião, quadro, calendário e indicadores da pauta.':'Apontamento diário, recursos, relatórios e histórico.'}</p></div><div class="ger-host-actions">${kind==='diario'?'<button class="secondary" id="old-rdos">Rascunhos em texto</button>':''}<button class="secondary" data-goto="connections">Conexões</button></div></div><iframe id="module-frame" title="${label}" sandbox="allow-scripts allow-same-origin allow-modals allow-downloads allow-popups allow-popups-to-escape-sandbox" style="display:block;width:100%;border:0;min-height:650px;background:#f4f5f7"></iframe>`;}
function connectionsView(){const c=moduleBucket().connections;return `<div class="heading"><div><div class="eyebrow">CONFIGURAÇÃO DA OBRA</div><h1>Conexões e backups</h1><p>Configurações exclusivas de ${esc(work().name)}.</p></div></div><section class="panel" style="padding:24px"><h2>Serviços próprios</h2><p class="muted">As funções locais estão disponíveis. Planilha, fotos e backup na nuvem e consulta à IA precisam de um serviço configurado para o Gerenciamento.</p><form id="connections-form"><div class="form-grid">${field('service','URL do serviço do Gerenciamento',c.service,'url')}${field('webhook','URL do webhook n8n',c.webhook,'url')}</div><div class="ger-host-actions"><button class="primary">Salvar conexões</button></div></form><p class="footnote">Nenhum endereço de outro aplicativo foi incluído. O n8n só recebe dados quando você aciona Exportar.</p></section><section class="panel" style="padding:24px;margin-top:22px"><h2>Cópia completa do Gerenciamento</h2><p class="muted">Inclui as obras, os módulos, as configurações e os registros locais.</p><div class="ger-host-actions"><button class="secondary" id="full-export">Exportar arquivo</button><label class="secondary">Restaurar arquivo <input type="file" id="full-import" accept="application/json" style="display:block;margin-top:8px;max-width:260px"></label></div><p class="muted">Os backups próprios de Pauta e Diário continuam disponíveis nas abas de cadastro de cada módulo.</p></section>`;}
let moduleStart=null;
render=function(){if(!state)return;for(const w of state.works){const b=moduleBucket(w.id);if(b.obra.nome)w.name=b.obra.nome;}baseRender();if(['pauta','tasks','meetings','rdos'].includes(view)){const kind=view==='pauta'?'pauta':view==='rdos'?'diario':'checkin';$('#main').innerHTML=moduleHeading(kind);mountModule(kind,moduleStart?.tab,moduleStart?.id);moduleStart=null;}if(view==='connections'){$('#main').innerHTML=connectionsView();$('#connections-form').onsubmit=e=>{e.preventDefault();try{const d=Object.fromEntries(new FormData(e.target));for(const v of Object.values(d)){if(v&&new URL(v).protocol!=='https:')throw Error('Use uma URL HTTPS.');}const b=moduleBucket();b.connections=d;persistBucket(workId,b);toast('Configurações salvas.');}catch(err){toast(err.message,true);}};}if(view==='overview'){const count=moduleDiaryCount();const btn=$('[data-goto="rdos"].metric');if(btn){btn.querySelector('strong').textContent=String(count).padStart(2,'0');btn.querySelector('span').innerHTML='Diários no histórico <b>↗</b>';btn.querySelector('small').textContent='Registros do módulo Diário';}}};
names.connections='Conexões e backups';icons.connections='⇄';
taskDialog=function(id){moduleStart={tab:id?'cadastro':'cadastro',id};navTo('tasks');};
meetingDialog=function(){navTo('meetings');};
const oldRdoDialog=rdoDialog;
rdoDialog=function(id){if(id)return oldRdoDialog(id);navTo('rdos');};
function fullBackup(){const modules={};for(const w of state.works)modules[w.id]=moduleBucket(w.id);return {app:'Gerenciamento',schema:2,environment:'avaliacao-local',exportedAt:new Date().toISOString(),data:state,modules};}
function exportFull(){download('Gerenciamento-backup-'+today()+'.json',JSON.stringify(fullBackup(),null,2),'application/json');toast('Cópia completa exportada.');}
$('#export').onclick=exportFull;
document.addEventListener('click',e=>{const b=e.target.closest('button');if(b?.id==='full-export')exportFull();if(b?.id==='old-rdos'){dialog('Rascunhos em texto da primeira versão',`<p class="muted">Os registros anteriores permanecem preservados.</p>${state.rdos.filter(r=>r.obraId===workId).map(r=>`<p>${esc(r.fields.Data)} · ${esc(r.fields.Apontador)} <button type="button" class="secondary" data-raw-rdo="${esc(r.id)}">Abrir</button></p>`).join('')||'<p>Nenhum rascunho em texto.</p>'}`,null,true);}if(b?.dataset.rawRdo){$('#dialog').close();oldRdoDialog(b.dataset.rawRdo);}});
document.addEventListener('change',async e=>{if(e.target.id!=='full-import'||!e.target.files[0])return;try{const d=JSON.parse(await e.target.files[0].text());validateFullBackup(d);if(!confirm('Restaurar este arquivo completo? Será baixada uma cópia dos dados atuais antes da substituição.'))return;exportFull();const previous=fullBackup();try{for(const [id,b] of Object.entries(d.modules||{}))localStorage.setItem(moduleKey(id),JSON.stringify(b));const next=clone(d.data);await writeDB(next,state.revision);state=next;workId=state.works[0].id;render();toast('Cópia restaurada neste navegador.');}catch(err){for(const [id,b] of Object.entries(previous.modules))localStorage.setItem(moduleKey(id),JSON.stringify(b));throw err;}}catch(err){toast(err.message,true);}e.target.value='';});
function validateFullBackup(d){if(d?.app!=='Gerenciamento'||!d.data||!Array.isArray(d.data.works)||!d.data.works.length||!['tasks','rdos','meetings'].every(k=>Array.isArray(d.data[k])))throw Error('Arquivo de Gerenciamento inválido.');for(const [id,b] of Object.entries(d.modules||{})){if(!d.data.works.some(w=>w.id===id)||b?.schema!==2||!Array.isArray(b.shared?.assuntos)||!Array.isArray(b.shared?.reunioes)||!b.obra||!b.connections)throw Error('Dados de módulos inválidos.');for(const t of b.shared.assuntos)if(!(t.status in STATUS)||!t.id||typeof t.assunto!=='string')throw Error('Demanda inválida no backup.');}}
</script></body></html>
