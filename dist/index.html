 btn-whatsapp\" onclick=\"copiarAcumulado()\">\ud83d\udccb Copiar Acumulado\u003c/button>\n        \u003cbutton class=\"btn btn-secondary\" onclick=\"enviarAcumuladoWhatsApp()\">\ud83d\udcac WhatsApp Acumulado\u003c/button>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/main>\n\n\u003c!-- ============ RESUMO ============ -->\n\u003cmain id=\"view-resumo\" class=\"view\">\n\n  \u003c!-- seletor semana / m\u00eas -->\n  \u003cdiv class=\"resumo-periodo-tabs\">\n    \u003cbutton class=\"resumo-ptab active\" id=\"rtabSemana\" onclick=\"setResumoPeriodo('semana')\">\ud83d\udcc5 Semana\u003c/button>\n    \u003cbutton class=\"resumo-ptab\" id=\"rtabMes\" onclick=\"setResumoPeriodo('mes')\">\ud83d\udcc6 M\u00eas\u003c/button>\n  \u003c/div>\n\n  \u003c!-- navega\u00e7\u00e3o per\u00edodo -->\n  \u003cdiv class=\"resumo-nav-semana\">\n    \u003cbutton class=\"resumo-nav-btn\" onclick=\"navegarResumoPeriodo(-1)\">\u25c0\u003c/button>\n    \u003cdiv class=\"resumo-nav-label\" id=\"resumoNavLabel\">\u2014\u003c/div>\n    \u003cbutton class=\"resumo-nav-btn\" onclick=\"navegarResumoPeriodo(1)\">\u25b6\u003c/button>\n  \u003c/div>\n\n  \u003c!-- stats r\u00e1pidos -->\n  \u003cdiv class=\"resumo-stat-row\">\n    \u003cdiv class=\"resumo-stat\">\n      \u003cdiv class=\"resumo-stat-num\" id=\"resumoStatDias\">0\u003c/div>\n      \u003cdiv class=\"resumo-stat-label\">Dias com reg.\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"resumo-stat\">\n      \u003cdiv class=\"resumo-stat-num\" id=\"resumoStatAtivs\">0\u003c/div>\n      \u003cdiv class=\"resumo-stat-label\">Atividades\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"resumo-stat\">\n      \u003cdiv class=\"resumo-stat-num\" id=\"resumoStatEfetivo\">\u2014\u003c/div>\n      \u003cdiv class=\"resumo-stat-label\">M\u00e9d. efetivo/dia\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003c!-- atividades acumuladas -->\n  \u003cdiv class=\"section\">\n    \u003cdiv class=\"section-title\">\u003cdiv class=\"section-title-text\">\ud83d\udee0\ufe0f Servi\u00e7os Executados\u003c/div>\u003c/div>\n    \u003cdiv id=\"resumoAtivList\">\u003c/div>\n  \u003c/div>\n\n  \u003c!-- efetivo por categoria -->\n  \u003cdiv class=\"section\">\n    \u003cdiv class=\"section-title\">\u003cdiv class=\"section-title-text\">\ud83d\udc77 Efetivo do Per\u00edodo\u003c/div>\u003c/div>\n    \u003cdiv id=\"resumoEfetivoList\">\u003c/div>\n  \u003c/div>\n\n  \u003c!-- bot\u00f5es exportar -->\n  \u003cdiv class=\"section\">\n    \u003cdiv class=\"btn-stack\">\n      \u003cbutton class=\"btn btn-primary\" onclick=\"copiarResumo()\">\ud83d\udccb Copiar Resumo\u003c/button>\n      \u003cbutton class=\"btn btn-secondary\" onclick=\"enviarResumoWhatsAppPeriodo()\">\ud83d\udcac Enviar WhatsApp\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\n\u003c/main>\n\n\u003c!-- ============ CALEND\u00c1RIO ============ -->\n\u003cmain id=\"view-calendario\" class=\"view\">\n  \u003cdiv class=\"section\">\n    \u003cdiv class=\"cal-header\">\n      \u003cbutton class=\"cal-nav-btn\" onclick=\"navegarMes(-1)\">\u25c0\u003c/button>\n      \u003cdiv class=\"cal-title\" id=\"calTitle\">\u2014\u003c/div>\n      \u003cbutton class=\"cal-nav-btn\" onclick=\"navegarMes(1)\">\u25b6\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"cal-grid\" id=\"calGrid\">\u003c/div>\n    \u003cp style=\"font-size:11px;color:var(--ink-faint);margin-top:12px;text-align:center;font-style:italic\">\n      Toque numa data com marca dourada para ver/editar o di\u00e1rio.\n    \u003c/p>\n  \u003c/div>\n\u003c/main>\n\n\u003c!-- ============ CONFIG ============ -->\n\u003cmain id=\"view-config\" class=\"view\">\n  \u003cdiv class=\"subtabs\">\n    \u003cbutton class=\"subtab active\" data-pane=\"obra\">\ud83c\udfd7\ufe0f Obra\u003c/button>\n    \u003cbutton class=\"subtab\" data-pane=\"colaboradores\">\ud83d\udc77 Equipe\u003c/button>\n    \u003cbutton class=\"subtab\" data-pane=\"equipamentos\">\ud83d\ude9c Equip.\u003c/button>\n    \u003cbutton class=\"subtab\" data-pane=\"atividades\">\ud83d\udee0\ufe0f Ativ.\u003c/button>\n  \u003c/div>\n  \u003cdiv class=\"subtabs\">\n    \u003cbutton class=\"subtab\" data-pane=\"seguranca\">\ud83e\uddba Seg.\u003c/button>\n    \u003cbutton class=\"subtab\" data-pane=\"meio_ambiente\">\ud83c\udf31 M.A.\u003c/button>\n    \u003cbutton class=\"subtab\" data-pane=\"backup\">\ud83d\udcbe Backup\u003c/button>\n  \u003c/div>\n  \n  \u003c!-- OBRA / EMPRESA -->\n  \u003cdiv class=\"config-pane active\" id=\"pane-obra\">\n    \u003cdiv class=\"section\">\n      \u003cdiv class=\"section-title\">\u003cdiv class=\"section-title-text\">\ud83c\udfd7\ufe0f Identifica\u00e7\u00e3o\u003c/div>\u003c/div>\n      \u003clabel>Nome da Obra\u003c/label>\n      \u003cinput type=\"text\" id=\"cfgObra\" placeholder=\"Ex.: Obra Beira-Mar Norte\">\n      \u003clabel>Empresa\u003c/label>\n      \u003cinput type=\"text\" id=\"cfgEmpresa\" placeholder=\"Ex.: Construtora XYZ\">\n      \u003clabel>Local (opcional)\u003c/label>\n      \u003cinput type=\"text\" id=\"cfgLocal\" placeholder=\"Ex.: Florian\u00f3polis - SC\">\n      \u003clabel>Contrato / C\u00f3digo (opcional)\u003c/label>\n      \u003cinput type=\"text\" id=\"cfgContrato\" placeholder=\"Ex.: CT-2026-001\">\n    \u003c/div>\n    \u003cdiv class=\"section\">\n      \u003cdiv class=\"section-title\">\u003cdiv class=\"section-title-text\">\ud83d\uddbc\ufe0f Logo da Empresa\u003c/div>\u003c/div>\n      \u003cdiv class=\"logo-preview\">\n        \u003cdiv class=\"logo-preview-box\" id=\"logoPrev\">LOGO\u003c/div>\n        \u003cdiv class=\"logo-preview-text\">\n          Toque em \"Selecionar imagem\" para enviar o logo da empresa (PNG ou JPG). O logo aparecer\u00e1 no topo do app.\n        \u003c/div>\n      \u003c/div>\n      \u003cbutton class=\"btn btn-ghost\" style=\"margin-top:10px\" onclick=\"document.getElementById('logoInput').click()\">\n        \ud83d\udce4 Selecionar Imagem\n      \u003c/button>\n      \u003cinput type=\"file\" id=\"logoInput\" accept=\"image/*\" style=\"display:none\" onchange=\"uploadLogo(event)\">\n      \u003cbutton class=\"btn btn-ghost\" style=\"margin-top:8px;color:var(--red);border-color:var(--red)\" onclick=\"removerLogo()\">\n        \ud83d\uddd1\ufe0f Remover Logo\n      \u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"section\">\n      \u003cdiv class=\"section-title\">\u003cdiv class=\"section-title-text\">\u23f0 Jornada Padr\u00e3o\u003c/div>\u003c/div>\n      \u003cp style=\"font-size:12px;color:var(--ink-faint);margin-bottom:10px;font-style:italic\">\n        Define hor\u00e1rios automaticamente conforme o dia da semana. Sextas e s\u00e1bados: encerramento mais cedo.\n      \u003c/p>\n      \u003clabel>Encerramento padr\u00e3o (seg - qui)\u003c/label>\n      \u003cinput type=\"time\" id=\"cfgEncerramentoNormal\" value=\"17:00\">\n      \u003clabel>Encerramento sexta-feira\u003c/label>\n      \u003cinput type=\"time\" id=\"cfgEncerramentoSexta\" value=\"16:00\">\n      \u003clabel>Encerramento s\u00e1bado\u003c/label>\n      \u003cinput type=\"time\" id=\"cfgEncerramentoSabado\" value=\"16:00\">\n      \u003cbutton class=\"btn btn-primary\" style=\"margin-top:14px\" onclick=\"salvarConfigObra()\">\ud83d\udcbe Salvar Configura\u00e7\u00f5es\u003c/button>\n    \u003c/div>\n  \u003c/div>\n  \n  \u003c!-- COLABORADORES -->\n  \u003cdiv class=\"config-pane\" id=\"pane-colaboradores\">\n    \u003cdiv class=\"section\">\n      \u003cbutton class=\"add-btn-full\" onclick=\"abrirModalCategoria()\">+ Adicionar Categoria\u003c/button>\n      \u003chr class=\"divider\">\n      \u003cdiv id=\"configColabList\">\u003c/div>\n    \u003c/div>\n  \u003c/div>\n  \n  \u003c!-- EQUIPAMENTOS -->\n  \u003cdiv class=\"config-pane\" id=\"pane-equipamentos\">\n    \u003cdiv class=\"section\">\n      \u003cdiv class=\"section-title\">\u003cdiv class=\"section-title-text\">\ud83d\ude9c Equipamentos Pesados\u003c/div>\u003c/div>\n      \u003cp style=\"font-size:12px;color:var(--ink-faint);margin-bottom:10px;font-style:italic\">\n        Marque \"\u00c9 caminh\u00e3o / motorista?\" para que o app sugira da lista de Motoristas ao selecionar operador no di\u00e1rio.\n      \u003c/p>\n      \u003cbutton class=\"add-btn-full\" onclick=\"abrirModalEquipamento()\">+ Adicionar Equipamento\u003c/button>\n      \u003chr class=\"divider\">\n      \u003cdiv id=\"configEquipList\">\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"section\">\n      \u003cdiv class=\"section-title\">\u003cdiv class=\"section-title-text\">\ud83d\ude97 Ve\u00edculos Leves (Frota)\u003c/div>\u003c/div>\n      \u003cp style=\"font-size:12px;color:var(--ink-faint);margin-bottom:10px;font-style:italic\">\n        Cadastre ve\u00edculos leves da frota (pickups, vans, utilit\u00e1rios). O uso di\u00e1rio \u00e9 registrado na aba Di\u00e1rio.\n      \u003c/p>\n      \u003cbutton class=\"add-btn-full\" onclick=\"abrirModalVeiculoFrota()\">+ Adicionar Ve\u00edculo Leve\u003c/button>\n      \u003chr class=\"divider\">\n      \u003cdiv id=\"configVLList\">\u003c/div>\n    \u003c/div>\n  \u003c/div>\n  \n  \u003c!-- ATIVIDADES -->\n  \u003cdiv class=\"config-pane\" id=\"pane-atividades\">\n    \u003cdiv class=\"section\">\n      \u003cbutton class=\"add-btn-full\" onclick=\"abrirModalAtividade()\">+ Adicionar Atividade Padr\u00e3o\u003c/button>\n      \u003chr class=\"divider\">\n      \u003cdiv id=\"configAtivList\">\u003c/div>\n    \u003c/div>\n  \u003c/div>\n  \n  \u003c!-- SEGURAN\u00c7A -->\n  \u003cdiv class=\"config-pane\" id=\"pane-seguranca\">\n    \u003cdiv class=\"section\">\n      \u003cbutton class=\"add-btn-full\" onclick=\"abrirModalEventoCadastro('seguranca')\">+ Adicionar Tipo\u003c/button>\n      \u003chr class=\"divider\">\n      \u003cdiv id=\"configSegList\">\u003c/div>\n    \u003c/div>\n  \u003c/div>\n  \n  \u003c!-- MEIO AMBIENTE -->\n  \u003cdiv class=\"config-pane\" id=\"pane-meio_ambiente\">\n    \u003cdiv class=\"section\">\n      \u003cbutton class=\"add-btn-full\" onclick=\"abrirModalEventoCadastro('meio_ambiente')\">+ Adicionar Tipo\u003c/button>\n      \u003chr class=\"divider\">\n      \u003cdiv id=\"configAmbList\">\u003c/div>\n    \u003c/div>\n  \u003c/div>\n  \n  \u003c!-- BACKUP -->\n  \u003cdiv class=\"config-pane\" id=\"pane-backup\">\n\n    \u003c!-- Card backup autom\u00e1tico -->\n    \u003cdiv class=\"section\">\n      \u003cdiv class=\"section-title\">\u003cdiv class=\"section-title-text\">\ud83d\udd04 Backup Autom\u00e1tico\u003c/div>\u003c/div>\n      \u003cp style=\"font-size:12px;color:var(--ink-faint);margin-bottom:12px;line-height:1.5\">\n        Salvo automaticamente no dispositivo a cada relat\u00f3rio gerado ou di\u00e1rio salvo manualmente.\n      \u003c/p>\n      \u003cdiv id=\"autoBackupInfo\" style=\"background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;margin-bottom:12px;min-height:44px\">\n        \u003cspan style=\"color:var(--ink-faint);font-size:12px\">Nenhum backup autom\u00e1tico ainda.\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"btn-stack\">\n        \u003cbutton class=\"btn btn-primary\" onclick=\"backupAutomatico()\">\ud83d\udcbe Fazer Backup Agora\u003c/button>\n        \u003cbutton class=\"btn btn-ghost\" onclick=\"restaurarAutoBackup()\">\u267b\ufe0f Restaurar Backup Autom\u00e1tico\u003c/button>\n      \u003c/div>\n    \u003c/div>\n\n    \u003c!-- Backup manual em arquivo -->\n    \u003cdiv class=\"section\">\n      \u003cdiv class=\"section-title\">\u003cdiv class=\"section-title-text\">\ud83d\udcc1 Backup em Arquivo\u003c/div>\u003c/div>\n      \u003cp style=\"font-size:12px;color:var(--ink-faint);margin-bottom:12px;line-height:1.5\">\n        Exporta um arquivo \u003cstrong>.json\u003c/strong> para salvar no celular, e-mail ou Google Drive. Recomendado semanalmente.\n      \u003c/p>\n      \u003cdiv class=\"btn-stack\">\n        \u003cbutton class=\"btn btn-ghost\" onclick=\"exportarBackup()\">\u2b07\ufe0f Exportar Arquivo (.json)\u003c/button>\n        \u003cbutton class=\"btn btn-ghost\" onclick=\"document.getElementById('importInput').click()\">\u2b06\ufe0f Importar Arquivo\u003c/button>\n        \u003cinput type=\"file\" id=\"importInput\" accept=\".json\" style=\"display:none\" onchange=\"importarBackup(event)\">\n      \u003c/div>\n      \u003chr class=\"divider\">\n      \u003cp style=\"font-size:12px;color:var(--ink-faint);text-align:center\">\n        Hist\u00f3rico: \u003cstrong id=\"histCount\">0\u003c/strong> di\u00e1rios salvos\n      \u003c/p>\n    \u003c/div>\n\n    \u003c!-- Reset -->\n    \u003cdiv class=\"section\">\n      \u003cdiv class=\"section-title\">\u003cdiv class=\"section-title-text\" style=\"color:var(--red)\">\u26a0\ufe0f Zona de Perigo\u003c/div>\u003c/div>\n      \u003cbutton class=\"btn btn-ghost\" style=\"color:var(--red);border-color:var(--red)\" onclick=\"resetarApp()\">\ud83d\uddd1\ufe0f Restaurar Padr\u00e3o de F\u00e1brica\u003c/button>\n    \u003c/div>\n\n  \u003c/div>\n\u003c/main>\n\n\u003c!-- ============ MODAIS ============ -->\n\n\u003c!-- Categoria -->\n\u003cdiv class=\"modal-overlay\" id=\"modalCategoria\">\n  \u003cdiv class=\"modal\">\n    \u003cdiv class=\"modal-title\" id=\"modalCatTitle\">Nova Categoria\u003c/div>\n    \u003clabel>\u00cdcone (emoji)\u003c/label>\n    \u003cinput type=\"text\" id=\"modalCatIcon\" maxlength=\"2\" placeholder=\"Ex.: \ud83d\udc77\">\n    \u003clabel>Nome da Categoria\u003c/label>\n    \u003cinput type=\"text\" id=\"modalCatNome\" placeholder=\"Ex.: Engenharia / Supervis\u00e3o\">\n    \u003cdiv class=\"btn-row\" style=\"margin-top:14px\">\n      \u003cbutton class=\"btn btn-ghost\" onclick=\"fecharModal('modalCategoria')\">Cancelar\u003c/button>\n      \u003cbutton class=\"btn btn-primary\" onclick=\"salvarCategoria()\">Salvar\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- Colaborador -->\n\u003cdiv class=\"modal-overlay\" id=\"modalColab\">\n  \u003cdiv class=\"modal\">\n    \u003cdiv class=\"modal-title\" id=\"modalColabTitle\">Novo Colaborador\u003c/div>\n    \u003clabel>Matr\u00edcula\u003c/label>\n    \u003cinput type=\"text\" id=\"modalColabMat\" placeholder=\"Ex.: 241\">\n    \u003clabel>Nome\u003c/label>\n    \u003cinput type=\"text\" id=\"modalColabNome\" placeholder=\"Ex.: Nivaldo Gomes\">\n    \u003clabel>Fun\u00e7\u00e3o\u003c/label>\n    \u003cinput type=\"text\" id=\"modalColabFunc\" placeholder=\"Ex.: L\u00edder\">\n    \u003cdiv class=\"btn-row\" style=\"margin-top:14px\">\n      \u003cbutton class=\"btn btn-ghost\" onclick=\"fecharModal('modalColab')\">Cancelar\u003c/button>\n      \u003cbutton class=\"btn btn-primary\" onclick=\"salvarColaborador()\">Salvar\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- Equipamento (cadastro) -->\n\u003cdiv class=\"modal-overlay\" id=\"modalEquip\">\n  \u003cdiv class=\"modal\">\n    \u003cdiv class=\"modal-title\" id=\"modalEquipTitle\">Novo Equipamento\u003c/div>\n    \u003clabel>N\u00famero / Frota\u003c/label>\n    \u003cinput type=\"text\" id=\"modalEquipNum\" placeholder=\"Ex.: ESC-001\">\n    \u003clabel>Descri\u00e7\u00e3o\u003c/label>\n    \u003cinput type=\"text\" id=\"modalEquipDesc\" placeholder=\"Ex.: Escavadeira Hidr\u00e1ulica CAT 320\">\n    \u003cdiv class=\"tempo-vento\" style=\"margin-top:14px;background:var(--bg-card);border:1px solid var(--line)\">\n      \u003cinput type=\"checkbox\" id=\"modalEquipMotorista\">\n      \u003clabel for=\"modalEquipMotorista\">\ud83d\ude9b \u00c9 caminh\u00e3o / requer motorista?\u003c/label>\n    \u003c/div>\n    \u003cp style=\"font-size:11px;color:var(--ink-faint);margin-top:6px;font-style:italic\">\n      Marcado: lista de motoristas ser\u00e1 sugerida.\u003cbr>\n      Desmarcado: lista de operacionais ser\u00e1 sugerida.\n    \u003c/p>\n    \u003cdiv class=\"btn-row\" style=\"margin-top:14px\">\n      \u003cbutton class=\"btn btn-ghost\" onclick=\"fecharModal('modalEquip')\">Cancelar\u003c/button>\n      \u003cbutton class=\"btn btn-primary\" onclick=\"salvarEquipamento()\">Salvar\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- Status Equipamento (di\u00e1rio) - NOVO com seletor de operador -->\n\u003cdiv class=\"modal-overlay\" id=\"modalEquipStatus\">\n  \u003cdiv class=\"modal\">\n    \u003cdiv class=\"modal-title\" id=\"equipStatusName\">\u2014\u003c/div>\n    \n    \u003clabel>Operador do dia\u003c/label>\n    \u003cdiv class=\"op-tabs\" id=\"opTabs\">\n      \u003cbutton class=\"op-tab active\" data-source=\"default\">Sugerido\u003c/button>\n      \u003cbutton class=\"op-tab\" data-source=\"other\">Outras Equipes\u003c/button>\n      \u003cbutton class=\"op-tab\" data-source=\"custom\">Digitar Manual\u003c/button>\n    \u003c/div>\n    \n    \u003cinput type=\"text\" id=\"opSearch\" class=\"op-search\" placeholder=\"\ud83d\udd0d Buscar por nome ou matr\u00edcula...\" style=\"display:block\">\n    \n    \u003cdiv class=\"op-list\" id=\"opList\">\u003c/div>\n    \n    \u003cinput type=\"text\" id=\"opCustom\" placeholder=\"Digite nome do operador\" style=\"display:none;margin-top:6px\">\n    \n    \u003clabel style=\"margin-top:14px\">Status\u003c/label>\n    \u003cselect id=\"equipStatusStatus\">\n      \u003coption value=\"Operando\">Operando\u003c/option>\n      \u003coption value=\"Parado\">Parado\u003c/option>\n      \u003coption value=\"Manuten\u00e7\u00e3o\">Em Manuten\u00e7\u00e3o\u003c/option>\n    \u003c/select>\n    \n    \u003clabel style=\"margin-top:12px\">\u23f1\ufe0f Hor\u00edmetro final da jornada\u003c/label>\n    \u003cinput type=\"number\" step=\"0.1\" min=\"0\" id=\"equipHorimetro\" placeholder=\"Ex.: 4523.5\">\n    \n    \u003cdiv class=\"btn-row\" style=\"margin-top:14px\">\n      \u003cbutton class=\"btn btn-ghost\" onclick=\"fecharModal('modalEquipStatus')\">Cancelar\u003c/button>\n      \u003cbutton class=\"btn btn-primary\" onclick=\"salvarEquipStatus()\">Salvar\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- Ve\u00edculo Frota (cadastro) -->\n\u003cdiv class=\"modal-overlay\" id=\"modalVeiculoFrota\">\n  \u003cdiv class=\"modal\">\n    \u003cdiv class=\"modal-title\" id=\"modalVeiculoFrotaTitle\">Novo Ve\u00edculo Leve\u003c/div>\n    \u003clabel>Descri\u00e7\u00e3o / Modelo\u003c/label>\n    \u003cinput type=\"text\" id=\"modalVFDesc\" placeholder=\"Ex.: Toyota Hilux 2023\">\n    \u003clabel>Placa\u003c/label>\n    \u003cinput type=\"text\" id=\"modalVFPlaca\" placeholder=\"Ex.: SCR-2E45\">\n    \u003clabel>Tipo (opcional)\u003c/label>\n    \u003cinput type=\"text\" id=\"modalVFTipo\" placeholder=\"Ex.: Pickup, Van, SUV\">\n    \u003cdiv class=\"btn-row\" style=\"margin-top:14px\">\n      \u003cbutton class=\"btn btn-ghost\" onclick=\"fecharModal('modalVeiculoFrota')\">Cancelar\u003c/button>\n      \u003cbutton class=\"btn btn-primary\" onclick=\"salvarVeiculoFrota()\">Salvar\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- Atividade cadastro -->\n\u003cdiv class=\"modal-overlay\" id=\"modalAtividade\">\n  \u003cdiv class=\"modal\">\n    \u003cdiv class=\"modal-title\" id=\"modalAtivTitle\">Nova Atividade Padr\u00e3o\u003c/div>\n    \u003clabel>Descri\u00e7\u00e3o\u003c/label>\n    \u003cinput type=\"text\" id=\"modalAtivDesc\" placeholder=\"Ex.: Concretagem de laje\">\n    \u003clabel>Local / Frente (opcional)\u003c/label>\n    \u003cinput type=\"text\" id=\"modalAtivLocal\" placeholder=\"Ex.: Bloco A - Pav. 3\">\n    \u003clabel>Unidade de Medida\u003c/label>\n    \u003cinput type=\"text\" id=\"modalAtivUnidade\" placeholder=\"Ex.: m\u00b3, m\u00b2, ml, und, kg, t...\">\n    \u003cdiv class=\"btn-row\" style=\"margin-top:14px\">\n      \u003cbutton class=\"btn btn-ghost\" onclick=\"fecharModal('modalAtividade')\">Cancelar\u003c/button>\n      \u003cbutton class=\"btn btn-primary\" onclick=\"salvarAtividade()\">Salvar\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- Atividade avulsa -->\n\u003cdiv class=\"modal-overlay\" id=\"modalAtivExtra\">\n  \u003cdiv class=\"modal\">\n    \u003cdiv class=\"modal-title\">Atividade Avulsa do Dia\u003c/div>\n    \u003clabel>Descri\u00e7\u00e3o\u003c/label>\n    \u003cinput type=\"text\" id=\"modalAtivExtraDesc\" placeholder=\"Ex.: Atendimento de fiscaliza\u00e7\u00e3o\">\n    \u003clabel>Local / Frente\u003c/label>\n    \u003cinput type=\"text\" id=\"modalAtivExtraLocal\" placeholder=\"Opcional\">\n    \u003cdiv class=\"btn-row\" style=\"margin-top:14px\">\n      \u003cbutton class=\"btn btn-ghost\" onclick=\"fecharModal('modalAtivExtra')\">Cancelar\u003c/button>\n      \u003cbutton class=\"btn btn-primary\" onclick=\"salvarAtivExtra()\">Salvar\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- Atividade paralisada -->\n\u003cdiv class=\"modal-overlay\" id=\"modalAtivParalisada\">\n  \u003cdiv class=\"modal\">\n    \u003cdiv class=\"modal-title\">Registrar Atividade Paralisada\u003c/div>\n    \u003clabel>Atividade\u003c/label>\n    \u003cselect id=\"modalAtivParSel\">\u003c/select>\n    \u003clabel>Justificativa\u003c/label>\n    \u003cinput type=\"text\" id=\"modalAtivParJust\" placeholder=\"Chuva, falta de material, aguardando libera\u00e7\u00e3o...\">\n    \u003cdiv class=\"btn-row\" style=\"margin-top:14px\">\n      \u003cbutton class=\"btn btn-ghost\" onclick=\"fecharModal('modalAtivParalisada')\">Cancelar\u003c/button>\n      \u003cbutton class=\"btn btn-primary\" onclick=\"salvarAtivParalisada()\">Salvar\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- Evento cadastro -->\n\u003cdiv class=\"modal-overlay\" id=\"modalEventoCad\">\n  \u003cdiv class=\"modal\">\n    \u003cdiv class=\"modal-title\" id=\"modalEventoCadTitle\">Novo Tipo\u003c/div>\n    \u003clabel>Descri\u00e7\u00e3o do tipo\u003c/label>\n    \u003cinput type=\"text\" id=\"modalEventoCadDesc\" placeholder=\"Ex.: Quase-acidente\">\n    \u003cdiv class=\"btn-row\" style=\"margin-top:14px\">\n      \u003cbutton class=\"btn btn-ghost\" onclick=\"fecharModal('modalEventoCad')\">Cancelar\u003c/button>\n      \u003cbutton class=\"btn btn-primary\" onclick=\"salvarEventoCadastro()\">Salvar\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- Evento do dia -->\n\u003cdiv class=\"modal-overlay\" id=\"modalEventoDia\">\n  \u003cdiv class=\"modal\">\n    \u003cdiv class=\"modal-title\" id=\"modalEventoDiaTitle\">Registrar Evento\u003c/div>\n    \u003clabel>Tipo (do cadastro)\u003c/label>\n    \u003cselect id=\"modalEventoDiaTipo\">\u003c/select>\n    \u003clabel>Descri\u00e7\u00e3o detalhada\u003c/label>\n    \u003ctextarea id=\"modalEventoDiaDesc\" placeholder=\"O que aconteceu, onde, quando...\">\u003c/textarea>\n    \u003clabel>Gravidade\u003c/label>\n    \u003cselect id=\"modalEventoDiaGrav\">\n      \u003coption value=\"leve\">Leve\u003c/option>\n      \u003coption value=\"media\">M\u00e9dia\u003c/option>\n      \u003coption value=\"grave\">Grave\u003c/option>\n    \u003c/select>\n    \u003clabel>A\u00e7\u00e3o tomada\u003c/label>\n    \u003ctextarea id=\"modalEventoDiaAcao\" placeholder=\"Medidas adotadas, respons\u00e1veis, prazos...\">\u003c/textarea>\n    \u003cdiv class=\"btn-row\" style=\"margin-top:14px\">\n      \u003cbutton class=\"btn btn-ghost\" onclick=\"fecharModal('modalEventoDia')\">Cancelar\u003c/button>\n      \u003cbutton class=\"btn btn-primary\" onclick=\"salvarEventoDia()\">Salvar\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- Ve\u00edculo Leve - Seletor de Motorista -->\n\u003cdiv class=\"modal-overlay\" id=\"modalVeiculoLeve\">\n  \u003cdiv class=\"modal\">\n    \u003cdiv class=\"modal-title\" id=\"modalVLTitle\">\ud83d\ude97 Ve\u00edculo\u003c/div>\n    \u003clabel>Motorista do dia\u003c/label>\n    \u003cinput type=\"text\" id=\"modalVLSearch\" class=\"op-search\" placeholder=\"\ud83d\udd0d Buscar por nome ou matr\u00edcula...\">\n    \u003cdiv class=\"op-list\" id=\"modalVLColabList\">\u003c/div>\n    \u003clabel style=\"margin-top:10px\">Ou digitar nome manualmente\u003c/label>\n    \u003cinput type=\"text\" id=\"modalVLCustomNome\" placeholder=\"Nome do motorista\">\n    \u003cdiv class=\"btn-row\" style=\"margin-top:14px\">\n      \u003cbutton class=\"btn btn-ghost\" onclick=\"fecharModal('modalVeiculoLeve')\">Cancelar\u003c/button>\n      \u003cbutton class=\"btn btn-primary\" onclick=\"salvarVeiculoLeve()\">Salvar\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- Evento avulso -->\n\u003cdiv class=\"modal-overlay\" id=\"modalEventoAvulso\">\n  \u003cdiv class=\"modal\">\n    \u003cdiv class=\"modal-title\" id=\"modalEventoAvulsoTitle\">Evento Avulso\u003c/div>\n    \u003clabel>Tipo / T\u00edtulo\u003c/label>\n    \u003cinput type=\"text\" id=\"modalEventoAvulsoTipo\" placeholder=\"Ex.: Pequeno corte em m\u00e3o\">\n    \u003clabel>Descri\u00e7\u00e3o detalhada\u003c/label>\n    \u003ctextarea id=\"modalEventoAvulsoDesc\">\u003c/textarea>\n    \u003clabel>Gravidade\u003c/label>\n    \u003cselect id=\"modalEventoAvulsoGrav\">\n      \u003coption value=\"leve\">Leve\u003c/option>\n      \u003coption value=\"media\">M\u00e9dia\u003c/option>\n      \u003coption value=\"grave\">Grave\u003c/option>\n    \u003c/select>\n    \u003clabel>A\u00e7\u00e3o tomada\u003c/label>\n    \u003ctextarea id=\"modalEventoAvulsoAcao\">\u003c/textarea>\n    \u003cdiv class=\"btn-row\" style=\"margin-top:14px\">\n      \u003cbutton class=\"btn btn-ghost\" onclick=\"fecharModal('modalEventoAvulso')\">Cancelar\u003c/button>\n      \u003cbutton class=\"btn btn-primary\" onclick=\"salvarEventoAvulso()\">Salvar\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- Resumo calend\u00e1rio -->\n\u003cdiv class=\"modal-overlay\" id=\"modalResumo\">\n  \u003cdiv class=\"modal\">\n    \u003cdiv class=\"modal-title\" id=\"modalResumoTitle\">Resumo\u003c/div>\n    \u003cdiv class=\"output-box\" id=\"modalResumoTexto\" style=\"max-height:55vh\">\u003c/div>\n    \u003cdiv class=\"btn-stack\">\n      \u003cbutton class=\"btn btn-primary\" onclick=\"editarDiarioPassado()\">\u270f\ufe0f Editar este Di\u00e1rio\u003c/button>\n      \u003cbutton class=\"btn btn-whatsapp\" onclick=\"copiarResumoModal()\">\ud83d\udccb Copiar Texto\u003c/button>\n      \u003cbutton class=\"btn btn-secondary\" onclick=\"enviarResumoWhatsApp()\">\ud83d\udcac Abrir WhatsApp\u003c/button>\n      \u003cbutton class=\"btn btn-ghost\" onclick=\"fecharModal('modalResumo')\">Fechar\u003c/button>\n      \u003cbutton class=\"btn btn-ghost\" style=\"color:var(--red);border-color:var(--red)\" onclick=\"excluirDiarioPassado()\">\ud83d\uddd1\ufe0f Excluir este Di\u00e1rio\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- Modal Confirma\u00e7\u00e3o Customizado -->\n\u003cdiv class=\"modal-overlay\" id=\"modalConfirm\">\n  \u003cdiv class=\"modal\" style=\"max-width:320px\">\n    \u003cdiv class=\"modal-title\" id=\"modalConfirmTitle\" style=\"font-size:16px\">Confirmar\u003c/div>\n    \u003cp id=\"modalConfirmMsg\" style=\"font-size:14px;color:var(--ink-soft);margin:8px 0 16px;text-align:center;line-height:1.5\">\u003c/p>\n    \u003cdiv class=\"btn-row\">\n      \u003cbutton class=\"btn btn-ghost\" id=\"modalConfirmNo\">Cancelar\u003c/button>\n      \u003cbutton class=\"btn btn-primary\" id=\"modalConfirmYes\" style=\"background:var(--red);border-color:var(--red)\">Excluir\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"toast\" id=\"toast\">Salvo\u003c/div>\n\n\u003cscript>\n// ============================================================\n// CONSTANTES E ESTADO\n// ============================================================\nconst STORAGE_KEY = 'ger_diario_state';\nconst HISTORY_KEY = 'ger_diario_history';\n\nconst DIAS_SEMANA = ['Domingo','Segunda-feira','Ter\u00e7a-feira','Quarta-feira','Quinta-feira','Sexta-feira','S\u00e1bado'];\nconst DIAS_SEMANA_CURTO = ['DOM','SEG','TER','QUA','QUI','SEX','S\u00c1B'];\n\nconst DEFAULT_DATA = {\n  obra: {\n    nome: '',\n    empresa: '',\n    local: '',\n    contrato: '',\n    logo: '', // base64\n    encerramentoNormal: '17:00',\n    encerramentoSexta: '16:00',\n    encerramentoSabado: '16:00'\n  },\n  colaboradores: {\n    categorias: [\n      { id: 'c1', icon: '\ud83d\udc77', nome: 'Engenharia / Supervis\u00e3o', itens: [\n        { id: 'p1', mat: '101', nome: 'Carlos Mendes', funcao: 'Engenheiro Residente' },\n        { id: 'p2', mat: '102', nome: 'Roberto Silva', funcao: 'Supervisor de Obra' },\n        { id: 'p3', mat: '241', nome: 'Nivaldo Gomes', funcao: 'L\u00edder' }\n      ]},\n      { id: 'c2', icon: '\u2699\ufe0f', nome: 'Operacional', itens: [\n        { id: 'p4', mat: '201', nome: 'Jos\u00e9 Pereira', funcao: 'Operador' },\n        { id: 'p5', mat: '202', nome: 'Ant\u00f4nio Lima', funcao: 'Operador' },\n        { id: 'p6', mat: '203', nome: 'Marcos Souza', funcao: 'Auxiliar' }\n      ]},\n      { id: 'c3', icon: '\ud83d\udd27', nome: 'Montadores', itens: [\n        { id: 'p7', mat: '301', nome: 'Paulo Ferreira', funcao: 'Montador' },\n        { id: 'p8', mat: '302', nome: 'Lucas Oliveira', funcao: 'Montador' },\n        { id: 'p9', mat: '303', nome: 'Andr\u00e9 Santos', funcao: 'Montador' },\n        { id: 'p10', mat: '304', nome: 'Diego Rocha', funcao: 'Montador' }\n      ]},\n      { id: 'c4', icon: '\ud83e\uddf1', nome: 'Produ\u00e7\u00e3o / Apoio', itens: [\n        { id: 'p11', mat: '401', nome: 'Rafael Costa', funcao: 'Produ\u00e7\u00e3o' },\n        { id: 'p12', mat: '402', nome: 'Bruno Alves', funcao: 'Produ\u00e7\u00e3o' },\n        { id: 'p13', mat: '403', nome: 'Felipe Martins', funcao: 'Apoio' },\n        { id: 'p14', mat: '404', nome: 'Tiago Ramos', funcao: 'Apoio' }\n      ]},\n      { id: 'c5', icon: '\ud83d\udd0d', nome: 'Qualidade / Apontamento', itens: [\n        { id: 'p15', mat: '501', nome: 'Marcelo Dias', funcao: 'Apontador' },\n        { id: 'p16', mat: '502', nome: 'Eduardo Pinto', funcao: 'Qualidade' }\n      ]},\n      { id: 'c6', icon: '\ud83d\udea7', nome: 'Sinaleiros', itens: [\n        { id: 'p17', mat: '601', nome: 'Wagner Cardoso', funcao: 'Sinaleiro' },\n        { id: 'p18', mat: '602', nome: 'Roberto Tavares', funcao: 'Sinaleiro' },\n        { id: 'p19', mat: '603', nome: 'S\u00e9rgio Barros', funcao: 'Sinaleiro' }\n      ]},\n      { id: 'c7', icon: '\u26a1', nome: 'El\u00e9trica', itens: [\n        { id: 'p20', mat: '701', nome: 'Fernando Castro', funcao: 'Eletricista' },\n        { id: 'p21', mat: '702', nome: 'Cl\u00e1udio Moreira', funcao: 'Eletricista' }\n      ]},\n      { id: 'c8', icon: '\ud83d\ude9b', nome: 'Motoristas', itens: [\n        { id: 'p22', mat: '801', nome: 'Jo\u00e3o Batista', funcao: 'Motorista' },\n        { id: 'p23', mat: '802', nome: 'Mauro Lopes', funcao: 'Motorista' },\n        { id: 'p24', mat: '803', nome: 'Vin\u00edcius Reis', funcao: 'Motorista' },\n        { id: 'p25', mat: '804', nome: 'Adilson Cruz', funcao: 'Motorista' },\n        { id: 'p26', mat: '805', nome: 'H\u00e9lio Vieira', funcao: 'Motorista' },\n        { id: 'p27', mat: '806', nome: 'Ot\u00e1vio Nunes', funcao: 'Motorista' }\n      ]}\n    ]\n  },\n  equipamentos: [\n    { id: 'e1', numero: 'ESC-001', desc: 'Escavadeira CAT 320', isMotorista: false },\n    { id: 'e2', numero: 'RET-002', desc: 'Retroescavadeira JCB 3CX', isMotorista: false },\n    { id: 'e3', numero: 'GUI-003', desc: 'Guindaste Liebherr 50T', isMotorista: false },\n    { id: 'e4', numero: 'CAM-004', desc: 'Caminh\u00e3o Basculante', isMotorista: true },\n    { id: 'e5', numero: 'BET-005', desc: 'Betoneira 400L', isMotorista: false }\n  ],\n  atividades: [\n    { id: 'a1', desc: 'Concretagem de laje', local: '', unidade: 'm\u00b3' },\n    { id: 'a2', desc: 'Montagem de f\u00f4rmas', local: '', unidade: 'm\u00b2' },\n    { id: 'a3', desc: 'Arma\u00e7\u00e3o de a\u00e7o', local: '', unidade: 'kg' },\n    { id: 'a4', desc: 'Escava\u00e7\u00e3o', local: '', unidade: 'm\u00b3' },\n    { id: 'a5', desc: 'Acompanhamento de fiscaliza\u00e7\u00e3o', local: '', unidade: '' }\n  ],\n  veiculosFrota: [],\n  seguranca: [\n    { id: 's1', desc: 'Acidente sem afastamento' },\n    { id: 's2', desc: 'Quase-acidente' },\n    { id: 's3', desc: 'Ato inseguro observado' },\n    { id: 's4', desc: 'Condi\u00e7\u00e3o insegura observada' }\n  ],\n  meio_ambiente: [\n    { id: 'm1', desc: 'Derramamento de \u00f3leo/combust\u00edvel' },\n    { id: 'm2', desc: 'Descarte irregular de res\u00edduo' },\n    { id: 'm3', desc: 'Emiss\u00e3o de poeira excessiva' },\n    { id: 'm4', desc: 'Ru\u00eddo acima do permitido' }\n  ]\n};\n\nconst EMPTY_DAY = () => ({\n  data: '',\n  tempo: '',           // sol | nublado | chuva | chuva_forte\n  tempoVento: false,\n  cafeInicio: '07:30', cafeFim: '07:50',\n  almocoInicio: '12:00', almocoFim: '13:00',\n  encerramento: '17:00',\n  dssTema: '',\n  dssHorario: '',\n  dssMinistrou: '',\n  atividadesExtra: '',\n  atividadesMarcadas: {},\n  atividadesQtd: {},  // id -> quantidade executada\n  atividadesAvulsas: [],\n  atividadesParalisadas: [],  // [{id, desc, just}] \u2014 atividade cadastrada parada, com justificativa\n  efetivo: {},\n  equipamentos: {},  // id -> {ativo, operadorMat, operadorNome, status, horimetro}\n  veiculosLeves: [],  // [{id, desc, placa, motorista}]\n  veiculosParados: {},  // id (equipamento ou ve\u00edculo da frota) -> justificativa\n  eventosSeguranca: [],\n  eventosAmbiente: []\n});\n\nlet state = loadState();\nlet history = loadHistory();\nlet currentDay = null;\nlet editingDate = null;\nlet editingCat = { type: null, id: null };\nlet editingItem = { type: null, parentId: null, id: null };\nlet cal = { year: 0, month: 0 };\nlet activeEventoTipo = null;\nlet activeEquipId = null;\nlet activeResumoData = null;\nlet activeEventoEditIdx = null;\nlet opSelectedSource = 'default';\nlet opSelectedMat = null;\nlet opSelectedNome = null;\n\nfunction loadState() {\n  try {\n    const s = window.__storage.getItem(STORAGE_KEY);\n    if (s) return mergeDefaults(JSON.parse(s));\n  } catch(e) {}\n  return JSON.parse(JSON.stringify(DEFAULT_DATA));\n}\nfunction mergeDefaults(d) {\n  const base = JSON.parse(JSON.stringify(DEFAULT_DATA));\n  // deep-ish merge: garante chaves principais\n  Object.keys(base).forEach(k => {\n    if (d[k] !== undefined) base[k] = d[k];\n  });\n  // garante todas as subchaves de obra\n  if (!base.obra) base.obra = JSON.parse(JSON.stringify(DEFAULT_DATA.obra));\n  Object.keys(DEFAULT_DATA.obra).forEach(k => {\n    if (base.obra[k] === undefined) base.obra[k] = DEFAULT_DATA.obra[k];\n  });\n  return base;\n}\nfunction saveState() { window.__storage.setItem(STORAGE_KEY, JSON.stringify(state)); }\n\nfunction loadHistory() {\n  try {\n    const h = window.__storage.getItem(HISTORY_KEY);\n    if (h) return JSON.parse(h);\n  } catch(e) {}\n  return {};\n}\nfunction saveHistory() { window.__storage.setItem(HISTORY_KEY, JSON.stringify(history)); }\n\n// ============================================================\n// UTILS\n// ============================================================\nfunction todayISO() {\n  const d = new Date();\n  const tz = d.getTimezoneOffset() * 60000;\n  return new Date(d - tz).toISOString().slice(0,10);\n}\nfunction parseISO(iso) {\n  const [y,m,d] = iso.split('-').map(Number);\n  return new Date(y, m-1, d);\n}\nfunction formatDateBR(d) {\n  if (!d) return '\u2014';\n  const [y,m,day] = d.split('-');\n  return `${day}/${m}/${y}`;\n}\nfunction diaDaSemana(iso) {\n  return DIAS_SEMANA[parseISO(iso).getDay()];\n}\nfunction escapeHtml(s) {\n  return String(s || '').replace(/[&\u003c>\"']/g, m => ({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[m]));\n}\nfunction toast(msg) {\n  const t = document.getElementById('toast');\n  t.textContent = msg;\n  t.classList.add('show');\n  clearTimeout(window._toastT);\n  window._toastT = setTimeout(() => t.classList.remove('show'), 2200);\n}\nfunction uid(p) { return p + Date.now() + Math.floor(Math.random()*1000); }\n\nfunction gravBadge(g) {\n  if (g === 'leve') return '\u003cspan class=\"badge badge-leve\">Leve\u003c/span>';\n  if (g === 'media') return '\u003cspan class=\"badge badge-med\">M\u00e9dia\u003c/span>';\n  if (g === 'grave') return '\u003cspan class=\"badge badge-grave\">Grave\u003c/span>';\n  return '';\n}\n\nfunction tempoLabel(t, v) {\n  const map = { sol: '\u2600\ufe0f Sol', nublado: '\u26c5 Nublado', chuva: '\ud83c\udf27\ufe0f Chuva', chuva_forte: '\u26c8\ufe0f Chuva Forte' };\n  if (!t) return v ? '\ud83d\udca8 Com vento' : '\u2014';\n  return (map[t] || '\u2014') + (v ? ' \ud83d\udca8 c/ vento' : '');\n}\n\nfunction jornadaPadraoPorDia(iso) {\n  const d = parseISO(iso).getDay(); // 0=dom, 5=sex, 6=sab\n  if (d === 5) return state.obra.encerramentoSexta || '16:00';\n  if (d === 6) return state.obra.encerramentoSabado || '16:00';\n  return state.obra.encerramentoNormal || '17:00';\n}\n\n// ============================================================\n// NAVEGA\u00c7\u00c3O\n// ============================================================\ndocument.querySelectorAll('.tab').forEach(btn => {\n  btn.addEventListener('click', () => {\n    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));\n    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));\n    btn.classList.add('active');\n    document.getElementById('view-' + btn.dataset.view).classList.add('active');\n    const v = btn.dataset.view;\n    if (v === 'diario') renderDiario();\n    if (v === 'gerar') gerarRelatorio();\n    if (v === 'calendario') renderCalendario();\n    if (v === 'config') renderConfig();\n    if (v === 'resumo') renderResumo();\n  });\n});\ndocument.querySelectorAll('.subtab').forEach(btn => {\n  btn.addEventListener('click', () => {\n    const pane = btn.dataset.pane;\n    document.querySelectorAll('.subtab').forEach(t => {\n      if (t.dataset.pane === pane) t.classList.add('active');\n      else t.classList.remove('active');\n    });\n    document.querySelectorAll('.config-pane').forEach(p => p.classList.remove('active'));\n    document.getElementById('pane-' + pane).classList.add('active');\n    renderConfig();\n  });\n});\n\n// ============================================================\n// HEADER\n// ============================================================\nfunction atualizarHeader() {\n  document.getElementById('hdrEmpresa').textContent = state.obra.empresa || 'EMPRESA';\n  document.getElementById('hdrObra').textContent = state.obra.nome || 'Configure em \u2699\ufe0f Cadastro';\n  const logoEl = document.getElementById('hdrLogo');\n  if (state.obra.logo) {\n    logoEl.innerHTML = `\u003cimg src=\"${state.obra.logo}\" alt=\"logo\">`;\n  } else {\n    const sigla = (state.obra.empresa || 'LOGO').substring(0,3).toUpperCase();\n    logoEl.innerHTML = sigla;\n  }\n}\n\n// ============================================================\n// CURRENT DAY\n// ============================================================\nfunction initCurrentDay(data) {\n  data = data || todayISO();\n  if (history[data]) {\n    currentDay = JSON.parse(JSON.stringify(history[data]));\n  } else {\n    currentDay = EMPTY_DAY();\n    currentDay.data = data;\n    currentDay.encerramento = jornadaPadraoPorDia(data);\n  }\n  editingDate = (data === todayISO()) ? null : data;\n  atualizarHeaderEdicao();\n  preencherCampos();\n  renderDiario();\n}\n\nfunction atualizarHeaderEdicao() {\n  const card = document.getElementById('editingCard');\n  if (editingDate) {\n    card.style.display = 'flex';\n    card.classList.add('editing');\n    document.getElementById('editingDate').textContent = formatDateBR(editingDate);\n  } else {\n    card.style.display = 'none';\n  }\n  document.getElementById('hdrDate').textContent = \n    `${DIAS_SEMANA_CURTO[parseISO(currentDay.data).getDay()]} \u00b7 ${formatDateBR(currentDay.data)}`;\n  document.getElementById('diaSemana').textContent = diaDaSemana(currentDay.data);\n  \n  // info jornada (avisa sextas/s\u00e1bados)\n  const dow = parseISO(currentDay.data).getDay();\n  const info = document.getElementById('jornadaInfo');\n  const infoTxt = document.getElementById('jornadaInfoText');\n  if (dow === 5) {\n    info.style.display = 'flex';\n    infoTxt.textContent = `Sexta-feira: encerramento padr\u00e3o ${state.obra.encerramentoSexta}`;\n  } else if (dow === 6) {\n    info.style.display = 'flex';\n    infoTxt.textContent = `S\u00e1bado: encerramento padr\u00e3o ${state.obra.encerramentoSabado}`;\n  } else {\n    info.style.display = 'none';\n  }\n}\n\nfunction voltarParaHoje() {\n  salvarDiarioDia(false);\n  initCurrentDay(todayISO());\n  toast('Voltou para hoje');\n}\n\nfunction preencherCampos() {\n  ['cafeInicio','cafeFim','almocoInicio','almocoFim','encerramento','dssTema','dssHorario','atividadesExtra'].forEach(k => {\n    const el = document.getElementById(k);\n    if (el) el.value = currentDay[k] || '';\n  });\n  // DSS Ministrou\n  const dssMin = document.getElementById('dssMinistrou');\n  if (dssMin) {\n    // Popular op\u00e7\u00f5es da lista de colaboradores\n    const opts = ['\u003coption value=\"\">\u2014 Selecionar \u2014\u003c/option>'];\n    state.colaboradores.categorias.forEach(cat => {\n      cat.itens.forEach(c => opts.push(`\u003coption value=\"${escapeHtml(c.mat+'|'+c.nome)}\" ${currentDay.dssMinistrou===c.mat+'|'+c.nome?'selected':''}>${escapeHtml(c.nome)} (${escapeHtml(c.mat)})\u003c/option>`));\n    });\n    dssMin.innerHTML = opts.join('');\n  }\n  document.getElementById('dataDiario').value = currentDay.data;\n  // tempo chips\n  document.querySelectorAll('.tempo-chip').forEach(c => {\n    if (c.dataset.tempo === currentDay.tempo) c.classList.add('active');\n    else c.classList.remove('active');\n  });\n  document.getElementById('tempoVento').checked = !!currentDay.tempoVento;\n}\n\ndocument.addEventListener('DOMContentLoaded', () => {\n  ['cafeInicio','cafeFim','almocoInicio','almocoFim','encerramento','dssTema','dssHorario','atividadesExtra'].forEach(k => {\n    const el = document.getElementById(k);\n    if (el) el.addEventListener('input', () => {\n      currentDay[k] = el.value;\n      if (k === 'dssHorario' || k === 'dssTema') salvarDiarioDia(false);\n      else salvarDiarioDia(false);\n    });\n  });\n  // DSS ministrou\n  const dssMinEl = document.getElementById('dssMinistrou');\n  if (dssMinEl) dssMinEl.addEventListener('change', () => { currentDay.dssMinistrou = dssMinEl.value; salvarDiarioDia(false); });\n  document.getElementById('dataDiario').addEventListener('input', e => {\n    const novaData = e.target.value;\n    if (!novaData) return;\n    salvarDiarioDia(false);\n    initCurrentDay(novaData);\n  });\n  document.querySelectorAll('.tempo-chip').forEach(c => {\n    c.addEventListener('click', () => {\n      if (c.classList.contains('active')) {\n        c.classList.remove('active');\n        currentDay.tempo = '';\n      } else {\n        document.querySelectorAll('.tempo-chip').forEach(x => x.classList.remove('active'));\n        c.classList.add('active');\n        currentDay.tempo = c.dataset.tempo;\n      }\n      salvarDiarioDia(false);\n    });\n  });\n  document.getElementById('tempoVento').addEventListener('change', e => {\n    currentDay.tempoVento = e.target.checked;\n    salvarDiarioDia(false);\n  });\n  // op tabs no modal de equipamento\n  document.querySelectorAll('.op-tab').forEach(t => {\n    t.addEventListener('click', () => {\n      document.querySelectorAll('.op-tab').forEach(x => x.classList.remove('active'));\n      t.classList.add('active');\n      opSelectedSource = t.dataset.source;\n      atualizarSeletorOperador();\n    });\n  });\n});\n\nfunction salvarDiarioDia(notificar) {\n  if (!currentDay || !currentDay.data) return;\n  const temDado = currentDay.dssTema || currentDay.dssHorario || currentDay.atividadesExtra || currentDay.tempo ||\n    Object.keys(currentDay.efetivo).length > 0 ||\n    Object.keys(currentDay.atividadesMarcadas).length > 0 ||\n    Object.keys(currentDay.atividadesQtd || {}).length > 0 ||\n    currentDay.atividadesAvulsas.length > 0 ||\n    (currentDay.atividadesParalisadas || []).length > 0 ||\n    Object.keys(currentDay.equipamentos).length > 0 ||\n    (currentDay.veiculosLeves || []).length > 0 ||\n    Object.keys(currentDay.veiculosParados || {}).length > 0 ||\n    currentDay.eventosSeguranca.length > 0 ||\n    currentDay.eventosAmbiente.length > 0;\n  if (temDado) {\n    history[currentDay.data] = JSON.parse(JSON.stringify(currentDay));\n    saveHistory();\n  } else if (history[currentDay.data]) {\n    delete history[currentDay.data];\n    saveHistory();\n  }\n  if (notificar) {\n    toast('Di\u00e1rio salvo no hist\u00f3rico');\n    backupAutomatico();\n  }\n}\n\n// ============================================================\n// RENDER DI\u00c1RIO\n// ============================================================\nfunction renderDiario() {\n  renderAtividadesDia();\n  renderAtivParalisadas();\n  renderEfetivoDia();\n  renderEquipDia();\n  renderVeiculosLevesDia();\n  renderVeiculosParados();\n  renderEventosDia('seguranca');\n  renderEventosDia('meio_ambiente');\n}\n\nfunction marcarTodosTipo(tipo, valor) {\n  if (tipo === 'efetivo') {\n    state.colaboradores.categorias.forEach(cat => {\n      cat.itens.forEach(c => {\n        if (valor) currentDay.efetivo[c.id] = true;\n        else delete currentDay.efetivo[c.id];\n      });\n    });\n    renderEfetivoDia();\n  } else if (tipo === 'atividades') {\n    state.atividades.forEach(a => {\n      if (valor) currentDay.atividadesMarcadas[a.id] = true;\n      else delete currentDay.atividadesMarcadas[a.id];\n    });\n    renderAtividadesDia();\n  } else if (tipo === 'equipamentos') {\n    state.equipamentos.forEach(e => {\n      if (valor) {\n        currentDay.equipamentos[e.id] = currentDay.equipamentos[e.id] || { ativo: true, operadorMat: '', operadorNome: '', status: 'Operando' };\n        currentDay.equipamentos[e.id].ativo = true;\n      } else {\n        delete currentDay.equipamentos[e.id];\n      }\n    });\n    renderEquipDia();\n  }\n  salvarDiarioDia(false);\n}\n\nfunction renderAtividadesDia() {\n  const cont = document.getElementById('atividadesList');\n  cont.innerHTML = '';\n  if (state.atividades.length === 0) {\n    cont.innerHTML = '\u003cdiv class=\"empty\">Cadastre atividades em \u2699\ufe0f Cadastro\u003c/div>';\n  } else {\n    state.atividades.forEach(a => {\n      const checked = !!currentDay.atividadesMarcadas[a.id];\n      const qtd = (currentDay.atividadesQtd && currentDay.atividadesQtd[a.id]) || '';\n      const unid = a.unidade || '';\n      const row = document.createElement('div');\n      row.className = 'item-row clickable ' + (checked ? 'checked' : '');\n      row.innerHTML = `\n        \u003cdiv class=\"checkbox\">\u003c/div>\n        \u003cdiv class=\"item-info\">\n          \u003cdiv class=\"item-name\">${escapeHtml(a.desc)}\u003c/div>\n          ${a.local ? `\u003cdiv class=\"item-meta\">${escapeHtml(a.local)}\u003c/div>` : ''}\n        \u003c/div>\n        \u003cdiv style=\"display:flex;align-items:center;gap:4px;min-width:90px\">\n          \u003cinput type=\"number\" step=\"any\" min=\"0\" placeholder=\"Qtd\" value=\"${qtd}\"\n            style=\"width:60px;padding:5px 6px;font-size:13px;border:1px solid var(--line);border-radius:5px;background:var(--bg-card);color:var(--ink)\"\n            onclick=\"event.stopPropagation()\"\n            oninput=\"event.stopPropagation();salvarQtdAtividade('${a.id}',this.value)\">\n          ${unid ? `\u003cspan style=\"font-size:11px;color:var(--ink-faint);white-space:nowrap\">${escapeHtml(unid)}\u003c/span>` : ''}\n        \u003c/div>\n      `;\n      row.onclick = (e) => {\n        if (e.target.tagName === 'INPUT') return;\n        if (checked) delete currentDay.atividadesMarcadas[a.id];\n        else currentDay.atividadesMarcadas[a.id] = true;\n        salvarDiarioDia(false);\n        renderAtividadesDia();\n      };\n      cont.appendChild(row);\n    });\n  }\n  if (currentDay.atividadesAvulsas.length > 0) {\n    const sep = document.createElement('div');\n    sep.style.cssText = 'font-size:10px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.6px;margin:10px 4px 4px;font-weight:600';\n    sep.textContent = '\u2022 Avulsas do dia';\n    cont.appendChild(sep);\n    currentDay.atividadesAvulsas.forEach((a, idx) => {\n      const row = document.createElement('div');\n      row.className = 'item-row checked';\n      row.innerHTML = `\n        \u003cdiv class=\"checkbox\">\u003c/div>\n        \u003cdiv class=\"item-info\">\n          \u003cdiv class=\"item-name\">${escapeHtml(a.desc)}\u003c/div>\n          ${a.local ? `\u003cdiv class=\"item-meta\">${escapeHtml(a.local)}\u003c/div>` : ''}\n        \u003c/div>\n        \u003cdiv class=\"item-actions\">\n          \u003cbutton class=\"icon-btn\" onclick=\"event.stopPropagation();removerAtivAvulsa(${idx})\">\ud83d\uddd1\ufe0f\u003c/button>\n        \u003c/div>\n      `;\n      cont.appendChild(row);\n    });\n  }\n}\n\nfunction salvarQtdAtividade(atId, valor) {\n  if (!currentDay.atividadesQtd) currentDay.atividadesQtd = {};\n  if (valor === '' || valor === null) delete currentDay.atividadesQtd[atId];\n  else currentDay.atividadesQtd[atId] = valor;\n  salvarDiarioDia(false);\n}\n\nfunction removerAtivAvulsa(idx) {\n  currentDay.atividadesAvulsas.splice(idx, 1);\n  salvarDiarioDia(false);\n  renderAtividadesDia();\n}\n\nfunction abrirModalAtivExtra() {\n  document.getElementById('modalAtivExtraDesc').value = '';\n  document.getElementById('modalAtivExtraLocal').value = '';\n  abrirModal('modalAtivExtra');\n}\nfunction salvarAtivExtra() {\n  const desc = document.getElementById('modalAtivExtraDesc').value.trim();\n  const local = document.getElementById('modalAtivExtraLocal').value.trim();\n  if (!desc) { toast('Descreva a atividade'); return; }\n  currentDay.atividadesAvulsas.push({ id: uid('av'), desc, local });\n  salvarDiarioDia(false);\n  fecharModal('modalAtivExtra');\n  renderAtividadesDia();\n  toast('Atividade adicionada');\n}\n\nfunction renderAtivParalisadas() {\n  const cont = document.getElementById('ativParalisadasList');\n  if (!cont) return;\n  const lista = currentDay.atividadesParalisadas || [];\n  if (!lista.length) {\n    cont.innerHTML = '\u003cdiv class=\"empty\">Nenhuma atividade paralisada hoje\u003c/div>';\n    return;\n  }\n  cont.innerHTML = lista.map((p, i) => `\n    \u003cdiv class=\"item-row\" style=\"flex-direction:column;align-items:stretch;gap:6px\">\n      \u003cdiv style=\"display:flex;justify-content:space-between;align-items:center\">\n        \u003cdiv class=\"item-name\">\u23f8\ufe0f ${escapeHtml(p.desc)}\u003c/div>\n        \u003cbutton class=\"icon-btn\" data-rm-ativpar=\"${i}\" title=\"Remover\">\u2715\u003c/button>\n      \u003c/div>\n      \u003cinput type=\"text\" placeholder=\"Justificativa (chuva, falta de material, aguardando libera\u00e7\u00e3o...)\"\n        value=\"${escapeHtml(p.just || '')}\" data-just-ativpar=\"${i}\">\n    \u003c/div>\n  `).join('');\n  cont.querySelectorAll('[data-just-ativpar]').forEach(el => {\n    el.addEventListener('input', () => salvarJustAtivParalisada(Number(el.dataset.justAtivpar), el.value));\n  });\n  cont.querySelectorAll('[data-rm-ativpar]').forEach(el => {\n    el.addEventListener('click', () => removerAtivParalisada(Number(el.dataset.rmAtivpar)));\n  });\n}\n\nfunction abrirModalAtivParalisada() {\n  const sel = document.getElementById('modalAtivParSel');\n  const jaParadas = new Set((currentDay.atividadesParalisadas || []).map(p => p.id));\n  const disponiveis = state.atividades.filter(a => !jaParadas.has(a.id));\n  if (!disponiveis.length) {\n    toast(state.atividades.length ? 'Todas as atividades cadastradas j\u00e1 est\u00e3o paralisadas' : 'Cadastre atividades em \u2699\ufe0f Cadastro primeiro', 'var(--red)');\n    return;\n  }\n  sel.innerHTML = disponiveis.map(a => `\u003coption value=\"${escapeHtml(a.id)}\">${escapeHtml(a.desc)}\u003c/option>`).join('');\n  document.getElementById('modalAtivParJust').value = '';\n  abrirModal('modalAtivParalisada');\n}\n\nfunction salvarAtivParalisada() {\n  const id = document.getElementById('modalAtivParSel').value;\n  const just = document.getElementById('modalAtivParJust').value.trim();\n  const a = state.atividades.find(x => x.id === id);\n  if (!a) { toast('Selecione uma atividade', 'var(--red)'); return; }\n  if (!currentDay.atividadesParalisadas) currentDay.atividadesParalisadas = [];\n  currentDay.atividadesParalisadas.push({ id: a.id, desc: a.desc, just });\n  salvarDiarioDia(false);\n  fecharModal('modalAtivParalisada');\n  renderAtivParalisadas();\n  toast('Atividade paralisada registrada');\n}\n\nfunction salvarJustAtivParalisada(idx, valor) {\n  const lista = currentDay.atividadesParalisadas || [];\n  if (!lista[idx]) return;\n  lista[idx].just = valor;\n  salvarDiarioDia(false);\n}\n\nfunction removerAtivParalisada(idx) {\n  const lista = currentDay.atividadesParalisadas || [];\n  if (!lista[idx]) return;\n  confirmar(`Remover \"${lista[idx].desc}\" das atividades paralisadas?`, () => {\n    lista.splice(idx, 1);\n    salvarDiarioDia(false);\n    renderAtivParalisadas();\n  });\n}\n\nfunction renderEfetivoDia() {\n  const cont = document.getElementById('efetivoList');\n  cont.innerHTML = '';\n  let totalP = 0, totalC = 0;\n  state.colaboradores.categorias.forEach(cat => {\n    const presentes = cat.itens.filter(c => currentDay.efetivo[c.id]);\n    totalP += presentes.length;\n    totalC += cat.itens.length;\n    const block = document.createElement('div');\n    block.className = 'cat-block';\n    block.innerHTML = `\n      \u003cdiv class=\"cat-header\">\n        \u003cdiv class=\"cat-header-left\">\n          \u003cspan class=\"cat-icon\">${cat.icon || '\ud83d\udcc1'}\u003c/span>\n          \u003cspan class=\"cat-name\">${escapeHtml(cat.nome)}\u003c/span>\n        \u003c/div>\n        \u003cspan class=\"cat-count\">${presentes.length}/${cat.itens.length}\u003c/span>\n        \u003cspan class=\"cat-toggle\">\u25bc\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"cat-body\">\n        ${cat.itens.length === 0 ? '\u003cdiv class=\"empty\">Sem colaboradores\u003c/div>' :\n          cat.itens.map(c => `\n            \u003cdiv class=\"item-row clickable ${currentDay.efetivo[c.id] ? 'checked' : ''}\" data-colab=\"${c.id}\">\n              \u003cdiv class=\"checkbox\">\u003c/div>\n              \u003cdiv class=\"item-info\">\n                \u003cdiv class=\"item-name\">${escapeHtml(c.nome)}\u003c/div>\n                \u003cdiv class=\"item-meta\">\u003cspan class=\"mat\">${escapeHtml(c.mat)}\u003c/span> \u00b7 ${escapeHtml(c.funcao)}\u003c/div>\n              \u003c/div>\n            \u003c/div>\n          `).join('')\n        }\n      \u003c/div>\n    `;\n    block.querySelector('.cat-header').onclick = () => block.classList.toggle('collapsed');\n    block.querySelectorAll('.item-row').forEach(r => {\n      const id = r.dataset.colab;\n      r.onclick = (e) => {\n        e.stopPropagation();\n        if (currentDay.efetivo[id]) delete currentDay.efetivo[id];\n        else currentDay.efetivo[id] = true;\n        salvarDiarioDia(false);\n        renderEfetivoDia();\n      };\n    });\n    cont.appendChild(block);\n  });\n  document.getElementById('statPresentes').textContent = totalP;\n  document.getElementById('statAusentes').textContent = totalC - totalP;\n  document.getElementById('statTotal').textContent = totalC;\n}\n\nfunction renderEquipDia() {\n  const cont = document.getElementById('equipList');\n  cont.innerHTML = '';\n  if (state.equipamentos.length === 0) {\n    cont.innerHTML = '\u003cdiv class=\"empty\">Cadastre equipamentos em \u2699\ufe0f Cadastro\u003c/div>';\n    return;\n  }\n  state.equipamentos.forEach(eq => {\n    const dado = currentDay.equipamentos[eq.id];\n    const ativo = !!(dado && dado.ativo);\n    const status = (dado && dado.status) || 'Operando';\n    const opNome = (dado && dado.operadorNome) || '';\n    const opMat = (dado && dado.operadorMat) || '';\n    \n    const row = document.createElement('div');\n    row.className = 'item-row ' + (ativo ? 'checked' : '');\n    const horimetro = (dado && dado.horimetro) || '';\n    row.innerHTML = `\n      \u003cdiv class=\"checkbox\" data-toggle=\"${eq.id}\">\u003c/div>\n      \u003cdiv class=\"item-info\" data-edit=\"${eq.id}\" style=\"cursor:pointer;flex:1\">\n        \u003cdiv class=\"item-name\">${escapeHtml(eq.desc)} ${eq.isMotorista ? '\ud83d\ude9b' : ''}\u003c/div>\n        \u003cdiv class=\"item-meta\">\u003cspan class=\"num\">${escapeHtml(eq.numero)}\u003c/span>${opNome ? ' \u00b7 ' + (opMat ? '\u003cspan class=\"mat\">' + escapeHtml(opMat) + '\u003c/span> ' : '') + escapeHtml(opNome) : ''}\u003c/div>\n        ${ativo ? `\u003cdiv class=\"item-extra\">${status === 'Operando' ? '\u003cspan class=\"badge badge-op\">Operando\u003c/span>' : '\u003cspan class=\"badge badge-pa\">'+status+'\u003c/span>'}${!opNome ? ' \u003cspan style=\"color:var(--red)\">\u26a0 sem operador\u003c/span>' : ''}\u003c/div>` : ''}\n      \u003c/div>\n      ${ativo ? `\n      \u003cdiv style=\"display:flex;flex-direction:column;align-items:center;gap:2px;min-width:68px\" onclick=\"event.stopPropagation()\">\n        \u003cspan style=\"font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-faint)\">\u23f1 Hor\u00edmetro\u003c/span>\n        \u003cinput type=\"number\" step=\"0.1\" min=\"0\" value=\"${escapeHtml(horimetro)}\"\n          placeholder=\"h\"\n          data-hor=\"${eq.id}\"\n          style=\"width:64px;padding:5px 6px;font-size:13px;text-align:center;border:1px solid var(--line);border-radius:5px;background:var(--bg-card);color:var(--ink)\">\n      \u003c/div>` : ''}\n    `;\n    if (ativo) {\n      const horInput = row.querySelector('[data-hor]');\n      if (horInput) {\n        horInput.addEventListener('input', () => {\n          if (currentDay.equipamentos[eq.id]) {\n            currentDay.equipamentos[eq.id].horimetro = horInput.value;\n            salvarDiarioDia(false);\n          }\n        });\n      }\n    }\n    row.querySelector('[data-toggle]').onclick = (e) => {\n      e.stopPropagation();\n      if (ativo) {\n        delete currentDay.equipamentos[eq.id];\n        salvarDiarioDia(false);\n        renderEquipDia();\n      } else {\n        // ao ativar, abre direto o seletor de operador\n        currentDay.equipamentos[eq.id] = { ativo: true, operadorMat: '', operadorNome: '', status: 'Operando' };\n        abrirSeletorEquip(eq.id);\n      }\n    };\n    row.querySelector('[data-edit]').onclick = () => abrirSeletorEquip(eq.id);\n    cont.appendChild(row);\n  });\n  renderVeiculosParados();\n}\n\nfunction abrirSeletorEquip(equipId) {\n  activeEquipId = equipId;\n  const eq = state.equipamentos.find(e => e.id === equipId);\n  const dado = currentDay.equipamentos[equipId] || {};\n  \n  document.getElementById('equipStatusName').textContent = `${eq.numero} \u2014 ${eq.desc}`;\n  document.getElementById('equipStatusStatus').value = dado.status || 'Operando';\n  document.getElementById('equipHorimetro').value = dado.horimetro || '';\n  \n  // tab default\n  opSelectedSource = 'default';\n  opSelectedMat = dado.operadorMat || '';\n  opSelectedNome = dado.operadorNome || '';\n  document.querySelectorAll('.op-tab').forEach((t, i) => {\n    if (i === 0) t.classList.add('active');\n    else t.classList.remove('active');\n  });\n  document.getElementById('opCustom').value = '';\n  document.getElementById('opSearch').value = '';\n  atualizarSeletorOperador();\n  \n  abrirModal('modalEquipStatus');\n}\n\nfunction atualizarSeletorOperador() {\n  const list = document.getElementById('opList');\n  const customInput = document.getElementById('opCustom');\n  const search = document.getElementById('opSearch');\n  \n  if (opSelectedSource === 'custom') {\n    list.style.display = 'none';\n    search.style.display = 'none';\n    customInput.style.display = 'block';\n    customInput.value = opSelectedNome || '';\n    return;\n  }\n  \n  list.style.display = 'block';\n  search.style.display = 'block';\n  customInput.style.display = 'none';\n  \n  const eq = state.equipamentos.find(e => e.id === activeEquipId);\n  const isMot = eq.isMotorista;\n  const searchTerm = (search.value || '').toLowerCase().trim();\n  \n  let categorias = [];\n  // Termos de busca para cada tipo de equipe sugerida\n  const termosOperador = ['operad']; // cobre \"Operadores\", \"Operacional\", \"Opera\u00e7\u00e3o\"\n  const termosMotorista = ['motorist']; // cobre \"Motoristas\", \"Motorista\"\n  const termosSugeridos = isMot ? termosMotorista : termosOperador;\n\n  const catSugerida = state.colaboradores.categorias.find(c =>\n    termosSugeridos.some(t => c.nome.toLowerCase().includes(t))\n  );\n\n  if (opSelectedSource === 'default') {\n    // Aba sugerida: Operadores (equipamentos) ou Motoristas (caminh\u00f5es)\n    if (catSugerida) {\n      categorias = [catSugerida];\n    } else {\n      // Se n\u00e3o achar categoria espec\u00edfica, mostra todas\n      categorias = state.colaboradores.categorias;\n    }\n  } else {\n    // Outras equipes: todas exceto a sugerida\n    categorias = catSugerida\n      ? state.colaboradores.categorias.filter(c => c.id !== catSugerida.id)\n      : state.colaboradores.categorias;\n  }\n  \n  list.innerHTML = '';\n  let temItem = false;\n  categorias.forEach(cat => {\n    const filtrados = cat.itens.filter(c => {\n      if (!searchTerm) return true;\n      return c.nome.toLowerCase().includes(searchTerm) || \n             c.mat.toLowerCase().includes(searchTerm) ||\n             (c.funcao || '').toLowerCase().includes(searchTerm);\n    });\n    if (filtrados.length === 0) return;\n    temItem = true;\n    const label = document.createElement('div');\n    label.className = 'op-cat-label';\n    label.textContent = `${cat.icon || ''} ${cat.nome}`;\n    list.appendChild(label);\n    filtrados.forEach(c => {\n      const item = document.createElement('div');\n      item.className = 'op-item' + (opSelectedMat === c.mat ? ' selected' : '');\n      item.innerHTML = `\n        \u003cdiv class=\"op-item-name\">${escapeHtml(c.nome)}\u003c/div>\n        \u003cdiv class=\"op-item-meta\">\u003cspan class=\"mat\">${escapeHtml(c.mat)}\u003c/span> \u00b7 ${escapeHtml(c.funcao || '')}\u003c/div>\n      `;\n      item.onclick = () => {\n        opSelectedMat = c.mat;\n        opSelectedNome = c.nome;\n        atualizarSeletorOperador();\n      };\n      list.appendChild(item);\n    });\n  });\n  if (!temItem) {\n    list.innerHTML = '\u003cdiv class=\"empty\">Nenhum colaborador encontrado\u003c/div>';\n  }\n}\n\n// pesquisa\ndocument.addEventListener('DOMContentLoaded', () => {\n  const s = document.getElementById('opSearch');\n  if (s) s.addEventListener('input', atualizarSeletorOperador);\n});\n\nfunction salvarEquipStatus() {\n  if (!activeEquipId) return;\n  let nome = '', mat = '';\n  if (opSelectedSource === 'custom') {\n    nome = document.getElementById('opCustom').value.trim();\n    mat = '';\n  } else {\n    nome = opSelectedNome || '';\n    mat = opSelectedMat || '';\n  }\n  currentDay.equipamentos[activeEquipId] = {\n    ativo: true,\n    operadorMat: mat,\n    operadorNome: nome,\n    status: document.getElementById('equipStatusStatus').value,\n    horimetro: document.getElementById('equipHorimetro').value || ''\n  };\n  salvarDiarioDia(false);\n  fecharModal('modalEquipStatus');\n  renderEquipDia();\n  toast(nome ? 'Operador: ' + nome : 'Equipamento ativado');\n}\n\n// VE\u00cdCULOS LEVES NO DI\u00c1RIO (l\u00f3gica igual a equipamentos)\nlet activeVLId = null;\n\nfunction marcarTodosVL(valor) {\n  const frota = state.veiculosFrota || [];\n  frota.forEach(v => {\n    if (valor) {\n      if (!currentDay.veiculosLeves) currentDay.veiculosLeves = [];\n      const jaExiste = currentDay.veiculosLeves.find(x => x.frotaId === v.id);\n      if (!jaExiste) currentDay.veiculosLeves.push({ frotaId: v.id, motoristaNome: '', motoristaMat: '' });\n    } else {\n      if (currentDay.veiculosLeves) currentDay.veiculosLeves = [];\n    }\n  });\n  salvarDiarioDia(false);\n  renderVeiculosLevesDia();\n}\n\nfunction renderVeiculosLevesDia() {\n  const cont = document.getElementById('veiculosLevesList');\n  if (!cont) return;\n  cont.innerHTML = '';\n  const frota = state.veiculosFrota || [];\n  if (frota.length === 0) {\n    cont.innerHTML = '\u003cdiv class=\"empty\">Cadastre ve\u00edculos leves em \u2699\ufe0f Cadastro > Equip.\u003c/div>';\n    return;\n  }\n  const usados = currentDay.veiculosLeves || [];\n  frota.forEach(v => {\n    const dado = usados.find(x => x.frotaId === v.id);\n    const ativo = !!dado;\n    const motNome = dado ? dado.motoristaNome : '';\n    const motMat = dado ? dado.motoristaMat : '';\n    const row = document.createElement('div');\n    row.className = 'item-row ' + (ativo ? 'checked' : '');\n    row.innerHTML = `\n      \u003cdiv class=\"checkbox\" data-vl-toggle=\"${v.id}\">\u003c/div>\n      \u003cdiv class=\"item-info\" data-vl-edit=\"${v.id}\" style=\"cursor:pointer\">\n        \u003cdiv class=\"item-name\">\ud83d\ude97 ${escapeHtml(v.desc)} ${v.placa ? '\u00b7 \u003cspan class=\"num\">'+escapeHtml(v.placa)+'\u003c/span>' : ''}\u003c/div>\n        \u003cdiv class=\"item-meta\">${v.tipo ? escapeHtml(v.tipo)+' \u00b7 ' : ''}${motNome ? '\u003cspan class=\"mat\">'+(motMat||'')+'\u003c/span> '+escapeHtml(motNome) : ''}\u003c/div>\n        ${ativo ? `\u003cdiv class=\"item-extra\">${!motNome ? '\u003cspan style=\"color:var(--red)\">\u26a0 sem motorista\u003c/span>' : '\u003cspan class=\"badge badge-op\">Em uso\u003c/span>'}\u003c/div>` : ''}\n      \u003c/div>\n    `;\n    row.querySelector('[data-vl-toggle]').onclick = (e) => {\n      e.stopPropagation();\n      if (ativo) {\n        currentDay.veiculosLeves = (currentDay.veiculosLeves||[]).filter(x => x.frotaId !== v.id);\n        salvarDiarioDia(false);\n        renderVeiculosLevesDia();\n      } else {\n        if (!currentDay.veiculosLeves) currentDay.veiculosLeves = [];\n        currentDay.veiculosLeves.push({ frotaId: v.id, motoristaNome: '', motoristaMat: '' });\n        abrirSeletorVL(v.id);\n      }\n    };\n    row.querySelector('[data-vl-edit]').onclick = () => { if (ativo) abrirSeletorVL(v.id); };\n    cont.appendChild(row);\n  });\n  renderVeiculosParados();\n}\n\nfunction abrirSeletorVL(vlId) {\n  activeVLId = vlId;\n  const v = (state.veiculosFrota || []).find(x => x.id === vlId);\n  const dado = (currentDay.veiculosLeves || []).find(x => x.frotaId === vlId) || {};\n  document.getElementById('modalVLTitle').textContent = `\ud83d\ude97 ${v.desc} ${v.placa ? '('+v.placa+')' : ''}`;\n  // popular lista de colaboradores\n  const list = document.getElementById('modalVLColabList');\n  list.innerHTML = '';\n  const searchEl = document.getElementById('modalVLSearch');\n  searchEl.value = '';\n  // Separar categoria Motoristas das demais\n  const catMotoristas = state.colaboradores.categorias.find(c => c.nome.toLowerCase().includes('motorist'));\n  const outrasCateg = state.colaboradores.categorias.filter(c => !c.nome.toLowerCase().includes('motorist'));\n\n  const renderVLList = (term) => {\n    list.innerHTML = '';\n    // Mostrar motoristas primeiro (destaque)\n    const categsParaMostrar = catMotoristas\n      ? [catMotoristas, ...outrasCateg]\n      : state.colaboradores.categorias;\n    let temItem = false;\n    categsParaMostrar.forEach(cat => {\n      const filtrados = cat.itens.filter(c =>\n        !term || c.nome.toLowerCase().includes(term) || c.mat.toLowerCase().includes(term)\n      );\n      if (!filtrados.length) return;\n      temItem = true;\n      const lbl = document.createElement('div');\n      lbl.className = 'op-cat-label';\n      lbl.textContent = (cat.icon||'') + ' ' + cat.nome + (cat === catMotoristas ? ' \u2605' : '');\n      list.appendChild(lbl);\n      filtrados.forEach(c => {\n        const item = document.createElement('div');\n        item.className = 'op-item' + (dado.motoristaMat === c.mat ? ' selected' : '');\n        item.innerHTML = `\u003cdiv class=\"op-item-name\">${escapeHtml(c.nome)}\u003c/div>\u003cdiv class=\"op-item-meta\">\u003cspan class=\"mat\">${escapeHtml(c.mat)}\u003c/span> \u00b7 ${escapeHtml(c.funcao||'')}\u003c/div>`;\n        item.onclick = () => {\n          list.querySelectorAll('.op-item').forEach(x => x.classList.remove('selected'));\n          item.classList.add('selected');\n          dado.motoristaMat = c.mat;\n          dado.motoristaNome = c.nome;\n        };\n        list.appendChild(item);\n      });\n    });\n    if (!temItem) list.innerHTML = '\u003cdiv class=\"empty\">Nenhum encontrado\u003c/div>';\n  };\n  searchEl.oninput = () => renderVLList(searchEl.value.toLowerCase().trim());\n  renderVLList('');\n  document.getElementById('modalVLCustomNome').value = dado.motoristaNome || '';\n  abrirModal('modalVeiculoLeve');\n}\n\nfunction salvarVeiculoLeve() {\n  if (!activeVLId) return;\n  if (!currentDay.veiculosLeves) currentDay.veiculosLeves = [];\n  let dado = currentDay.veiculosLeves.find(x => x.frotaId === activeVLId);\n  if (!dado) { dado = { frotaId: activeVLId, motoristaNome: '', motoristaMat: '' }; currentDay.veiculosLeves.push(dado); }\n  // verificar se tem selecionado na lista\n  const selected = document.getElementById('modalVLColabList').querySelector('.op-item.selected');\n  if (selected) {\n    // j\u00e1 foi salvo via onclick, s\u00f3 confirmar\n  } else {\n    // usar campo manual\n    const custom = document.getElementById('modalVLCustomNome').value.trim();\n    dado.motoristaNome = custom;\n    dado.motoristaMat = '';\n  }\n  salvarDiarioDia(false);\n  fecharModal('modalVeiculoLeve');\n  renderVeiculosLevesDia();\n  toast(dado.motoristaNome ? 'Motorista: ' + dado.motoristaNome : 'Ve\u00edculo ativado');\n}\n\nfunction removerVeiculoLeve(idx) {\n  confirmar('Remover este ve\u00edculo do di\u00e1rio?', () => {\n    currentDay.veiculosLeves.splice(idx, 1);\n    salvarDiarioDia(false);\n    renderVeiculosLevesDia();\n  });\n}\n\n// Campo oficial 19 do contrato do Di\u00e1rio: equipamentos e ve\u00edculos leves\n// cadastrados que N\u00c3O est\u00e3o em uso hoje, com justificativa opcional.\nfunction renderVeiculosParados() {\n  const cont = document.getElementById('veiculosParadosList');\n  if (!cont) return;\n  const parados = currentDay.veiculosParados || {};\n  const equipsParados = state.equipamentos.filter(e => !currentDay.equipamentos[e.id]);\n  const vlParados = (state.veiculosFrota || []).filter(v => !(currentDay.veiculosLeves || []).some(x => x.frotaId === v.id));\n  if (!equipsParados.length && !vlParados.length) {\n    cont.innerHTML = '\u003cdiv class=\"empty\">Todos os equipamentos e ve\u00edculos cadastrados est\u00e3o em uso hoje\u003c/div>';\n    return;\n  }\n  const linha = (id, nome) => `\n    \u003cdiv class=\"item-row\" style=\"flex-direction:column;align-items:stretch;gap:6px\">\n      \u003cdiv class=\"item-name\">\ud83c\udd7f\ufe0f ${escapeHtml(nome)}\u003c/div>\n      \u003cinput type=\"text\" placeholder=\"Motivo (manuten\u00e7\u00e3o, sem operador, sem demanda...)\"\n        value=\"${escapeHtml(parados[id] || '')}\" data-just-parado=\"${escapeHtml(id)}\">\n    \u003c/div>`;\n  cont.innerHTML =\n    equipsParados.map(e => linha(e.id, `${e.numero ? e.numero + ' \u2014 ' : ''}${e.desc}`)).join('') +\n    vlParados.map(v => linha(v.id, `${escapeHtml(v.desc)}${v.placa ? ' \u00b7 ' + v.placa : ''}`)).join('');\n  cont.querySelectorAll('[data-just-parado]').forEach(el => {\n    el.addEventListener('input', () => salvarJustParado(el.dataset.justParado, el.value));\n  });\n}\n\nfunction salvarJustParado(id, valor) {\n  if (!currentDay.veiculosParados) currentDay.veiculosParados = {};\n  if (valor.trim()) currentDay.veiculosParados[id] = valor;\n  else delete currentDay.veiculosParados[id];\n  salvarDiarioDia(false);\n}\n\n// EVENTOS\nfunction renderEventosDia(tipo) {\n  const lista = tipo === 'seguranca' ? currentDay.eventosSeguranca : currentDay.eventosAmbiente;\n  const cont = document.getElementById(tipo === 'seguranca' ? 'evSegList' : 'evAmbList');\n  cont.innerHTML = '';\n  if (lista.length === 0) {\n    cont.innerHTML = '\u003cdiv class=\"empty\">Nenhum evento registrado\u003c/div>';\n    return;\n  }\n  lista.forEach((ev, idx) => {\n    const row = document.createElement('div');\n    row.className = 'item-row';\n    row.innerHTML = `\n      \u003cdiv class=\"item-info\">\n        \u003cdiv class=\"item-name\">${escapeHtml(ev.tipo)} ${gravBadge(ev.gravidade)}\u003c/div>\n        ${ev.desc ? `\u003cdiv class=\"item-meta\">${escapeHtml(ev.desc)}\u003c/div>` : ''}\n        ${ev.acao ? `\u003cdiv class=\"item-extra\">A\u00e7\u00e3o: ${escapeHtml(ev.acao)}\u003c/div>` : ''}\n      \u003c/div>\n      \u003cdiv class=\"item-actions\">\n        \u003cbutton class=\"icon-btn\" data-edit=\"${idx}\">\u270f\ufe0f\u003c/button>\n        \u003cbutton class=\"icon-btn\" data-del=\"${idx}\">\ud83d\uddd1\ufe0f\u003c/button>\n      \u003c/div>\n    `;\n    row.querySelector('[data-edit]').onclick = () => editarEventoDia(tipo, idx);\n    row.querySelector('[data-del]').onclick = () => removerEventoDia(tipo, idx);\n    cont.appendChild(row);\n  });\n}\n\nfunction abrirModalEventoDia(tipo) {\n  activeEventoTipo = tipo;\n  activeEventoEditIdx = null;\n  const cadastro = state[tipo];\n  if (cadastro.length === 0) {\n    toast('Cadastre tipos em \u2699\ufe0f ' + (tipo === 'seguranca' ? 'Seguran\u00e7a' : 'Meio Ambiente'));\n    return;\n  }\n  document.getElementById('modalEventoDiaTitle').textContent = \n    tipo === 'seguranca' ? '\ud83e\uddba Evento de Seguran\u00e7a' : '\ud83c\udf31 Evento de Meio Ambiente';\n  const sel = document.getElementById('modalEventoDiaTipo');\n  sel.innerHTML = cadastro.map(c => `\u003coption value=\"${c.id}\">${escapeHtml(c.desc)}\u003c/option>`).join('');\n  document.getElementById('modalEventoDiaDesc').value = '';\n  document.getElementById('modalEventoDiaGrav').value = 'leve';\n  document.getElementById('modalEventoDiaAcao').value = '';\n  abrirModal('modalEventoDia');\n}\nfunction salvarEventoDia() {\n  const tipoId = document.getElementById('modalEventoDiaTipo').value;\n  const cadastro = state[activeEventoTipo];\n  const tipoObj = cadastro.find(c => c.id === tipoId);\n  if (!tipoObj) return;\n  const evento = {\n    id: uid('ev'),\n    tipoId: tipoObj.id,\n    tipo: tipoObj.desc,\n    desc: document.getElementById('modalEventoDiaDesc').value.trim(),\n    gravidade: document.getElementById('modalEventoDiaGrav').value,\n    acao: document.getElementById('modalEventoDiaAcao').value.trim(),\n    custom: false\n  };\n  const arr = activeEventoTipo === 'seguranca' ? currentDay.eventosSeguranca : currentDay.eventosAmbiente;\n  if (activeEventoEditIdx !== null) arr[activeEventoEditIdx] = evento;\n  else arr.push(evento);\n  salvarDiarioDia(false);\n  fecharModal('modalEventoDia');\n  renderEventosDia(activeEventoTipo);\n  toast('Evento registrado');\n}\nfunction abrirModalEventoAvulso(tipo) {\n  activeEventoTipo = tipo;\n  activeEventoEditIdx = null;\n  document.getElementById('modalEventoAvulsoTitle').textContent = \n    tipo === 'seguranca' ? '\ud83e\uddba Evento Avulso de Seguran\u00e7a' : '\ud83c\udf31 Evento Avulso de Meio Ambiente';\n  document.getElementById('modalEventoAvulsoTipo').value = '';\n  document.getElementById('modalEventoAvulsoDesc').value = '';\n  document.getElementById('modalEventoAvulsoGrav').value = 'leve';\n  document.getElementById('modalEventoAvulsoAcao').value = '';\n  abrirModal('modalEventoAvulso');\n}\nfunction salvarEventoAvulso() {\n  const tipoTxt = document.getElementById('modalEventoAvulsoTipo').value.trim();\n  if (!tipoTxt) { toast('Informe o tipo'); return; }\n  const evento = {\n    id: uid('ev'),\n    tipoId: null,\n    tipo: tipoTxt,\n    desc: document.getElementById('modalEventoAvulsoDesc').value.trim(),\n    gravidade: document.getElementById('modalEventoAvulsoGrav').value,\n    acao: document.getElementById('modalEventoAvulsoAcao').value.trim(),\n    custom: true\n  };\n  const arr = activeEventoTipo === 'seguranca' ? currentDay.eventosSeguranca : currentDay.eventosAmbiente;\n  if (activeEventoEditIdx !== null) arr[activeEventoEditIdx] = evento;\n  else arr.push(evento);\n  salvarDiarioDia(false);\n  fecharModal('modalEventoAvulso');\n  renderEventosDia(activeEventoTipo);\n  toast('Evento registrado');\n}\nfunction editarEventoDia(tipo, idx) {\n  activeEventoTipo = tipo;\n  activeEventoEditIdx = idx;\n  const arr = tipo === 'seguranca' ? currentDay.eventosSeguranca : currentDay.eventosAmbiente;\n  const ev = arr[idx];\n  if (ev.custom) {\n    document.getElementById('modalEventoAvulsoTitle').textContent = '\u270f\ufe0f Editar Evento';\n    document.getElementById('modalEventoAvulsoTipo').value = ev.tipo;\n    document.getElementById('modalEventoAvulsoDesc').value = ev.desc;\n    document.getElementById('modalEventoAvulsoGrav').value = ev.gravidade;\n    document.getElementById('modalEventoAvulsoAcao').value = ev.acao;\n    abrirModal('modalEventoAvulso');\n  } else {\n    document.getElementById('modalEventoDiaTitle').textContent = '\u270f\ufe0f Editar Evento';\n    const sel = document.getElementById('modalEventoDiaTipo');\n    sel.innerHTML = state[tipo].map(c => `\u003coption value=\"${c.id}\">${escapeHtml(c.desc)}\u003c/option>`).join('');\n    sel.value = ev.tipoId;\n    document.getElementById('modalEventoDiaDesc').value = ev.desc;\n    document.getElementById('modalEventoDiaGrav').value = ev.gravidade;\n    document.getElementById('modalEventoDiaAcao').value = ev.acao;\n    abrirModal('modalEventoDia');\n  }\n}\nfunction removerEventoDia(tipo, idx) {\n  confirmar('Remover este evento?', () => {\n    const arr = tipo === 'seguranca' ? currentDay.eventosSeguranca : currentDay.eventosAmbiente;\n    arr.splice(idx, 1);\n    salvarDiarioDia(false);\n    renderEventosDia(tipo);\n  });\n}\n\n// ============================================================\n// CONFIG - OBRA / LOGO\n// ============================================================\nfunction salvarConfigObra() {\n  state.obra.nome = document.getElementById('cfgObra').value.trim();\n  state.obra.empresa = document.getElementById('cfgEmpresa').value.trim();\n  state.obra.local = document.getElementById('cfgLocal').value.trim();\n  state.obra.contrato = document.getElementById('cfgContrato').value.trim();\n  state.obra.encerramentoNormal = document.getElementById('cfgEncerramentoNormal').value || '17:00';\n  state.obra.encerramentoSexta = document.getElementById('cfgEncerramentoSexta').value || '16:00';\n  state.obra.encerramentoSabado = document.getElementById('cfgEncerramentoSabado').value || '16:00';\n  saveState();\n  atualizarHeader();\n  atualizarHeaderEdicao();\n  toast('Configura\u00e7\u00f5es salvas');\n}\n\nfunction uploadLogo(event) {\n  const file = event.target.files[0];\n  if (!file) return;\n  if (file.size > 500 * 1024) {\n    toast('Imagem grande. Use at\u00e9 500 KB.');\n    return;\n  }\n  const reader = new FileReader();\n  reader.onload = e => {\n    // redimensiona para 200x200 max\n    const img = new Image();\n    img.onload = () => {\n      const canvas = document.createElement('canvas');\n      const maxSize = 200;\n      let w = img.width, h = img.height;\n      if (w > h && w > maxSize) { h = h * (maxSize/w); w = maxSize; }\n      else if (h > maxSize) { w = w * (maxSize/h); h = maxSize; }\n      canvas.width = w; canvas.height = h;\n      const ctx = canvas.getContext('2d');\n      ctx.fillStyle = '#fff';\n      ctx.fillRect(0,0,w,h);\n      ctx.drawImage(img, 0, 0, w, h);\n      const dataUrl = canvas.toDataURL('image/png');\n      state.obra.logo = dataUrl;\n      saveState();\n      renderLogoPreview();\n      atualizarHeader();\n      toast('Logo carregado');\n    };\n    img.src = e
